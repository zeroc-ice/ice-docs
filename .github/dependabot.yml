version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ['*']
    ignore:
      # typescript-eslint (via eslint-config-next) does not support TypeScript 7
      # yet, and lint fails outright on it. Drop this once it does.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # eslint-plugin-react, jsx-a11y, and import (via eslint-config-next) accept
      # ESLint 9 at most. Drop this once they support 10:
      # https://github.com/jsx-eslint/eslint-plugin-react/issues/3977
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      docker:
        patterns: ['*']
