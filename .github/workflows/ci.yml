name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'

# One active run per ref. On PRs, newer pushes cancel older in-progress runs;
# on main, runs queue instead so an in-flight publish/deploy always finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/zeroc-ice/ice-docs
  SITE_URL: https://dev.docs.zeroc.com
  SITE_NOINDEX: '1'
  GA_MEASUREMENT_ID: G-6J8F67JWKT

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - name: Unit tests (content model)
        run: npm test

      - name: Content structure (navigation, links)
        run: npm run check:content

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

  image:
    name: Build image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm # there is no ubuntu-latest-arm yet
    # Matrix jobs share one set of outputs, so each arch writes its own.
    outputs:
      digest-amd64: ${{ steps.digest.outputs.digest-amd64 }}
      digest-arm64: ${{ steps.digest.outputs.digest-arm64 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          pull: true
          # Attestations show up as extra unknown/unknown entries in the manifest.
          provenance: false
          build-args: |
            SITE_URL=${{ env.SITE_URL }}
            SITE_NOINDEX=${{ env.SITE_NOINDEX }}
            GA_MEASUREMENT_ID=${{ env.GA_MEASUREMENT_ID }}
          # Pushed by digest only; the publish job tags the multi-arch index.
          outputs: >-
            type=image,
            name=${{ env.IMAGE }},
            push-by-digest=true,
            name-canonical=true,
            push=${{ github.event_name != 'pull_request' && github.repository == 'zeroc-ice/ice-docs' }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Record the image digest
        id: digest
        env:
          ARCH: ${{ matrix.arch }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "digest-${ARCH}=${DIGEST}" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish image
    needs: [test, image]
    if: github.event_name != 'pull_request' && github.repository == 'zeroc-ice/ice-docs'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push the multi-arch image
        env:
          DIGEST_AMD64: ${{ needs.image.outputs.digest-amd64 }}
          DIGEST_ARM64: ${{ needs.image.outputs.digest-arm64 }}
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE}:latest" \
            "${IMAGE}@${DIGEST_AMD64}" \
            "${IMAGE}@${DIGEST_ARM64}"

  deploy:
    name: Deploy
    needs: publish
    if: github.event_name != 'pull_request' && github.repository == 'zeroc-ice/ice-docs'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # The server logs in to the registry with this job's token to pull the image.
      packages: read

    steps:
      - name: Deploy docs
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.WEB_HOST }}
          username: ${{ secrets.WEB_USERNAME }}
          key: ${{ secrets.WEB_DEPLOY_KEY }}
          envs: GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            cd /opt/web
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            trap 'docker logout ghcr.io' EXIT
            docker compose pull ice-docs
            docker compose up -d ice-docs
