name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'

# One active run per ref. On PRs, newer pushes cancel older in-progress runs;
# on main, runs queue instead so an in-flight publish/deploy always finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/zeroc-ice/ice-docs
  SITE_URL: https://dev.docs.zeroc.com
  SITE_NOINDEX: '1'

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit tests (content model)
        run: npm test

      - name: Content structure (navigation, links)
        run: npm run check:content

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Production build
        run: npm run build

  image:
    name: Build image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm # there is no ubuntu-latest-arm yet

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          pull: true
          # Attestations show up as extra unknown/unknown entries in the manifest.
          provenance: false
          build-args: |
            SITE_URL=${{ env.SITE_URL }}
            SITE_NOINDEX=${{ env.SITE_NOINDEX }}
          push: ${{ github.event_name != 'pull_request' && github.repository == 'zeroc-ice/ice-docs' }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  publish:
    name: Publish multi-arch tags
    needs: [build, image]
    if: github.event_name != 'pull_request' && github.repository == 'zeroc-ice/ice-docs'
    runs-on: ubuntu-latest

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifests
        run: |
          docker buildx imagetools create \
            --tag ${IMAGE}:${GITHUB_SHA} \
            --tag ${IMAGE}:latest \
            ${IMAGE}:${GITHUB_SHA}-amd64 \
            ${IMAGE}:${GITHUB_SHA}-arm64

  deploy:
    name: Deploy
    needs: publish
    if: github.event_name != 'pull_request' && github.repository == 'zeroc-ice/ice-docs'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy docs
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.WEB_HOST }}
          username: ${{ secrets.WEB_USERNAME }}
          key: ${{ secrets.WEB_DEPLOY_KEY }}
          script: |
            set -e
            cd /opt/web
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            trap 'docker logout ghcr.io' EXIT
            docker compose pull ice-docs
            docker compose up -d ice-docs

  cleanup:
    name: Cleanup old images
    needs: publish
    if: github.event_name != 'pull_request' && github.repository == 'zeroc-ice/ice-docs'
    runs-on: ubuntu-latest

    steps:
      - name: Delete old container images (keep the 10 most recent)
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: ice-docs
          package-type: container
          min-versions-to-keep: 10
