# Redirect manifest for Ice 3.8 — a deliverable, not cleanup. Legacy/Confluence
# URLs -> new URLs. The converter (step 5) will generate most of these from
# the Confluence page IDs; these are hand-written examples wired into
# next.config.ts. `permanent` defaults to false while URLs are still settling.
redirects:
  - from: /ice/3.8/cpp/Ice-Manual/Enumerations
    to: /ice/3.8/slice/user-defined-types/enumerations?lang=cpp
  - from: /ice/3.8/python/Ice-Manual/Enumerations
    to: /ice/3.8/slice/user-defined-types/enumerations?lang=python
  - from: /ice/3.8/cpp/The-Ice-Runtime/Communicator
    to: /ice/3.8/runtime/communicator?lang=cpp
