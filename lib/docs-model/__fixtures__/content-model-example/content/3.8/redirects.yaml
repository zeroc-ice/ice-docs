# Redirect manifest — a deliverable, not cleanup. One entry per legacy URL,
# keyed to the stable pageId so the language switcher / analytics never guess
# from the URL. Generated by the converter (step 5); this is the shape.
redirects:
  # Legacy Confluence pretty-URL -> new flat URL, per language.
  - pageId: enumerations
    confluencePageId: '360480' # from data/IceDoc/pages/<id>.json
    from: /ice/3.8/cpp/Ice-Manual/Enumerations
    to: /ice/3.8/cpp/enumerations
  - pageId: enumerations
    confluencePageId: '360480'
    from: /ice/3.8/python/Ice-Manual/Enumerations
    to: /ice/3.8/python/enumerations
  # A language-neutral landing redirect (no language in the source URL) resolves
  # via the reader's preferred-language cookie, defaulting to cpp.
  - pageId: enumerations
    from: /ice/3.8/enumerations
    to: /ice/3.8/cpp/enumerations
