<?xml version="1.0" encoding="UTF-8"?>
<svg
  width="700"
  height="300"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 700 300"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Diagram title</title>
  <desc id="description">Describe the components and their important relationships.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7.2" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="var(--diagram-connector)"/>
    </marker>
    <marker id="inheritance-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path
        d="M 1 1 L 11 6 L 1 11 Z"
        fill="var(--diagram-canvas)"
        stroke="var(--diagram-inheritance)"
        stroke-linejoin="round"
        stroke-width="1.8"
      />
    </marker>
    <g id="step-badge-shape">
      <circle class="step-badge" cx="0" cy="0" r="12" vector-effect="non-scaling-stroke"/>
    </g>
    <symbol id="document-shape" viewBox="0 0 160 92" preserveAspectRatio="none">
      <path d="M 1 1 H 159 V 76 C 134 65 118 91 89 79 C 60 67 37 91 1 76 Z" vector-effect="non-scaling-stroke"/>
    </symbol>
  </defs>

  <style>
    :root {
      --diagram-canvas: #ffffff;
      --diagram-component: #ffffff;
      --diagram-text: #182235;
      --diagram-secondary-text: #566174;
      --diagram-connector: #566174;
      --diagram-component-stroke: #8d99aa;
      --diagram-runtime-stroke: #1259d6;
      --diagram-runtime: #eef5ff;
      --diagram-host-stroke: #cbd3de;
      --diagram-host: #fbfcfe;
      --diagram-host-knockout: #ffffff;
      --diagram-divider: #a6afbc;
      --diagram-api: #f8fbff;
      --diagram-api-stroke: #4f78bb;
      --diagram-network: #7a8699;
      --diagram-firewall: #eef0f3;
      --diagram-generated: #f3f0f7;
      --diagram-generated-stroke: #75658f;
      --diagram-api-label: #365f9e;
      --diagram-generated-label: #68587e;
      --diagram-inheritance: #465266;
      --diagram-blocked: #b42318;
      --diagram-data: #f6f7f9;
    }

    @media screen and (prefers-color-scheme: dark) {
      :root {
        --diagram-canvas: #1a1c21;
        --diagram-component: #232429;
        --diagram-text: #e6ebf4;
        --diagram-secondary-text: #a7b3c6;
        --diagram-connector: #a7b3c6;
        --diagram-component-stroke: #8391a6;
        --diagram-runtime-stroke: #6aa6ff;
        --diagram-runtime: #21324c;
        --diagram-host-stroke: #667389;
        --diagram-host: #20232b;
        --diagram-host-knockout: #20232b;
        --diagram-divider: #667389;
        --diagram-api: #202c3e;
        --diagram-api-stroke: #7da7e6;
        --diagram-network: #8391a6;
        --diagram-firewall: #2c3039;
        --diagram-generated: #312b3e;
        --diagram-generated-stroke: #b6a0d2;
        --diagram-api-label: #9cc4ff;
        --diagram-generated-label: #d1bdea;
        --diagram-inheritance: #a7b3c6;
        --diagram-blocked: #ff938a;
        --diagram-data: #292e38;
      }
    }

    text {
      fill: var(--diagram-text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .process-boundary {
      fill: var(--diagram-host);
      stroke: var(--diagram-host-stroke);
      stroke-dasharray: 7 5;
      stroke-width: 1.5;
    }

    .api-boundary {
      fill: var(--diagram-api);
      stroke: var(--diagram-api-stroke);
      stroke-width: 1.5;
    }

    .component {
      fill: var(--diagram-component);
      stroke: var(--diagram-component-stroke);
      stroke-width: 1.5;
    }

    .actor {
      fill: var(--diagram-component);
      stroke: var(--diagram-component-stroke);
      stroke-width: 1.5;
    }

    .state,
    .interface {
      fill: var(--diagram-component);
      stroke: var(--diagram-component-stroke);
      stroke-width: 1.5;
    }

    .initial-state,
    .final-state-inner {
      fill: var(--diagram-text);
    }

    .final-state-outer {
      fill: var(--diagram-canvas);
      stroke: var(--diagram-text);
      stroke-width: 1.75;
    }

    .runtime,
    .service {
      fill: var(--diagram-runtime);
      stroke: var(--diagram-runtime-stroke);
      stroke-width: 1.75;
    }

    .generated,
    .generated-document {
      fill: var(--diagram-generated);
      stroke: var(--diagram-generated-stroke);
      stroke-width: 1.75;
    }

    .slice-document {
      fill: var(--diagram-api);
      stroke: var(--diagram-api-stroke);
      stroke-width: 1.5;
    }

    .source-document {
      fill: var(--diagram-component);
      stroke: var(--diagram-component-stroke);
      stroke-width: 1.5;
    }

    .firewall {
      fill: var(--diagram-firewall);
      stroke: var(--diagram-connector);
      stroke-width: 1.75;
    }

    .data {
      fill: var(--diagram-data);
      stroke: var(--diagram-component-stroke);
      stroke-width: 1.25;
    }

    .network-boundary {
      fill: none;
      stroke: var(--diagram-network);
      stroke-dasharray: 7 5;
      stroke-width: 1.5;
    }

    .divider {
      fill: none;
      stroke: var(--diagram-divider);
      stroke-width: 1.25;
    }

    .connector {
      fill: none;
      stroke: var(--diagram-connector);
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.75;
    }

    .association {
      marker-end: none;
      marker-start: none;
    }

    .two-way {
      marker-end: url(#arrow);
      marker-start: url(#arrow);
    }

    .one-way,
    .callback {
      marker-end: url(#arrow);
    }

    .callback {
      stroke-dasharray: 6 4;
    }

    .blocked {
      stroke: var(--diagram-blocked);
      stroke-dasharray: 6 4;
    }

    .blocked-cross {
      stroke: var(--diagram-blocked);
    }

    .topic-link {
      marker-end: url(#arrow);
      stroke-dasharray: 1 5;
    }

    .through-firewall {
      stroke-dasharray: 2 5;
    }

    .alternate {
      marker-end: url(#arrow);
      stroke-dasharray: 10 4 2 4;
    }

    .inheritance {
      fill: none;
      marker-end: url(#inheritance-arrow);
      stroke: var(--diagram-inheritance);
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 2;
    }

    .label-knockout {
      fill: var(--diagram-canvas);
    }

    .host-label-knockout {
      fill: var(--diagram-host-knockout);
    }

    .process-title {
      font-size: 17px;
      font-weight: 650;
      text-anchor: middle;
    }

    .boundary-title,
    .component-label,
    .connector-label {
      font-size: 16px;
      font-weight: 600;
      text-anchor: middle;
    }

    .connector-label {
      font-size: 14px;
    }

    .annotation {
      fill: var(--diagram-secondary-text);
      font-size: 14px;
      font-weight: 500;
      text-anchor: middle;
    }

    .major-label,
    .actor-label,
    .state-label,
    .interface-name {
      font-size: 16px;
      font-weight: 600;
      text-anchor: middle;
    }

    .file-label {
      font-size: 15px;
      font-weight: 600;
      text-anchor: middle;
    }

    .zone-label {
      fill: var(--diagram-secondary-text);
      font-size: 14px;
      font-weight: 650;
    }

    .legend-label {
      fill: var(--diagram-secondary-text);
      font-size: 14px;
      font-weight: 500;
    }

    .file-label,
    .interface-name,
    .code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }

    .step-badge {
      fill: var(--diagram-canvas);
      stroke: var(--diagram-runtime-stroke);
      stroke-width: 1.5;
    }

    .step-number {
      fill: var(--diagram-runtime-stroke);
      font-size: 13px;
      font-weight: 700;
      text-anchor: middle;
    }

    .category-badge {
      font-size: 13px;
      font-weight: 750;
      letter-spacing: 0.05em;
      text-anchor: middle;
    }

    .api-badge {
      fill: var(--diagram-api-label);
    }

    .generated-badge {
      fill: var(--diagram-generated-label);
    }

    .slice-badge {
      fill: var(--diagram-api-label);
    }

    .source-badge,
    .interface-badge {
      fill: var(--diagram-secondary-text);
    }
  </style>

  <rect width="700" height="300" fill="var(--diagram-canvas)"/>

  <!-- Every stroked shape and path must set vector-effect="non-scaling-stroke". -->
  <g id="boundaries" aria-hidden="true">
    <!-- Process, host, network, and API boundaries. -->
    <!-- Network zone example; its .zone-label texts go in the labels group:
         <path class="network-boundary" d="M X Y1 V Y2" vector-effect="non-scaling-stroke"/>
         <text class="zone-label" x="X-12" y="Y1+14" text-anchor="end">Public network</text>
         <text class="zone-label" x="X+12" y="Y1+14">Private network</text> -->
  </g>
  <g id="connectors" aria-hidden="true">
    <!-- One-way, two-way, callback, association, blocked, topic-link, through-firewall, and inheritance paths. -->
    <!-- Blocked example, drawn where the connection is refused:
         <path class="connector blocked-cross" d="M X1 Y1 L X2 Y2 M X1 Y2 L X2 Y1"
               vector-effect="non-scaling-stroke"/> -->
  </g>
  <g id="components" aria-hidden="true">
    <!-- Applications, actors, interfaces, states, documents, runtimes, generated code, and services. -->
    <!-- Firewall example, 96 units wide; a traversing connection continues across it:
         <rect class="firewall" x="X" y="Y" width="96" height="H" rx="3" vector-effect="non-scaling-stroke"/>
         <path class="connector through-firewall" d="M X Yc H X+96" vector-effect="non-scaling-stroke"/>
         Label: <text class="component-label" x="X+48" y="Y+26">Firewall</text> -->
    <!-- Glacier2 example, 240 × 136 with a 40-unit header and two endpoint cells:
         <rect class="service" x="X" y="Y" width="240" height="136" rx="8" vector-effect="non-scaling-stroke"/>
         <path class="divider" d="M X Y+40 H X+240 M X+120 Y+40 V Y+136" vector-effect="non-scaling-stroke"/>
         Labels: "Glacier2" at (X+120, Y+26); "Client" / "endpoints" centered at X+60 and "Server" / "endpoints"
         centered at X+180, first baseline Y+82, second Y+102; addresses as annotations from Y+136+24. -->
    <!-- Data in transit example: <rect class="data" x="X" y="Y" width="W" height="30" rx="4"
         vector-effect="non-scaling-stroke"/> with an .annotation label. -->
  </g>
  <g id="labels">
    <!-- Titles, component labels, label knockouts, annotations, and numbered step badges. -->
    <!-- Badge example: <use href="#step-badge-shape" transform="translate(X Y)"/> followed by native <text>. -->
    <!-- Document example: <use href="#document-shape" class="generated" x="X" y="Y" width="160" height="92"/>. -->
    <!-- Legend example, below the drawing and left-aligned with it; entries in one row are 28 units apart:
         <path class="connector one-way" d="M X Y H X+36" vector-effect="non-scaling-stroke"/>
         <text class="legend-label" x="X+46" y="Y+5">Request</text>
         <path class="connector callback" d="M X2 Y H X2+36" vector-effect="non-scaling-stroke"/>
         <text class="legend-label" x="X2+46" y="Y+5">Callback</text> -->
  </g>
</svg>
