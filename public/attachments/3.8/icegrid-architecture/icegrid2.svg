<?xml version="1.0" encoding="UTF-8"?>
<svg
  width="700"
  height="175"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 980 245"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">IceGrid architecture on blade hosts</title>
  <desc id="description">
    Blade 1 runs the registry, Node 1, and Server 1. Blade 2 runs Node 2 and Server 2. Further blades follow the
    same pattern through Blade N.
  </desc>

  <style>
    text {
      fill: #182235;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .label {
      font-size: 16px;
      font-weight: 600;
      text-anchor: middle;
    }
    .application {
      fill: #ffffff;
      stroke: #8d99aa;
      stroke-width: 1.5;
    }
    .runtime {
      fill: #eef5ff;
      stroke: #1259d6;
      stroke-width: 1.75;
    }
    .boundary {
      fill: #fbfcfe;
      stroke: #cbd3de;
      stroke-width: 1.5;
      stroke-dasharray: 7 5;
    }
  </style>

  <rect width="980" height="245" fill="#ffffff"/>

  <g id="boundaries" aria-hidden="true">
    <rect class="boundary" x="24" y="24" width="250" height="195" rx="14" vector-effect="non-scaling-stroke"/>
    <rect class="boundary" x="320" y="24" width="250" height="195" rx="14" vector-effect="non-scaling-stroke"/>
    <rect class="boundary" x="706" y="24" width="250" height="195" rx="14" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="connectors" aria-hidden="true">
  </g>

  <g id="components" aria-hidden="true">
    <rect class="runtime" x="54" y="66" width="190" height="38" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="runtime" x="54" y="116" width="190" height="38" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="application" x="54" y="166" width="190" height="38" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="runtime" x="350" y="84" width="190" height="48" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="application" x="350" y="150" width="190" height="48" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="runtime" x="736" y="84" width="190" height="48" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="application" x="736" y="150" width="190" height="48" rx="7" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="labels">
    <text class="label" x="149.0" y="49">Host: Blade 1</text>
    <text class="label" x="149.0" y="90.0">Registry</text>
    <text class="label" x="149.0" y="140.0">Node 1</text>
    <text class="label" x="149.0" y="190.0">Server 1</text>
    <text class="label" x="445.0" y="49">Host: Blade 2</text>
    <text class="label" x="445.0" y="113.0">Node 2</text>
    <text class="label" x="445.0" y="179.0">Server 2</text>
    <text class="label" x="831.0" y="49">Host: Blade N</text>
    <text class="label" x="831.0" y="113.0">Node N</text>
    <text class="label" x="831.0" y="179.0">Server N</text>
    <text class="label" x="638" y="132">⋯</text>
  </g>
</svg>
