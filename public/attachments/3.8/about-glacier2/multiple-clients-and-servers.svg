<?xml version="1.0" encoding="UTF-8"?>
<svg
  width="700"
  height="228.57"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 980 320"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Multiple clients and servers with Glacier2</title>
  <desc id="description">
    Clients A and B use bidirectional connections through their firewall to Glacier2. Glacier2 forwards requests to
    servers A and B, which send callbacks to Glacier2 over separate connections.
  </desc>

  <defs>
    <marker
      id="arrow"
      viewBox="0 0 8 8"
      refX="7.2"
      refY="4"
      markerWidth="7"
      markerHeight="7"
      orient="auto-start-reverse"
    >
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#566174"/>
    </marker>
  </defs>

  <style>
    text {
      fill: #182235;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .label {
      font-size: 16px;
      font-weight: 600;
      text-anchor: middle;
    }
    .annotation {
      fill: #566174;
      font-size: 14px;
      text-anchor: middle;
    }
    .application {
      fill: #ffffff;
      stroke: #8d99aa;
      stroke-width: 1.5;
    }
    .runtime {
      fill: #eef5ff;
      stroke: #1259d6;
      stroke-width: 1.75;
    }
    .network-boundary {
      fill: none;
      stroke: #7a8699;
      stroke-width: 1.5;
      stroke-dasharray: 7 5;
    }
    .connector {
      fill: none;
      stroke: #566174;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .one-way {
      marker-end: url(#arrow);
    }
    .two-way {
      marker-start: url(#arrow);
      marker-end: url(#arrow);
    }
    .callback {
      stroke-dasharray: 6 4;
      marker-end: url(#arrow);
    }
  </style>

  <rect width="980" height="320" fill="#ffffff"/>

  <g id="boundaries" aria-hidden="true">
    <path class="network-boundary" d="M 490 18 V 248" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="connectors" aria-hidden="true">
    <path class="connector two-way" d="M 174 67 L 290 67" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 710 82 L 806 82" vector-effect="non-scaling-stroke"/>
    <path class="connector callback" d="M 806 50 L 710 50" vector-effect="non-scaling-stroke"/>
    <path class="connector two-way" d="M 174 193 L 290 193" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 710 208 L 806 208" vector-effect="non-scaling-stroke"/>
    <path class="connector callback" d="M 806 176 L 710 176" vector-effect="non-scaling-stroke"/>
    <path class="connector two-way" d="M 440 130 L 560 130" vector-effect="non-scaling-stroke"/>
    <path class="connector two-way" d="M 175 282 L 220 282" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 470 282 L 515 282" vector-effect="non-scaling-stroke"/>
    <path class="connector callback" d="M 680 282 L 725 282" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="components" aria-hidden="true">
    <rect class="application" x="24" y="24" width="150" height="86" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="application" x="806" y="24" width="150" height="86" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="application" x="24" y="150" width="150" height="86" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="application" x="806" y="150" width="150" height="86" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="application" x="290" y="24" width="150" height="212" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="runtime" x="560" y="24" width="150" height="212" rx="7" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="labels">
    <text class="label" x="99.0" y="72.0">Client A</text>
    <text class="label" x="881.0" y="72.0">Server A</text>
    <text class="label" x="99.0" y="198.0">Client B</text>
    <text class="label" x="881.0" y="198.0">Server B</text>
    <text class="label" x="365.0" y="135.0">Firewall</text>
    <text class="label" x="635.0" y="135.0">Glacier2</text>
    <text class="annotation" x="318" y="287">Bidirectional connection</text>
    <text class="annotation" x="562" y="287">Request</text>
    <text class="annotation" x="775" y="287">Callback</text>
  </g>
</svg>
