<?xml version="1.0" encoding="UTF-8"?>
<svg
  width="700"
  height="228.57"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 980 320"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Firewall traversal: 3</title>
  <desc id="description">
    Two clients and two servers exchange requests and callbacks through the same pair of firewalls. Separate arrows
    show requests and callbacks.
  </desc>

  <defs>
    <marker
      id="arrow"
      viewBox="0 0 8 8"
      refX="7.2"
      refY="4"
      markerWidth="7"
      markerHeight="7"
      orient="auto-start-reverse"
    >
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#566174"/>
    </marker>
  </defs>

  <style>
    text {
      fill: #182235;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .label {
      font-size: 16px;
      font-weight: 600;
      text-anchor: middle;
    }
    .annotation {
      fill: #566174;
      font-size: 14px;
      text-anchor: middle;
    }
    .application {
      fill: #ffffff;
      stroke: #8d99aa;
      stroke-width: 1.5;
    }
    .network-boundary {
      fill: none;
      stroke: #7a8699;
      stroke-width: 1.5;
      stroke-dasharray: 7 5;
    }
    .connector {
      fill: none;
      stroke: #566174;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .one-way {
      marker-end: url(#arrow);
    }
    .callback {
      stroke-dasharray: 6 4;
      marker-end: url(#arrow);
    }
  </style>

  <rect width="980" height="320" fill="#ffffff"/>

  <g id="boundaries" aria-hidden="true">
    <path class="network-boundary" d="M 490 18 V 250" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="connectors" aria-hidden="true">
    <path class="connector one-way" d="M 174 82 L 290 82" vector-effect="non-scaling-stroke"/>
    <path class="connector callback" d="M 290 50 L 174 50" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 710 82 L 806 82" vector-effect="non-scaling-stroke"/>
    <path class="connector callback" d="M 806 50 L 710 50" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 174 208 L 290 208" vector-effect="non-scaling-stroke"/>
    <path class="connector callback" d="M 290 176 L 174 176" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 710 208 L 806 208" vector-effect="non-scaling-stroke"/>
    <path class="connector callback" d="M 806 176 L 710 176" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 440 108 L 560 108" vector-effect="non-scaling-stroke"/>
    <path class="connector callback" d="M 560 150 L 440 150" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 230 286 L 280 286" vector-effect="non-scaling-stroke"/>
    <path class="connector callback" d="M 450 286 L 500 286" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="components" aria-hidden="true">
    <rect class="application" x="24" y="24" width="150" height="86" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="application" x="806" y="24" width="150" height="86" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="application" x="24" y="150" width="150" height="86" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="application" x="806" y="150" width="150" height="86" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="application" x="290" y="24" width="150" height="212" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="application" x="560" y="24" width="150" height="212" rx="7" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="labels">
    <text class="label" x="99.0" y="72.0">Client A</text>
    <text class="label" x="881.0" y="72.0">Server A</text>
    <text class="label" x="99.0" y="198.0">Client B</text>
    <text class="label" x="881.0" y="198.0">Server B</text>
    <text class="label" x="365.0" y="135.0">Firewall</text>
    <text class="label" x="635.0" y="135.0">Firewall</text>
    <text class="annotation" x="335" y="291">Request</text>
    <text class="annotation" x="558" y="291">Callback</text>
  </g>
</svg>
