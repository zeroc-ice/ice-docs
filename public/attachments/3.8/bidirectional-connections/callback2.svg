<?xml version="1.0" encoding="UTF-8"?>
<svg
  width="700"
  height="225.66"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 760 245"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">A client firewall blocks a callback connection</title>
  <desc id="description">
    The client can open a connection to the server through its firewall, but the firewall blocks a separate incoming
    callback connection from the server.
  </desc>

  <defs>
    <marker
      id="arrow"
      viewBox="0 0 8 8"
      refX="7.2"
      refY="4"
      markerWidth="7"
      markerHeight="7"
      orient="auto-start-reverse"
    >
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#566174"/>
    </marker>
  </defs>

  <style>
    text {
      fill: #182235;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .label {
      font-size: 16px;
      font-weight: 600;
      text-anchor: middle;
    }
    .annotation {
      fill: #566174;
      font-size: 14px;
      text-anchor: middle;
    }
    .application {
      fill: #ffffff;
      stroke: #8d99aa;
      stroke-width: 1.5;
    }
    .network-boundary {
      fill: none;
      stroke: #7a8699;
      stroke-width: 1.5;
      stroke-dasharray: 7 5;
    }
    .connector {
      fill: none;
      stroke: #566174;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .one-way {
      marker-end: url(#arrow);
    }
    .blocked-cross {
      stroke: #b42318;
    }
    .blocked {
      stroke: #b42318;
      stroke-dasharray: 6 4;
    }
  </style>

  <rect width="760" height="245" fill="#ffffff"/>

  <g id="boundaries" aria-hidden="true">
    <path class="network-boundary" d="M 520 18 V 180" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="connectors" aria-hidden="true">
    <path class="connector one-way" d="M 164 98 L 310 98" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 450 98 L 596 98" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="components" aria-hidden="true">
    <rect class="application" x="24" y="60" width="140" height="110" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="application" x="310" y="60" width="140" height="110" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="application" x="596" y="60" width="140" height="110" rx="7" vector-effect="non-scaling-stroke"/>
    <path class="connector blocked" d="M 596 148 H 366" vector-effect="non-scaling-stroke"/>
    <path
      class="connector blocked-cross"
      d="M 355 137 L 377 159 M 355 159 L 377 137"
      vector-effect="non-scaling-stroke"
    />
  </g>

  <g id="labels">
    <text class="label" x="94.0" y="120.0">Client</text>
    <text class="label" x="380.0" y="120.0">Firewall</text>
    <text class="label" x="666.0" y="120.0">Server</text>
    <text class="annotation" x="380" y="210">Incoming callback connection blocked</text>
  </g>
</svg>
