<?xml version="1.0" encoding="UTF-8"?>
<svg
  width="700"
  height="396.67"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 900 510"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Topic federation in IceStorm</title>
  <desc id="description">
    Publisher P1 publishes to T2, P2 to T1, and P3 to T3. T1 has links to T2 and T3 and sends to subscriber S3. T2
    sends to S1 and S2; T3 sends to S4. Dotted arrows show topic links; solid arrows show message delivery.
  </desc>

  <defs>
    <marker
      id="arrow"
      viewBox="0 0 8 8"
      refX="7.2"
      refY="4"
      markerWidth="7"
      markerHeight="7"
      orient="auto-start-reverse"
    >
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#566174"/>
    </marker>
  </defs>

  <style>
    text {
      fill: #182235;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .label {
      font-size: 16px;
      font-weight: 600;
      text-anchor: middle;
    }
    .application {
      fill: #ffffff;
      stroke: #8d99aa;
      stroke-width: 1.5;
    }
    .runtime {
      fill: #eef5ff;
      stroke: #1259d6;
      stroke-width: 1.75;
    }
    .boundary {
      fill: #fbfcfe;
      stroke: #cbd3de;
      stroke-width: 1.5;
      stroke-dasharray: 7 5;
    }
    .connector {
      fill: none;
      stroke: #566174;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .topic-link {
      stroke-dasharray: 1 5;
    }
    .legend-label {
      fill: #566174;
      font-size: 14px;
      text-anchor: middle;
    }
    .one-way {
      marker-end: url(#arrow);
    }
  </style>

  <rect width="900" height="510" fill="#ffffff"/>

  <g id="boundaries" aria-hidden="true">
    <rect class="boundary" x="300" y="24" width="330" height="412" rx="14" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="connectors" aria-hidden="true">
    <path class="connector one-way" d="M 275 472 H 315" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way topic-link" d="M 495 472 H 535" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 104 100 L 550 100" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 104 220 L 350 220" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 104 340 L 550 340" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way topic-link" d="M 406 205 L 554 115" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way topic-link" d="M 406 235 L 554 325" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 610 100 L 796 55" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 610 100 L 796 165" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 410 220 L 796 275" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 610 340 L 796 385" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="components" aria-hidden="true">
    <rect class="application" x="24" y="72" width="80" height="56" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="application" x="24" y="192" width="80" height="56" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="application" x="24" y="312" width="80" height="56" rx="7" vector-effect="non-scaling-stroke"/>
    <circle class="runtime" cx="380" cy="220" r="30" vector-effect="non-scaling-stroke"/>
    <circle class="runtime" cx="580" cy="100" r="30" vector-effect="non-scaling-stroke"/>
    <circle class="runtime" cx="580" cy="340" r="30" vector-effect="non-scaling-stroke"/>
    <rect class="application" x="796" y="27" width="80" height="56" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="application" x="796" y="137" width="80" height="56" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="application" x="796" y="247" width="80" height="56" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="application" x="796" y="357" width="80" height="56" rx="7" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="labels">
    <text class="legend-label" x="385" y="477">Message delivery</text>
    <text class="legend-label" x="590" y="477">Topic link</text>
    <text class="label" x="465.0" y="49">IceStorm</text>
    <text class="label" x="64.0" y="105.0">P1</text>
    <text class="label" x="64.0" y="225.0">P2</text>
    <text class="label" x="64.0" y="345.0">P3</text>
    <text class="label" x="380" y="225">T1</text>
    <text class="label" x="580" y="105">T2</text>
    <text class="label" x="580" y="345">T3</text>
    <text class="label" x="836.0" y="60.0">S1</text>
    <text class="label" x="836.0" y="170.0">S2</text>
    <text class="label" x="836.0" y="280.0">S3</text>
    <text class="label" x="836.0" y="390.0">S4</text>
  </g>
</svg>
