<?xml version="1.0" encoding="UTF-8"?>
<svg
  width="700"
  height="268"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 700 268"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Marshaling encoding format for exceptions</title>
  <desc id="description">
    The encoding 1.0 exceptions layout starts with a uses-classes flag, followed by a type ID and member slice for
    each inheritance level. Optional class instances follow the exception slices.
  </desc>

  <style>
    text {
      fill: #182235;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .annotation {
      fill: #566174;
      font-size: 14px;
      text-anchor: middle;
    }
    .code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }
    .api {
      fill: #f8fbff;
      stroke: #4f78bb;
      stroke-width: 1.5;
    }
    .boundary {
      fill: #fbfcfe;
      stroke: #cbd3de;
      stroke-width: 1.5;
      stroke-dasharray: 7 5;
    }
    .connector {
      fill: none;
      stroke: #566174;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .divider {
      fill: none;
      stroke: #a6afbc;
      stroke-width: 1.25;
    }
  </style>

  <rect width="700" height="268" fill="#ffffff"/>

  <g id="boundaries" aria-hidden="true">
  </g>

  <g id="connectors" aria-hidden="true">
  </g>

  <g id="components" aria-hidden="true">
    <rect class="api" x="24" y="24" width="350" height="220" rx="0" vector-effect="non-scaling-stroke"/>
    <path class="divider" d="M 24 68 H 374" vector-effect="non-scaling-stroke"/>
    <path class="divider boundary" d="M 24 112 H 374" vector-effect="non-scaling-stroke"/>
    <path class="divider" d="M 24 156 H 374" vector-effect="non-scaling-stroke"/>
    <path class="divider" d="M 24 200 H 374" vector-effect="non-scaling-stroke"/>
    <path class="connector" d="M 390 68 H 414 V 200 H 390 M 414 134.0 H 434" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="labels">
    <text class="annotation code" x="199" y="52">Uses classes (bool)</text>
    <text class="annotation code" x="199" y="96">Type ID (string)</text>
    <text class="annotation" x="199" y="140">Slice for members</text>
    <text class="annotation" x="199" y="184">⋮</text>
    <text class="annotation" x="199" y="228">Class instances (optional)</text>
    <text class="annotation" x="555" y="94">
      <tspan x="555" dy="0">Repeating group: one</tspan>
      <tspan x="555" dy="20">pair of type ID and slice</tspan>
      <tspan x="555" dy="20">containing members for</tspan>
      <tspan x="555" dy="20">each level of the</tspan>
      <tspan x="555" dy="20">inheritance hierarchy</tspan>
    </text>
  </g>
</svg>
