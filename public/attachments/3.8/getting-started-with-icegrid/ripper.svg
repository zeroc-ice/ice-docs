<?xml version="1.0" encoding="UTF-8"?>
<svg
  width="700"
  height="238"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1000 340"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Locating an encoder server</title>
  <desc id="description">
    The client first locates EncoderAdapter through the registry on ComputeServer. The client then invokes encode on
    EncoderServer.
  </desc>

  <defs>
    <marker
      id="arrow"
      viewBox="0 0 8 8"
      refX="7.2"
      refY="4"
      markerWidth="7"
      markerHeight="7"
      orient="auto-start-reverse"
    >
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#566174"/>
    </marker>
    <circle
      id="step-badge-shape"
      cx="0"
      cy="0"
      r="12"
      fill="#ffffff"
      stroke="#1259d6"
      stroke-width="1.5"
      vector-effect="non-scaling-stroke"
    />
  </defs>

  <style>
    text {
      fill: #182235;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .label {
      font-size: 18px;
      font-weight: 600;
      text-anchor: middle;
    }
    .annotation {
      fill: #566174;
      font-size: 17px;
      text-anchor: middle;
    }
    .application {
      fill: #ffffff;
      stroke: #8d99aa;
      stroke-width: 1.5;
    }
    .runtime {
      fill: #eef5ff;
      stroke: #1259d6;
      stroke-width: 1.75;
    }
    .boundary {
      fill: #fbfcfe;
      stroke: #cbd3de;
      stroke-width: 1.5;
      stroke-dasharray: 7 5;
    }
    .connector {
      fill: none;
      stroke: #566174;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .one-way {
      marker-end: url(#arrow);
    }
  </style>

  <rect width="1000" height="340" fill="#ffffff"/>

  <g id="boundaries" aria-hidden="true">
    <rect class="boundary" x="24" y="110" width="220" height="170" rx="14" vector-effect="non-scaling-stroke"/>
    <rect class="boundary" x="560" y="24" width="416" height="292" rx="14" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="connectors" aria-hidden="true">
    <path class="connector one-way" d="M 204 190 L 772 116" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 204 220 L 600 251" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="components" aria-hidden="true">
    <rect class="application" x="64" y="176" width="140" height="62" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="runtime" x="772" y="85" width="170" height="62" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="application" x="600" y="220" width="170" height="62" rx="7" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="labels">
    <text class="label" x="134.0" y="135">Client PC</text>
    <text class="label" x="134.0" y="212.0">Client</text>
    <text class="label" x="768.0" y="49">Host: ComputeServer</text>
    <text class="label" x="857.0" y="121.0">Registry</text>
    <text class="label" x="685.0" y="256.0">EncoderServer</text>
    <use href="#step-badge-shape" x="340" y="151"/>
    <text class="annotation" x="340" y="156">1</text>
    <rect x="362.0" y="140" width="192" height="24" rx="4" fill="#ffffff"/>
    <text class="annotation" x="458" y="156">locate(EncoderAdapter)</text>
    <use href="#step-badge-shape" x="354" y="239"/>
    <text class="annotation" x="354" y="244">2</text>
    <rect x="376.0" y="228" width="64" height="24" rx="4" fill="#ffffff"/>
    <text class="annotation" x="408" y="244">encode</text>
  </g>
</svg>
