<?xml version="1.0" encoding="UTF-8"?>
<svg
  width="700"
  height="226.85"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1080 350"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Glacier2 behind an external firewall</title>
  <desc id="description">
    The public client at 1.2.3.4 connects through the firewall at 5.6.7.8 port 4064 to Glacier2 client endpoints at
    10.0.0.1 port 9998. Callbacks reuse that connection. The private server at 10.0.0.2 sends callbacks to Glacier2
    server endpoints at 10.0.0.1 port 9999.
  </desc>

  <defs>
    <marker
      id="arrow"
      viewBox="0 0 8 8"
      refX="7.2"
      refY="4"
      markerWidth="7"
      markerHeight="7"
      orient="auto-start-reverse"
    >
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#566174"/>
    </marker>
  </defs>

  <style>
    text {
      fill: #182235;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .label {
      font-size: 16px;
      font-weight: 600;
      text-anchor: middle;
    }
    .annotation {
      fill: #566174;
      font-size: 14px;
      text-anchor: middle;
    }
    .application {
      fill: #ffffff;
      stroke: #8d99aa;
      stroke-width: 1.5;
    }
    .runtime {
      fill: #eef5ff;
      stroke: #1259d6;
      stroke-width: 1.75;
    }
    .network-boundary {
      fill: none;
      stroke: #7a8699;
      stroke-width: 1.5;
      stroke-dasharray: 7 5;
    }
    .connector {
      fill: none;
      stroke: #566174;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .one-way {
      marker-end: url(#arrow);
    }
    .two-way {
      marker-start: url(#arrow);
      marker-end: url(#arrow);
    }
    .through-firewall {
      stroke-dasharray: 2 5;
    }
    .callback {
      stroke-dasharray: 6 4;
      marker-end: url(#arrow);
    }
    .divider {
      fill: none;
      stroke: #a6afbc;
      stroke-width: 1.25;
    }
  </style>

  <rect width="1080" height="350" fill="#ffffff"/>

  <g id="boundaries" aria-hidden="true">
    <path class="network-boundary" d="M 350 18 V 330" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="connectors" aria-hidden="true">
    <path class="connector two-way" d="M 194 196 H 570" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 830 122 H 916" vector-effect="non-scaling-stroke"/>
    <path class="connector callback" d="M 916 196 L 830 196" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="components" aria-hidden="true">
    <rect class="application" x="24" y="118" width="170" height="108" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="application" x="280" y="118" width="160" height="108" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="runtime" x="570" y="66" width="260" height="160" rx="7" vector-effect="non-scaling-stroke"/>
    <path class="divider" d="M 570 146 H 830 M 700.0 146 V 226" vector-effect="non-scaling-stroke"/>
    <rect class="application" x="916" y="94" width="140" height="132" rx="7" vector-effect="non-scaling-stroke"/>
    <path class="connector through-firewall" d="M 280 196 H 440" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="labels">
    <text class="label" x="140" y="35">Public network</text>
    <text class="label" x="900" y="35">Private network</text>
    <text class="label" x="109.0" y="177.0">Client</text>
    <text class="label" x="360" y="153">Firewall</text>
    <text class="label" x="700.0" y="110">Glacier2</text>
    <text class="label" x="635.0" y="177">
      <tspan x="635.0" dy="0">Client</tspan>
      <tspan x="635.0" dy="20">endpoints</tspan>
    </text>
    <text class="label" x="765.0" y="177">
      <tspan x="765.0" dy="0">Server</tspan>
      <tspan x="765.0" dy="20">endpoints</tspan>
    </text>
    <text class="label" x="986.0" y="165.0">Server</text>
    <text class="annotation" x="109" y="258">IP: 1.2.3.4</text>
    <rect x="300" y="240" width="120" height="48" rx="4" fill="#ffffff"/>
    <text class="annotation" x="360" y="258">IP: 5.6.7.8</text>
    <text class="annotation" x="360" y="280">Port: 4064</text>
    <text class="annotation" x="635" y="258">IP: 10.0.0.1</text>
    <text class="annotation" x="635" y="280">Port: 9998</text>
    <text class="annotation" x="765" y="258">IP: 10.0.0.1</text>
    <text class="annotation" x="765" y="280">Port: 9999</text>
    <text class="annotation" x="986" y="258">IP: 10.0.0.2</text>
  </g>
</svg>
