<?xml version="1.0" encoding="UTF-8"?>
<svg
  width="700"
  height="540"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 700 540"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Ice protocol state machine</title>
  <desc id="description">
    A new connection enters the inactive state, becomes active after validation, enters graceful close
    after a close-connection message, then closes and terminates. Inactive, active, and graceful-close
    connections can also transition directly to close. Inactive and graceful close apply only to
    connection-oriented protocols such as TCP and SSL.
  </desc>

  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7.2" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#566174"/>
    </marker>
  </defs>

  <style>
    text {
      fill: #182235;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .state {
      fill: #ffffff;
      stroke: #8d99aa;
      stroke-width: 1.5;
    }

    .initial-state,
    .final-state-inner {
      fill: #182235;
    }

    .final-state-outer {
      fill: #ffffff;
      stroke: #182235;
      stroke-width: 1.75;
    }

    .connector {
      fill: none;
      stroke: #566174;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.75;
    }

    .one-way {
      marker-end: url(#arrow);
    }

    .state-label {
      font-size: 16px;
      font-weight: 600;
      text-anchor: middle;
    }

    .transition-label {
      fill: #566174;
      font-size: 14px;
      font-weight: 600;
    }

    .annotation {
      fill: #566174;
      font-size: 13px;
      font-weight: 500;
    }

    .asterisk {
      font-size: 11px;
    }
  </style>

  <rect width="700" height="540" fill="#ffffff"/>

  <g id="boundaries" aria-hidden="true"/>

  <g id="connectors" aria-hidden="true">
    <path class="connector one-way" d="M 280 40 V 64" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 280 118 V 170" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 280 224 V 276" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 280 340 V 398" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 280 452 V 487" vector-effect="non-scaling-stroke"/>

    <!-- Plain branches merge into the shared immediate-close transition. -->
    <path class="connector" d="M 170 91 H 70" vector-effect="non-scaling-stroke"/>
    <path class="connector" d="M 170 197 H 70" vector-effect="non-scaling-stroke"/>
    <path class="connector" d="M 170 308 H 70" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 70 91 V 425 H 170" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="components" aria-hidden="true">
    <circle class="initial-state" cx="280" cy="28" r="12"/>

    <rect class="state" x="170" y="64" width="220" height="54" rx="27" vector-effect="non-scaling-stroke"/>
    <rect class="state" x="170" y="170" width="220" height="54" rx="27" vector-effect="non-scaling-stroke"/>
    <rect class="state" x="170" y="276" width="220" height="64" rx="32" vector-effect="non-scaling-stroke"/>
    <rect class="state" x="170" y="398" width="220" height="54" rx="27" vector-effect="non-scaling-stroke"/>

    <circle class="final-state-outer" cx="280" cy="505" r="18" vector-effect="non-scaling-stroke"/>
    <circle class="final-state-inner" cx="280" cy="505" r="12"/>
  </g>

  <g id="labels">
    <text class="state-label" x="280" y="97">inactive<tspan class="asterisk" baseline-shift="super">*</tspan></text>
    <text class="state-label" x="280" y="203">active</text>
    <text class="state-label" x="280" y="303">
      <tspan x="280">graceful</tspan>
      <tspan x="280" dy="18">close<tspan class="asterisk" baseline-shift="super">*</tspan></tspan>
    </text>
    <text class="state-label" x="280" y="431">close</text>

    <text class="transition-label" x="304" y="150">validate connection</text>
    <text class="transition-label" x="304" y="256">close connection</text>

    <text class="annotation" x="440" y="301">
      <tspan x="440">* Only for connection-oriented</tspan>
      <tspan x="440" dy="18">protocols (TCP, SSL)</tspan>
    </text>
  </g>
</svg>
