<?xml version="1.0" encoding="UTF-8"?>
<svg
  width="700"
  height="285.71"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 980 400"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Administrative callbacks through the registry</title>
  <desc id="description">
    The server sends a callback to the registry, which forwards it to the administrative client over the existing
    client connection. The node runs on the server host but is not on the callback path.
  </desc>

  <defs>
    <marker
      id="arrow"
      viewBox="0 0 8 8"
      refX="7.2"
      refY="4"
      markerWidth="7"
      markerHeight="7"
      orient="auto-start-reverse"
    >
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#566174"/>
    </marker>
    <circle
      id="step-badge-shape"
      cx="0"
      cy="0"
      r="12"
      fill="#ffffff"
      stroke="#1259d6"
      stroke-width="1.5"
      vector-effect="non-scaling-stroke"
    />
  </defs>

  <style>
    text {
      fill: #182235;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .label {
      font-size: 18px;
      font-weight: 600;
      text-anchor: middle;
    }
    .annotation {
      fill: #566174;
      font-size: 17px;
      text-anchor: middle;
    }
    .application {
      fill: #ffffff;
      stroke: #8d99aa;
      stroke-width: 1.5;
    }
    .runtime {
      fill: #eef5ff;
      stroke: #1259d6;
      stroke-width: 1.75;
    }
    .boundary {
      fill: #fbfcfe;
      stroke: #cbd3de;
      stroke-width: 1.5;
      stroke-dasharray: 7 5;
    }
    .connector {
      fill: none;
      stroke: #566174;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .callback {
      stroke-dasharray: 6 4;
      marker-end: url(#arrow);
    }
  </style>

  <rect width="980" height="400" fill="#ffffff"/>

  <g id="boundaries" aria-hidden="true">
    <rect class="boundary" x="24" y="100" width="230" height="170" rx="14" vector-effect="non-scaling-stroke"/>
    <rect class="boundary" x="534" y="24" width="422" height="352" rx="14" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="connectors" aria-hidden="true">
    <path class="connector callback" d="M 720 250 H 839 V 137" vector-effect="non-scaling-stroke"/>
    <path class="connector callback" d="M 754 106 H 360 L 224 190" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="components" aria-hidden="true">
    <rect class="application" x="54" y="168" width="170" height="62" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="runtime" x="754" y="75" width="170" height="62" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="application" x="570" y="220" width="150" height="62" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="runtime" x="754" y="310" width="170" height="54" rx="7" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="labels">
    <text class="label" x="839" y="342">Node</text>
    <text class="label" x="139.0" y="125">Client PC</text>
    <text class="label" x="139.0" y="204.0">Admin client</text>
    <text class="label" x="745.0" y="49">Server PC</text>
    <text class="label" x="839.0" y="111.0">Registry</text>
    <text class="label" x="645.0" y="256.0">Server</text>
    <use href="#step-badge-shape" x="734" y="282"/>
    <text class="annotation" x="734" y="287">1</text>
    <rect x="756.0" y="271" width="80" height="24" rx="4" fill="#ffffff"/>
    <text class="annotation" x="796" y="287">callback</text>
    <use href="#step-badge-shape" x="365" y="80"/>
    <text class="annotation" x="365" y="85">2</text>
    <rect x="387.0" y="69" width="80" height="24" rx="4" fill="#ffffff"/>
    <text class="annotation" x="427" y="85">callback</text>
  </g>
</svg>
