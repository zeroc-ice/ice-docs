<?xml version="1.0" encoding="UTF-8"?>
<svg
  width="700"
  height="242.86"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 980 340"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Administrative request routing</title>
  <desc id="description">
    An administrative client sends getProperty to the registry, which forwards the request through the node to the
    server.
  </desc>

  <defs>
    <marker
      id="arrow"
      viewBox="0 0 8 8"
      refX="7.2"
      refY="4"
      markerWidth="7"
      markerHeight="7"
      orient="auto-start-reverse"
    >
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#566174"/>
    </marker>
    <circle
      id="step-badge-shape"
      cx="0"
      cy="0"
      r="12"
      fill="#ffffff"
      stroke="#1259d6"
      stroke-width="1.5"
      vector-effect="non-scaling-stroke"
    />
  </defs>

  <style>
    text {
      fill: #182235;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .label {
      font-size: 18px;
      font-weight: 600;
      text-anchor: middle;
    }
    .annotation {
      fill: #566174;
      font-size: 17px;
      text-anchor: middle;
    }
    .application {
      fill: #ffffff;
      stroke: #8d99aa;
      stroke-width: 1.5;
    }
    .runtime {
      fill: #eef5ff;
      stroke: #1259d6;
      stroke-width: 1.75;
    }
    .boundary {
      fill: #fbfcfe;
      stroke: #cbd3de;
      stroke-width: 1.5;
      stroke-dasharray: 7 5;
    }
    .connector {
      fill: none;
      stroke: #566174;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .one-way {
      marker-end: url(#arrow);
    }
  </style>

  <rect width="980" height="340" fill="#ffffff"/>

  <g id="boundaries" aria-hidden="true">
    <rect class="boundary" x="24" y="100" width="230" height="170" rx="14" vector-effect="non-scaling-stroke"/>
    <rect class="boundary" x="534" y="24" width="422" height="292" rx="14" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="connectors" aria-hidden="true">
    <path class="connector one-way" d="M 224 187 L 360 106 H 754" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 839 137 L 839 240" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 754 266 H 645 V 222" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="components" aria-hidden="true">
    <rect class="application" x="54" y="168" width="170" height="62" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="runtime" x="754" y="75" width="170" height="62" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="application" x="570" y="160" width="150" height="62" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="runtime" x="754" y="240" width="170" height="52" rx="7" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="labels">
    <text class="label" x="139.0" y="125">Client PC</text>
    <text class="label" x="139.0" y="204.0">Admin client</text>
    <text class="label" x="745.0" y="49">Server PC</text>
    <text class="label" x="839.0" y="111.0">Registry</text>
    <text class="label" x="645.0" y="196.0">Server</text>
    <text class="label" x="839.0" y="271.0">Node</text>
    <use href="#step-badge-shape" x="360" y="80"/>
    <text class="annotation" x="360" y="85">1</text>
    <rect x="382.0" y="69" width="104" height="24" rx="4" fill="#ffffff"/>
    <text class="annotation" x="434" y="85">getProperty</text>
    <use href="#step-badge-shape" x="865" y="185"/>
    <text class="annotation" x="865" y="190">2</text>
    <use href="#step-badge-shape" x="706" y="285"/>
    <text class="annotation" x="706" y="290">3</text>
  </g>
</svg>
