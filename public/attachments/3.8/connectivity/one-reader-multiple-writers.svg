<?xml version="1.0" encoding="UTF-8"?>
<svg
  width="700"
  height="301.16"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 860 370"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">One reader and multiple writers</title>
  <desc id="description">
    Two writers connect to a reader listening on TCP port 10000. The arrows show who initiates each connection.
  </desc>

  <defs>
    <marker
      id="arrow"
      viewBox="0 0 8 8"
      refX="7.2"
      refY="4"
      markerWidth="7"
      markerHeight="7"
      orient="auto-start-reverse"
    >
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#566174"/>
    </marker>
  </defs>

  <style>
    text {
      fill: #182235;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .label {
      font-size: 16px;
      font-weight: 600;
      text-anchor: middle;
    }
    .annotation {
      fill: #566174;
      font-size: 14px;
      text-anchor: middle;
    }
    .application {
      fill: #ffffff;
      stroke: #8d99aa;
      stroke-width: 1.5;
    }
    .connector {
      fill: none;
      stroke: #566174;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .one-way {
      marker-end: url(#arrow);
    }
  </style>

  <rect width="860" height="370" fill="#ffffff"/>

  <g id="boundaries" aria-hidden="true">
  </g>

  <g id="connectors" aria-hidden="true">
    <path class="connector one-way" d="M 551 84 L 309 155" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 551 280 L 309 225" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="components" aria-hidden="true">
    <rect class="application" x="24" y="130" width="285" height="120" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="application" x="551" y="24" width="285" height="120" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="application" x="551" y="220" width="285" height="120" rx="7" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="labels">
    <text class="label" x="166.5" y="160">Reader</text>
    <text class="annotation" x="166.5" y="192">DataStorm.Node.Server.Endpoints=</text>
    <text class="annotation" x="166.5" y="212">tcp -p 10000</text>
    <text class="label" x="693.5" y="54">Writer</text>
    <text class="annotation" x="693.5" y="86">DataStorm.Node.ConnectTo=</text>
    <text class="annotation" x="693.5" y="106">tcp -p 10000 -h &lt;host&gt;</text>
    <text class="label" x="693.5" y="250">Writer</text>
    <text class="annotation" x="693.5" y="282">DataStorm.Node.ConnectTo=</text>
    <text class="annotation" x="693.5" y="302">tcp -p 10000 -h &lt;host&gt;</text>
  </g>
</svg>
