<?xml version="1.0" encoding="UTF-8"?>
<svg
  width="700"
  height="330.56"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1080 510"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Readers and writers using replicated brokers</title>
  <desc id="description">
    Readers and writers are configured with both broker endpoints. Solid and dashed paths show their connections and
    alternate broker choices. Broker node 1 listens on port 10000; broker node 2 listens on port 10001 and connects
    to broker node 1.
  </desc>

  <defs>
    <marker
      id="arrow"
      viewBox="0 0 8 8"
      refX="7.2"
      refY="4"
      markerWidth="7"
      markerHeight="7"
      orient="auto-start-reverse"
    >
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#566174"/>
    </marker>
  </defs>

  <style>
    text {
      fill: #182235;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .label {
      font-size: 16px;
      font-weight: 600;
      text-anchor: middle;
    }
    .annotation {
      fill: #566174;
      font-size: 14px;
      text-anchor: middle;
    }
    .application {
      fill: #ffffff;
      stroke: #8d99aa;
      stroke-width: 1.5;
    }
    .runtime {
      fill: #eef5ff;
      stroke: #1259d6;
      stroke-width: 1.75;
    }
    .connector {
      fill: none;
      stroke: #566174;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .one-way {
      marker-end: url(#arrow);
    }
    .alternate {
      stroke-dasharray: 6 4;
      marker-end: url(#arrow);
    }
  </style>

  <rect width="1080" height="510" fill="#ffffff"/>

  <g id="boundaries" aria-hidden="true">
  </g>

  <g id="connectors" aria-hidden="true">
    <path class="connector one-way" d="M 309 90 L 397 124" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 309 410 L 397 410" vector-effect="non-scaling-stroke"/>
    <path class="connector alternate" d="M 309 90 L 397 330" vector-effect="non-scaling-stroke"/>
    <path class="connector alternate" d="M 309 410 L 397 164" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 771 90 L 682 124" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 771 410 L 682 410" vector-effect="non-scaling-stroke"/>
    <path class="connector alternate" d="M 771 90 L 682 330" vector-effect="non-scaling-stroke"/>
    <path class="connector alternate" d="M 771 410 L 682 164" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 539 290 L 539 184" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="components" aria-hidden="true">
    <rect class="application" x="24" y="24" width="285" height="140" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="application" x="24" y="340" width="285" height="140" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="application" x="771" y="24" width="285" height="140" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="application" x="771" y="340" width="285" height="140" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="runtime" x="397" y="64" width="285" height="120" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="runtime" x="397" y="290" width="285" height="190" rx="7" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="labels">
    <text class="label" x="166.5" y="54">Writer</text>
    <text class="annotation" x="166.5" y="86">DataStorm.Node.ConnectTo=</text>
    <text class="annotation" x="166.5" y="106">tcp -p 10000 -h &lt;host 1&gt;:</text>
    <text class="annotation" x="166.5" y="126">tcp -p 10001 -h &lt;host 2&gt;</text>
    <text class="label" x="166.5" y="370">Writer</text>
    <text class="annotation" x="166.5" y="402">DataStorm.Node.ConnectTo=</text>
    <text class="annotation" x="166.5" y="422">tcp -p 10000 -h &lt;host 1&gt;:</text>
    <text class="annotation" x="166.5" y="442">tcp -p 10001 -h &lt;host 2&gt;</text>
    <text class="label" x="913.5" y="54">Reader</text>
    <text class="annotation" x="913.5" y="86">DataStorm.Node.ConnectTo=</text>
    <text class="annotation" x="913.5" y="106">tcp -p 10000 -h &lt;host 1&gt;:</text>
    <text class="annotation" x="913.5" y="126">tcp -p 10001 -h &lt;host 2&gt;</text>
    <text class="label" x="913.5" y="370">Reader</text>
    <text class="annotation" x="913.5" y="402">DataStorm.Node.ConnectTo=</text>
    <text class="annotation" x="913.5" y="422">tcp -p 10000 -h &lt;host 1&gt;:</text>
    <text class="annotation" x="913.5" y="442">tcp -p 10001 -h &lt;host 2&gt;</text>
    <text class="label" x="539.5" y="94">Broker node 1</text>
    <text class="annotation" x="539.5" y="126">DataStorm.Node.Server.Endpoints=</text>
    <text class="annotation" x="539.5" y="146">tcp -p 10000</text>
    <text class="label" x="539.5" y="320">Broker node 2</text>
    <text class="annotation" x="539.5" y="352">DataStorm.Node.Server.Endpoints=</text>
    <text class="annotation" x="539.5" y="372">tcp -p 10001</text>
    <text class="annotation" x="539.5" y="392">DataStorm.Node.ConnectTo=</text>
    <text class="annotation" x="539.5" y="412">tcp -p 10000 -h &lt;host 1&gt;</text>
  </g>
</svg>
