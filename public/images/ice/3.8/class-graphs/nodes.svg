<?xml version="1.0" encoding="UTF-8"?>
<svg
  width="480"
  height="225"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 480 225"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Cyclic class graph</title>
  <desc id="description">
    The obj member of s refers to node 7. Node 7 refers to node 9 through next, and node 9 refers back to node 7
    through next.
  </desc>

  <defs>
    <marker
      id="arrow"
      viewBox="0 0 8 8"
      refX="7.2"
      refY="4"
      markerWidth="7"
      markerHeight="7"
      orient="auto-start-reverse"
    >
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#566174"/>
    </marker>
  </defs>

  <style>
    text {
      fill: #182235;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .label {
      font-size: 16px;
      font-weight: 600;
      text-anchor: middle;
    }
    .annotation {
      fill: #566174;
      font-size: 14px;
      text-anchor: middle;
    }
    .code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }
    .application {
      fill: #ffffff;
      stroke: #8d99aa;
      stroke-width: 1.5;
    }
    .connector {
      fill: none;
      stroke: #566174;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .one-way {
      marker-end: url(#arrow);
    }
  </style>

  <rect width="480" height="225" fill="#ffffff"/>

  <g id="boundaries" aria-hidden="true">
  </g>

  <g id="connectors" aria-hidden="true">
    <path class="connector one-way" d="M 42 165 L 152 165" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 208 165 L 392 165" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 420 137 C 420 15 180 15 180 137" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="components" aria-hidden="true">
    <circle class="application" cx="180" cy="165" r="28" vector-effect="non-scaling-stroke"/>
    <circle class="application" cx="420" cy="165" r="28" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="labels">
    <text class="label code" x="24" y="170">s</text>
    <rect x="75.0" y="135" width="40" height="24" rx="4" fill="#ffffff"/>
    <text class="annotation" x="95" y="151">obj</text>
    <text class="label" x="180" y="170">7</text>
    <text class="label" x="420" y="170">9</text>
    <rect x="276.0" y="135" width="48" height="24" rx="4" fill="#ffffff"/>
    <text class="annotation" x="300" y="151">next</text>
    <text class="annotation code" x="358" y="45">next</text>
  </g>
</svg>
