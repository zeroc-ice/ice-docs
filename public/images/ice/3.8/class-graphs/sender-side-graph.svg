<?xml version="1.0" encoding="UTF-8"?>
<svg
  width="460"
  height="110"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 460 110"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Sender-side class graph</title>
  <desc id="description">
    p references an instance that references a second instance through a derived member.
  </desc>

  <defs>
    <marker
      id="arrow"
      viewBox="0 0 8 8"
      refX="7.2"
      refY="4"
      markerWidth="7"
      markerHeight="7"
      orient="auto-start-reverse"
    >
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="var(--diagram-connector)"/>
    </marker>
  </defs>

  <style>
    :root {
      --diagram-canvas: #ffffff;
      --diagram-component: #ffffff;
      --diagram-text: #182235;
      --diagram-connector: #566174;
      --diagram-component-stroke: #8d99aa;
    }

    @media screen and (prefers-color-scheme: dark) {
      :root {
        --diagram-canvas: #1a1c21;
        --diagram-component: #232429;
        --diagram-text: #e6ebf4;
        --diagram-connector: #a7b3c6;
        --diagram-component-stroke: #8391a6;
      }
    }

    text {
      fill: var(--diagram-text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .label {
      font-size: 16px;
      font-weight: 600;
      text-anchor: middle;
    }
    .code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }
    .application {
      fill: var(--diagram-component);
      stroke: var(--diagram-component-stroke);
      stroke-width: 1.5;
    }
    .connector {
      fill: none;
      stroke: var(--diagram-connector);
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .one-way {
      marker-end: url(#arrow);
    }
  </style>

  <rect width="460" height="110" fill="var(--diagram-canvas)"/>

  <g id="boundaries" aria-hidden="true">
  </g>

  <g id="connectors" aria-hidden="true">
    <path class="connector one-way" d="M 48 56 L 157 56" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 213 56 L 372 56" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="components" aria-hidden="true">
    <circle class="application" cx="185" cy="56" r="28" vector-effect="non-scaling-stroke"/>
    <circle class="application" cx="400" cy="56" r="28" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="labels">
    <text class="label code" x="32" y="61">p</text>
  </g>
</svg>
