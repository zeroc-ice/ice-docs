<?xml version="1.0" encoding="UTF-8"?>
<svg
  width="700"
  height="513.95"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 760 558"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Expression tree with different referenced nodes</title>
  <desc id="description">
    p1 references the root multiplication node and p2 references its subtraction child. The subtraction node is
    instance 2, and the addition node is instance 3.
  </desc>

  <defs>
    <marker
      id="arrow"
      viewBox="0 0 8 8"
      refX="7.2"
      refY="4"
      markerWidth="7"
      markerHeight="7"
      orient="auto-start-reverse"
    >
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#566174"/>
    </marker>
  </defs>

  <style>
    text {
      fill: #182235;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .label {
      font-size: 16px;
      font-weight: 600;
      text-anchor: middle;
    }
    .annotation {
      fill: #566174;
      font-size: 14px;
      text-anchor: middle;
    }
    .code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }
    .application {
      fill: #ffffff;
      stroke: #8d99aa;
      stroke-width: 1.5;
    }
    .connector {
      fill: none;
      stroke: #566174;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .one-way {
      marker-end: url(#arrow);
    }
  </style>

  <rect width="760" height="558" fill="#ffffff"/>

  <g id="boundaries" aria-hidden="true">
  </g>

  <g id="connectors" aria-hidden="true">
    <path class="connector" d="M 340 62 L 150 198" vector-effect="non-scaling-stroke"/>
    <path class="connector" d="M 340 62 L 570 198" vector-effect="non-scaling-stroke"/>
    <path class="connector" d="M 150 198 L 44 363" vector-effect="non-scaling-stroke"/>
    <path class="connector" d="M 150 198 L 250 363" vector-effect="non-scaling-stroke"/>
    <path class="connector" d="M 570 198 L 470 363" vector-effect="non-scaling-stroke"/>
    <path class="connector" d="M 570 198 L 690 363" vector-effect="non-scaling-stroke"/>
    <path class="connector" d="M 250 363 L 150 508" vector-effect="non-scaling-stroke"/>
    <path class="connector" d="M 250 363 L 350 508" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 142 62 L 315 62" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 702 198 L 595 198" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="components" aria-hidden="true">
    <circle class="application" cx="340" cy="62" r="25" vector-effect="non-scaling-stroke"/>
    <circle class="application" cx="150" cy="198" r="25" vector-effect="non-scaling-stroke"/>
    <circle class="application" cx="570" cy="198" r="25" vector-effect="non-scaling-stroke"/>
    <circle class="application" cx="44" cy="363" r="25" vector-effect="non-scaling-stroke"/>
    <circle class="application" cx="250" cy="363" r="25" vector-effect="non-scaling-stroke"/>
    <circle class="application" cx="470" cy="363" r="25" vector-effect="non-scaling-stroke"/>
    <circle class="application" cx="690" cy="363" r="25" vector-effect="non-scaling-stroke"/>
    <circle class="application" cx="150" cy="508" r="25" vector-effect="non-scaling-stroke"/>
    <circle class="application" cx="350" cy="508" r="25" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="labels">
    <text class="label" x="340" y="67">*</text>
    <text class="annotation code" x="340" y="31">1</text>
    <text class="label" x="150" y="203">+</text>
    <text class="annotation code" x="150" y="167">3</text>
    <text class="label" x="570" y="203">−</text>
    <text class="annotation code" x="570" y="167">2</text>
    <text class="label" x="44" y="368">1</text>
    <text class="annotation code" x="44" y="332">6</text>
    <text class="label" x="250" y="368">/</text>
    <text class="annotation code" x="250" y="332">7</text>
    <text class="label" x="470" y="368">9</text>
    <text class="annotation code" x="470" y="332">4</text>
    <text class="label" x="690" y="368">3</text>
    <text class="annotation code" x="690" y="332">5</text>
    <text class="label" x="150" y="513">6</text>
    <text class="annotation code" x="150" y="477">8</text>
    <text class="label" x="350" y="513">2</text>
    <text class="annotation code" x="350" y="477">9</text>
    <text class="label code" x="120" y="67">p1</text>
    <text class="label code" x="725" y="203">p2</text>
  </g>
</svg>
