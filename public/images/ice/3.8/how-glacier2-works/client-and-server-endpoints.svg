<?xml version="1.0" encoding="UTF-8"?>
<svg
  width="700"
  height="272.63"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 760 296"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Glacier2 client and server endpoints</title>
  <desc id="description">
    A public client at 1.2.3.4 connects to Glacier2 client endpoints at 5.6.7.8. Glacier2 sends requests to the
    private server at 10.0.0.2. The server sends callbacks to Glacier2 server endpoints at 10.0.0.1. A legend
    distinguishes requests from callbacks.
  </desc>

  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7.2" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="var(--diagram-connector)"/>
    </marker>
  </defs>

  <style>
    :root {
      --diagram-canvas: #ffffff;
      --diagram-component: #ffffff;
      --diagram-text: #182235;
      --diagram-secondary-text: #566174;
      --diagram-connector: #566174;
      --diagram-component-stroke: #8d99aa;
      --diagram-runtime-stroke: #1259d6;
      --diagram-runtime: #eef5ff;
      --diagram-divider: #a6afbc;
      --diagram-network: #7a8699;
    }

    @media screen and (prefers-color-scheme: dark) {
      :root {
        --diagram-canvas: #1a1c21;
        --diagram-component: #232429;
        --diagram-text: #e6ebf4;
        --diagram-secondary-text: #a7b3c6;
        --diagram-connector: #a7b3c6;
        --diagram-component-stroke: #8391a6;
        --diagram-runtime-stroke: #6aa6ff;
        --diagram-runtime: #21324c;
        --diagram-divider: #667389;
        --diagram-network: #8391a6;
      }
    }

    text {
      fill: var(--diagram-text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .network-boundary {
      fill: none;
      stroke: var(--diagram-network);
      stroke-dasharray: 7 5;
      stroke-width: 1.5;
    }

    .component {
      fill: var(--diagram-component);
      stroke: var(--diagram-component-stroke);
      stroke-width: 1.5;
    }

    .service {
      fill: var(--diagram-runtime);
      stroke: var(--diagram-runtime-stroke);
      stroke-width: 1.75;
    }

    .divider {
      fill: none;
      stroke: var(--diagram-divider);
      stroke-width: 1.25;
    }

    .connector {
      fill: none;
      stroke: var(--diagram-connector);
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.75;
    }

    .one-way,
    .callback {
      marker-end: url(#arrow);
    }

    .callback {
      stroke-dasharray: 6 4;
    }

    .process-title,
    .component-label {
      font-size: 16px;
      font-weight: 600;
      text-anchor: middle;
    }

    .annotation {
      fill: var(--diagram-secondary-text);
      font-size: 14px;
      font-weight: 500;
      text-anchor: middle;
    }

    .zone-label {
      fill: var(--diagram-secondary-text);
      font-size: 14px;
      font-weight: 650;
    }

    .legend-label {
      fill: var(--diagram-secondary-text);
      font-size: 14px;
      font-weight: 500;
    }
  </style>

  <rect width="760" height="296" fill="var(--diagram-canvas)"/>

  <g id="boundaries" aria-hidden="true">
    <path class="network-boundary" d="M 380 16 V 248" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="connectors" aria-hidden="true">
    <path class="connector one-way" d="M 164 152 H 260" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 500 84 H 556 V 128 H 616" vector-effect="non-scaling-stroke"/>
    <path class="connector callback" d="M 616 168 H 500" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 24 268 H 60" vector-effect="non-scaling-stroke"/>
    <path class="connector callback" d="M 177 268 H 213" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="components" aria-hidden="true">
    <rect class="component" x="24" y="117" width="140" height="70" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="service" x="260" y="64" width="240" height="136" rx="8" vector-effect="non-scaling-stroke"/>
    <path class="divider" d="M 260 104 H 500 M 380 104 V 200" vector-effect="non-scaling-stroke"/>
    <rect class="component" x="616" y="112" width="120" height="70" rx="7" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="labels">
    <text class="zone-label" x="368" y="30" text-anchor="end">Public network</text>
    <text class="zone-label" x="392" y="30">Private network</text>
    <text class="component-label" x="94" y="157">Client</text>
    <text class="annotation" x="94" y="224">IP: 1.2.3.4</text>
    <text class="component-label" x="380" y="90">Glacier2</text>
    <text class="component-label" x="320" y="146">
      <tspan x="320">Client</tspan>
      <tspan x="320" dy="20">endpoints</tspan>
    </text>
    <text class="component-label" x="440" y="146">
      <tspan x="440">Server</tspan>
      <tspan x="440" dy="20">endpoints</tspan>
    </text>
    <text class="annotation" x="320" y="224">IP: 5.6.7.8</text>
    <text class="annotation" x="440" y="224">IP: 10.0.0.1</text>
    <text class="component-label" x="676" y="152">Server</text>
    <text class="annotation" x="676" y="224">IP: 10.0.0.2</text>
    <text class="legend-label" x="70" y="273">Request</text>
    <text class="legend-label" x="223" y="273">Callback</text>
  </g>
</svg>
