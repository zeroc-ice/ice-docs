<?xml version="1.0" encoding="UTF-8"?>
<svg
  width="700"
  height="346.00"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 700 346"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Forwarding events between federated topics</title>
  <desc id="description">
    Publisher PA publishes to topic A, which has a link to B. Publisher PB publishes directly to B. B has a link to C
    and sends to subscriber SB; C sends to subscriber SC. Dotted arrows show topic links; solid arrows show message
    delivery. Messages traverse at most one topic link.
  </desc>

  <defs>
    <marker
      id="arrow"
      viewBox="0 0 8 8"
      refX="7.2"
      refY="4"
      markerWidth="7"
      markerHeight="7"
      orient="auto-start-reverse"
    >
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="var(--diagram-connector)"/>
    </marker>
  </defs>

  <style>
    :root {
      --diagram-canvas: #ffffff;
      --diagram-component: #ffffff;
      --diagram-text: #182235;
      --diagram-secondary-text: #566174;
      --diagram-connector: #566174;
      --diagram-component-stroke: #8d99aa;
      --diagram-runtime-stroke: #1259d6;
      --diagram-runtime: #eef5ff;
      --diagram-host-stroke: #cbd3de;
      --diagram-host: #fbfcfe;
    }

    @media screen and (prefers-color-scheme: dark) {
      :root {
        --diagram-canvas: #1a1c21;
        --diagram-component: #232429;
        --diagram-text: #e6ebf4;
        --diagram-secondary-text: #a7b3c6;
        --diagram-connector: #a7b3c6;
        --diagram-component-stroke: #8391a6;
        --diagram-runtime-stroke: #6aa6ff;
        --diagram-runtime: #21324c;
        --diagram-host-stroke: #667389;
        --diagram-host: #20232b;
      }
    }

    text {
      fill: var(--diagram-text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .label {
      font-size: 16px;
      font-weight: 600;
      text-anchor: middle;
    }
    .application {
      fill: var(--diagram-component);
      stroke: var(--diagram-component-stroke);
      stroke-width: 1.5;
    }
    .runtime {
      fill: var(--diagram-runtime);
      stroke: var(--diagram-runtime-stroke);
      stroke-width: 1.75;
    }
    .boundary {
      fill: var(--diagram-host);
      stroke: var(--diagram-host-stroke);
      stroke-width: 1.5;
      stroke-dasharray: 7 5;
    }
    .connector {
      fill: none;
      stroke: var(--diagram-connector);
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .topic-link {
      stroke-dasharray: 1 5;
    }
    .legend-label {
      fill: var(--diagram-secondary-text);
      font-size: 14px;
      font-weight: 500;
    }
    .one-way {
      marker-end: url(#arrow);
    }
  </style>

  <rect width="700" height="346" fill="var(--diagram-canvas)"/>

  <g id="boundaries" aria-hidden="true">
    <rect class="boundary" x="150" y="24" width="370" height="260" rx="14" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="connectors" aria-hidden="true">
    <path class="connector one-way" d="M 24 320 H 60" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way topic-link" d="M 216 320 H 252" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 104 105 L 200 105" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 104 235 L 305.2 208.9" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way topic-link" d="M 251.7 125.7 L 313.3 184.3" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way topic-link" d="M 356.7 184.3 L 418.3 125.7" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 470 105 L 596 105" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 364.8 208.4 L 596 235" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="components" aria-hidden="true">
    <rect class="application" x="24" y="77" width="80" height="56" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="application" x="24" y="207" width="80" height="56" rx="7" vector-effect="non-scaling-stroke"/>
    <circle class="runtime" cx="230" cy="105" r="30" vector-effect="non-scaling-stroke"/>
    <circle class="runtime" cx="335" cy="205" r="30" vector-effect="non-scaling-stroke"/>
    <circle class="runtime" cx="440" cy="105" r="30" vector-effect="non-scaling-stroke"/>
    <rect class="application" x="596" y="77" width="80" height="56" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="application" x="596" y="207" width="80" height="56" rx="7" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="labels">
    <text class="legend-label" x="70" y="325">Message delivery</text>
    <text class="legend-label" x="262" y="325">Topic link</text>
    <text class="label" x="335" y="49">IceStorm</text>
    <text class="label" x="64" y="110">PA</text>
    <text class="label" x="64" y="240">PB</text>
    <text class="label" x="230" y="110">A</text>
    <text class="label" x="335" y="210">B</text>
    <text class="label" x="440" y="110">C</text>
    <text class="label" x="636" y="110">SC</text>
    <text class="label" x="636" y="240">SB</text>
  </g>
</svg>
