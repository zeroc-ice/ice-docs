<?xml version="1.0" encoding="UTF-8"?>
<svg
  width="700"
  height="444"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 700 444"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Compact encoding format for exceptions</title>
  <desc id="description">
    In the compact exceptions format, each slice, from the most-derived to the least-derived, contains slice flags, a
    type ID, required members, and optional members when needed.
  </desc>

  <style>
    :root {
      --diagram-canvas: #ffffff;
      --diagram-text: #182235;
      --diagram-secondary-text: #566174;
      --diagram-connector: #566174;
      --diagram-host-stroke: #cbd3de;
      --diagram-host: #fbfcfe;
      --diagram-divider: #a6afbc;
      --diagram-api: #f8fbff;
      --diagram-api-stroke: #4f78bb;
    }

    @media screen and (prefers-color-scheme: dark) {
      :root {
        --diagram-canvas: #1a1c21;
        --diagram-text: #e6ebf4;
        --diagram-secondary-text: #a7b3c6;
        --diagram-connector: #a7b3c6;
        --diagram-host-stroke: #667389;
        --diagram-host: #20232b;
        --diagram-divider: #667389;
        --diagram-api: #202c3e;
        --diagram-api-stroke: #7da7e6;
      }
    }

    text {
      fill: var(--diagram-text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .annotation {
      fill: var(--diagram-secondary-text);
      font-size: 14px;
      text-anchor: middle;
    }
    .code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }
    .api {
      fill: var(--diagram-api);
      stroke: var(--diagram-api-stroke);
      stroke-width: 1.5;
    }
    .boundary {
      fill: var(--diagram-host);
      stroke: var(--diagram-host-stroke);
      stroke-width: 1.5;
      stroke-dasharray: 7 5;
    }
    .connector {
      fill: none;
      stroke: var(--diagram-connector);
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .divider {
      fill: none;
      stroke: var(--diagram-divider);
      stroke-width: 1.25;
    }
  </style>

  <rect width="700" height="444" fill="var(--diagram-canvas)"/>

  <g id="boundaries" aria-hidden="true">
  </g>

  <g id="connectors" aria-hidden="true">
  </g>

  <g id="components" aria-hidden="true">
    <rect class="api" x="24" y="24" width="350" height="396" rx="0" vector-effect="non-scaling-stroke"/>
    <path class="divider boundary" d="M 24 68 H 374" vector-effect="non-scaling-stroke"/>
    <path class="divider boundary" d="M 24 112 H 374" vector-effect="non-scaling-stroke"/>
    <path class="divider boundary" d="M 24 156 H 374" vector-effect="non-scaling-stroke"/>
    <path class="divider" d="M 24 200 H 374" vector-effect="non-scaling-stroke"/>
    <path class="divider boundary" d="M 24 244 H 374" vector-effect="non-scaling-stroke"/>
    <path class="divider boundary" d="M 24 288 H 374" vector-effect="non-scaling-stroke"/>
    <path class="divider boundary" d="M 24 332 H 374" vector-effect="non-scaling-stroke"/>
    <path class="divider" d="M 24 376 H 374" vector-effect="non-scaling-stroke"/>
    <path class="connector" d="M 390 24 H 414 V 200 H 390 M 414 112.0 H 434" vector-effect="non-scaling-stroke"/>
    <path class="connector" d="M 390 200 H 414 V 376 H 390 M 414 288.0 H 434" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="labels">
    <text class="annotation code" x="199" y="52">Slice flags (byte)</text>
    <text class="annotation code" x="199" y="96">Type ID (string)</text>
    <text class="annotation" x="199" y="140">Required members</text>
    <text class="annotation" x="199" y="184">Optional members (if necessary)</text>
    <text class="annotation code" x="199" y="228">Slice flags (byte)</text>
    <text class="annotation code" x="199" y="272">Type ID (string)</text>
    <text class="annotation" x="199" y="316">Required members</text>
    <text class="annotation" x="199" y="360">Optional members (if necessary)</text>
    <text class="annotation" x="199" y="404">⋮</text>
    <text class="annotation" x="555" y="117.0">Most-derived slice</text>
    <text class="annotation" x="555" y="293.0">Subsequent slices</text>
  </g>
</svg>
