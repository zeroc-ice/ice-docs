<?xml version="1.0" encoding="UTF-8"?>
<svg
  width="700"
  height="312.16"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 740 330"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Weather monitoring with direct delivery</title>
  <desc id="description">
    A weather station feeds a collector, which sends updates directly to four monitors.
  </desc>

  <defs>
    <marker
      id="arrow"
      viewBox="0 0 8 8"
      refX="7.2"
      refY="4"
      markerWidth="7"
      markerHeight="7"
      orient="auto-start-reverse"
    >
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="var(--diagram-connector)"/>
    </marker>
  </defs>

  <style>
    :root {
      --diagram-canvas: #ffffff;
      --diagram-component: #ffffff;
      --diagram-text: #182235;
      --diagram-secondary-text: #566174;
      --diagram-connector: #566174;
      --diagram-component-stroke: #8d99aa;
    }

    @media screen and (prefers-color-scheme: dark) {
      :root {
        --diagram-canvas: #1a1c21;
        --diagram-component: #232429;
        --diagram-text: #e6ebf4;
        --diagram-secondary-text: #a7b3c6;
        --diagram-connector: #a7b3c6;
        --diagram-component-stroke: #8391a6;
      }
    }

    text {
      fill: var(--diagram-text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .label {
      font-size: 16px;
      font-weight: 600;
      text-anchor: middle;
    }
    .annotation {
      fill: var(--diagram-secondary-text);
      font-size: 14px;
      text-anchor: middle;
    }
    .application {
      fill: var(--diagram-component);
      stroke: var(--diagram-component-stroke);
      stroke-width: 1.5;
    }
    .connector {
      fill: none;
      stroke: var(--diagram-connector);
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .one-way {
      marker-end: url(#arrow);
    }
  </style>

  <rect width="740" height="330" fill="var(--diagram-canvas)"/>

  <g id="boundaries" aria-hidden="true">
  </g>

  <g id="connectors" aria-hidden="true">
    <path class="connector" d="M 80 274 H 325 V 176" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 400 148 L 566 49" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 400 148 L 566 115" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 400 148 L 566 181" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 400 148 L 566 247" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="components" aria-hidden="true">
    <path
      class="connector"
      d="M 72 34 V 266 M 88 34 V 266 M 62 64 H 98 M 62 64 V 82 H 72 M 88 82 H 108 V 64 M 72 74 L 88 98 L 72 122 L 88 146 L 72 170 L 88 194 L 72 218 L 88 242 L 72 266"
      vector-effect="non-scaling-stroke"
    />
    <rect class="application" x="56" y="266" width="48" height="8" rx="0" vector-effect="non-scaling-stroke"/>
    <rect class="application" x="250" y="120" width="150" height="56" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="application" x="566" y="24" width="150" height="50" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="application" x="566" y="90" width="150" height="50" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="application" x="566" y="156" width="150" height="50" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="application" x="566" y="222" width="150" height="50" rx="7" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="labels">
    <text class="annotation" x="80" y="300">Weather station</text>
    <text class="label" x="325" y="154">Collector</text>
    <text class="label" x="641" y="55">Monitor</text>
    <text class="label" x="641" y="121">Monitor</text>
    <text class="label" x="641" y="187">Monitor</text>
    <text class="label" x="641" y="253">Monitor</text>
  </g>
</svg>
