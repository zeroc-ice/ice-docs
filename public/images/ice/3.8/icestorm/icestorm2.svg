<?xml version="1.0" encoding="UTF-8"?>
<svg
  width="700"
  height="230"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 700 230"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Weather monitoring with IceStorm</title>
  <desc id="description">
    Sensors publish their readings to an IceStorm topic, and IceStorm forwards them to each weather station.
  </desc>

  <defs>
    <marker
      id="arrow"
      viewBox="0 0 8 8"
      refX="7.2"
      refY="4"
      markerWidth="5"
      markerHeight="5"
      orient="auto-start-reverse"
    >
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="var(--text-secondary, #566174)"/>
    </marker>
  </defs>

  <style>
    text {
      fill: var(--text-primary, #182235);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .label {
      font-size: 16px;
      font-weight: 600;
      text-anchor: middle;
    }
    .application {
      fill: var(--diagram-component, #ffffff);
      stroke: var(--diagram-component-stroke, #8d99aa);
      stroke-width: 1.5;
    }
    .service {
      fill: var(--diagram-runtime, #eef5ff);
      stroke: var(--link, #1259d6);
      stroke-width: 1.75;
    }
    .connector {
      fill: none;
      stroke: var(--text-secondary, #566174);
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .one-way {
      marker-end: url(#arrow);
    }
  </style>

  <rect width="700" height="230" fill="var(--surface, #ffffff)"/>

  <g id="boundaries" aria-hidden="true">
  </g>

  <g id="connectors" aria-hidden="true">
    <path class="connector one-way" d="M 194 49 L 265 103" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 194 115 L 265 115" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 194 181 L 265 127" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 435 103 L 506 49" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 435 115 L 506 115" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 435 127 L 506 181" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="components" aria-hidden="true">
    <rect class="application" x="24" y="24" width="170" height="50" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="application" x="24" y="90" width="170" height="50" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="application" x="24" y="156" width="170" height="50" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="service" x="265" y="90" width="170" height="50" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="application" x="506" y="24" width="170" height="50" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="application" x="506" y="90" width="170" height="50" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="application" x="506" y="156" width="170" height="50" rx="7" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="labels">
    <text class="label" x="109" y="55">Sensor</text>
    <text class="label" x="109" y="121">Sensor</text>
    <text class="label" x="109" y="187">Sensor</text>
    <text class="label" x="350" y="121">IceStorm</text>
    <text class="label" x="591" y="55">Weather station</text>
    <text class="label" x="591" y="121">Weather station</text>
    <text class="label" x="591" y="187">Weather station</text>
  </g>
</svg>
