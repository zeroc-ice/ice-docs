<?xml version="1.0" encoding="UTF-8"?>
<svg
  width="700"
  height="266"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1000 380"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Weather monitoring with IceStorm</title>
  <desc id="description">
    A weather station feeds a collector, which publishes updates through IceStorm to four monitors.
  </desc>

  <defs>
    <marker
      id="arrow"
      viewBox="0 0 8 8"
      refX="7.2"
      refY="4"
      markerWidth="7"
      markerHeight="7"
      orient="auto-start-reverse"
    >
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#566174"/>
    </marker>
  </defs>

  <style>
    text {
      fill: #182235;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .label {
      font-size: 16px;
      font-weight: 600;
      text-anchor: middle;
    }
    .annotation {
      fill: #566174;
      font-size: 14px;
      text-anchor: middle;
    }
    .application {
      fill: #ffffff;
      stroke: #8d99aa;
      stroke-width: 1.5;
    }
    .runtime {
      fill: #eef5ff;
      stroke: #1259d6;
      stroke-width: 1.75;
    }
    .connector {
      fill: none;
      stroke: #566174;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .one-way {
      marker-end: url(#arrow);
    }
  </style>

  <rect width="1000" height="380" fill="#ffffff"/>

  <g id="boundaries" aria-hidden="true">
  </g>

  <g id="connectors" aria-hidden="true">
    <path class="connector" d="M 58 334 H 181 V 224" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 345 192 L 455 192" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 635 192 L 796 55" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 635 192 L 796 136" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 635 192 L 796 217" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 635 192 L 796 298" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="components" aria-hidden="true">
    <path
      class="connector"
      d="M 50 40 V 326 M 66 40 V 326 M 40 70 H 76 M 40 70 V 88 H 50 M 66 88 H 86 V 70 M 50 80 L 66 105 L 50 130 L 66 155 L 50 180 L 66 205 L 50 230 L 66 255 L 50 280 L 66 305"
      vector-effect="non-scaling-stroke"
    />
    <rect class="application" x="34" y="326" width="48" height="8" rx="0" vector-effect="non-scaling-stroke"/>
    <rect class="application" x="155" y="160" width="190" height="64" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="runtime" x="455" y="160" width="180" height="64" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="application" x="796" y="24" width="180" height="62" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="application" x="796" y="105" width="180" height="62" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="application" x="796" y="186" width="180" height="62" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="application" x="796" y="267" width="180" height="62" rx="7" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="labels">
    <text class="annotation" x="100" y="365">Weather station</text>
    <text class="label" x="250.0" y="197.0">Collector</text>
    <text class="label" x="545.0" y="197.0">IceStorm</text>
    <text class="label" x="886.0" y="60.0">Monitor</text>
    <text class="label" x="886.0" y="141.0">Monitor</text>
    <text class="label" x="886.0" y="222.0">Monitor</text>
    <text class="label" x="886.0" y="303.0">Monitor</text>
  </g>
</svg>
