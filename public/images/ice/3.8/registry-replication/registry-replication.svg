<?xml version="1.0" encoding="UTF-8"?>
<svg
  width="700"
  height="477.65"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 850 580"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">IceGrid registry replication</title>
  <desc id="description">
    A client initially contacts the master registry and can fail over to the slave. The registries synchronize, and
    both nodes communicate with the replicas. Host Server 1 contains the master and Node1; Host Server 2 contains
    the slave and Node2.
  </desc>

  <defs>
    <marker
      id="arrow"
      viewBox="0 0 8 8"
      refX="7.2"
      refY="4"
      markerWidth="7"
      markerHeight="7"
      orient="auto-start-reverse"
    >
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#566174"/>
    </marker>
    <circle
      id="step-badge-shape"
      cx="0"
      cy="0"
      r="12"
      fill="#ffffff"
      stroke="#1259d6"
      stroke-width="1.5"
      vector-effect="non-scaling-stroke"
    />
  </defs>

  <style>
    text {
      fill: #182235;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .label {
      font-size: 16px;
      font-weight: 600;
      text-anchor: middle;
    }
    .annotation {
      fill: #566174;
      font-size: 14px;
      text-anchor: middle;
    }
    .application {
      fill: #ffffff;
      stroke: #8d99aa;
      stroke-width: 1.5;
    }
    .runtime {
      fill: #eef5ff;
      stroke: #1259d6;
      stroke-width: 1.75;
    }
    .boundary {
      fill: #fbfcfe;
      stroke: #cbd3de;
      stroke-width: 1.5;
      stroke-dasharray: 7 5;
    }
    .connector {
      fill: none;
      stroke: #566174;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .one-way {
      marker-end: url(#arrow);
    }
    .two-way {
      marker-start: url(#arrow);
      marker-end: url(#arrow);
    }
  </style>

  <rect width="850" height="580" fill="#ffffff"/>

  <g id="boundaries" aria-hidden="true">
    <rect class="boundary" x="300" y="24" width="250" height="164" rx="14" vector-effect="non-scaling-stroke"/>
    <rect class="boundary" x="24" y="355" width="260" height="201" rx="14" vector-effect="non-scaling-stroke"/>
    <rect class="boundary" x="566" y="355" width="260" height="201" rx="14" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="connectors" aria-hidden="true">
    <path class="connector one-way" d="M 425 150 L 225 416" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 425 150 L 625 416" vector-effect="non-scaling-stroke"/>
    <path class="connector two-way" d="M 234 433 L 616 433" vector-effect="non-scaling-stroke"/>
    <path class="connector two-way" d="M 234 455 L 616 515" vector-effect="non-scaling-stroke"/>
    <path class="connector two-way" d="M 234 515 L 616 455" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 74 516 H 48 V 446 H 74" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 776 516 H 802 V 446 H 776" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="components" aria-hidden="true">
    <rect class="application" x="345" y="88" width="160" height="62" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="runtime" x="74" y="416" width="160" height="58" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="runtime" x="74" y="492" width="160" height="48" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="runtime" x="616" y="416" width="160" height="58" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="runtime" x="616" y="492" width="160" height="48" rx="7" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="labels">
    <text class="label" x="425.0" y="49">Client PC</text>
    <text class="label" x="425.0" y="124.0">Client</text>
    <text class="label" x="154.0" y="380">Host: Server 1</text>
    <text class="label" x="696.0" y="380">Host: Server 2</text>
    <text class="label" x="154.0" y="440.0">
      <tspan x="154.0" dy="0">Master</tspan>
      <tspan x="154.0" dy="20">registry</tspan>
    </text>
    <text class="label" x="154.0" y="521.0">Node1</text>
    <text class="label" x="696.0" y="440.0">
      <tspan x="696.0" dy="0">Slave</tspan>
      <tspan x="696.0" dy="20">registry</tspan>
    </text>
    <text class="label" x="696.0" y="521.0">Node2</text>
    <use href="#step-badge-shape" x="290" y="276"/>
    <text class="annotation" x="290" y="281">4</text>
    <use href="#step-badge-shape" x="565" y="276"/>
    <text class="annotation" x="565" y="281">5</text>
    <use href="#step-badge-shape" x="425" y="411"/>
    <text class="annotation" x="425" y="416">1</text>
    <use href="#step-badge-shape" x="340" y="454"/>
    <text class="annotation" x="340" y="459">2</text>
    <use href="#step-badge-shape" x="494" y="520"/>
    <text class="annotation" x="494" y="525">1</text>
    <use href="#step-badge-shape" x="355" y="529"/>
    <text class="annotation" x="355" y="534">3</text>
    <use href="#step-badge-shape" x="48" y="540"/>
    <text class="annotation" x="48" y="545">2</text>
    <use href="#step-badge-shape" x="802" y="540"/>
    <text class="annotation" x="802" y="545">3</text>
  </g>
</svg>
