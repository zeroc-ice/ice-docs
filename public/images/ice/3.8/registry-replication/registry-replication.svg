<?xml version="1.0" encoding="UTF-8"?>
<svg
  width="700"
  height="552"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 700 552"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">IceGrid registry replication</title>
  <desc id="description">
    Host Server 1 runs the master registry and Node1; host Server 2 runs the slave registry and Node2. In step 1, the
    slave and master registries synchronize. In step 2, Node1 and Node2 contact the master. In step 3, Node1 and Node2
    contact the slave. In step 4, the client on Client PC contacts the master, and in step 5 it fails over to the slave.
  </desc>

  <defs>
    <marker
      id="arrow"
      viewBox="0 0 8 8"
      refX="7.2"
      refY="4"
      markerWidth="7"
      markerHeight="7"
      orient="auto-start-reverse"
    >
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="var(--diagram-connector)"/>
    </marker>
    <g id="step-badge-shape">
      <circle class="step-badge" cx="0" cy="0" r="12" vector-effect="non-scaling-stroke"/>
    </g>
  </defs>

  <style>
    :root {
      --diagram-canvas: #ffffff;
      --diagram-component: #ffffff;
      --diagram-text: #182235;
      --diagram-connector: #566174;
      --diagram-component-stroke: #8d99aa;
      --diagram-runtime-stroke: #1259d6;
      --diagram-runtime: #eef5ff;
      --diagram-host-stroke: #cbd3de;
      --diagram-host: #fbfcfe;
    }

    @media screen and (prefers-color-scheme: dark) {
      :root {
        --diagram-canvas: #1a1c21;
        --diagram-component: #232429;
        --diagram-text: #e6ebf4;
        --diagram-connector: #a7b3c6;
        --diagram-component-stroke: #8391a6;
        --diagram-runtime-stroke: #6aa6ff;
        --diagram-runtime: #21324c;
        --diagram-host-stroke: #667389;
        --diagram-host: #20232b;
      }
    }

    text {
      fill: var(--diagram-text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .label {
      font-size: 16px;
      font-weight: 600;
      text-anchor: middle;
    }
    .application {
      fill: var(--diagram-component);
      stroke: var(--diagram-component-stroke);
      stroke-width: 1.5;
    }
    .runtime {
      fill: var(--diagram-runtime);
      stroke: var(--diagram-runtime-stroke);
      stroke-width: 1.75;
    }
    .boundary {
      fill: var(--diagram-host);
      stroke: var(--diagram-host-stroke);
      stroke-width: 1.5;
      stroke-dasharray: 7 5;
    }
    .connector {
      fill: none;
      stroke: var(--diagram-connector);
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .one-way {
      marker-end: url(#arrow);
    }
    .two-way {
      marker-start: url(#arrow);
      marker-end: url(#arrow);
    }
    .step-badge {
      fill: var(--diagram-canvas);
      stroke: var(--diagram-runtime-stroke);
      stroke-width: 1.5;
    }
    .step-number {
      fill: var(--diagram-runtime-stroke);
      font-size: 13px;
      font-weight: 700;
      text-anchor: middle;
    }
  </style>

  <rect width="700" height="552" fill="var(--diagram-canvas)"/>

  <g id="boundaries" aria-hidden="true">
    <rect class="boundary" x="250" y="16" width="200" height="112" rx="14" vector-effect="non-scaling-stroke"/>
    <rect class="boundary" x="16" y="222" width="300" height="258" rx="14" vector-effect="non-scaling-stroke"/>
    <rect class="boundary" x="384" y="222" width="300" height="258" rx="14" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="connectors" aria-hidden="true">
    <!-- Step 1: registry synchronization. -->
    <path class="connector two-way" d="M 246 292 H 454" vector-effect="non-scaling-stroke"/>
    <!-- Step 2: each node contacts the master. -->
    <path class="connector one-way" d="M 166 384 V 328" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 534 432 V 504 H 40 V 310 H 86" vector-effect="non-scaling-stroke"/>
    <!-- Step 3: each node contacts the slave. -->
    <path class="connector one-way" d="M 534 384 V 328" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 246 408 H 350 V 312 H 454" vector-effect="non-scaling-stroke"/>
    <!-- Steps 4 and 5: the client's initial connection and its failover. -->
    <path class="connector one-way" d="M 320 108 V 190 H 238 V 270" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 380 108 V 190 H 462 V 270" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="components" aria-hidden="true">
    <rect class="application" x="290" y="56" width="120" height="52" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="runtime" x="86" y="270" width="160" height="58" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="runtime" x="86" y="384" width="160" height="48" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="runtime" x="454" y="270" width="160" height="58" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="runtime" x="454" y="384" width="160" height="48" rx="7" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="labels">
    <text class="label" x="350" y="42">Client PC</text>
    <text class="label" x="350" y="88">Client</text>
    <text class="label" x="166" y="248">Host: Server 1</text>
    <text class="label" x="534" y="248">Host: Server 2</text>
    <text class="label" x="166" y="295">
      <tspan x="166" dy="0">Master</tspan>
      <tspan x="166" dy="20">registry</tspan>
    </text>
    <text class="label" x="166" y="414">Node1</text>
    <text class="label" x="534" y="295">
      <tspan x="534" dy="0">Slave</tspan>
      <tspan x="534" dy="20">registry</tspan>
    </text>
    <text class="label" x="534" y="414">Node2</text>
    <use href="#step-badge-shape" transform="translate(350 272)"/>
    <text class="step-number" x="350" y="276.5">1</text>
    <use href="#step-badge-shape" transform="translate(142 356)"/>
    <text class="step-number" x="142" y="360.5">2</text>
    <use href="#step-badge-shape" transform="translate(350 528)"/>
    <text class="step-number" x="350" y="532.5">2</text>
    <use href="#step-badge-shape" transform="translate(558 356)"/>
    <text class="step-number" x="558" y="360.5">3</text>
    <use href="#step-badge-shape" transform="translate(290 388)"/>
    <text class="step-number" x="290" y="392.5">3</text>
    <use href="#step-badge-shape" transform="translate(279 170)"/>
    <text class="step-number" x="279" y="174.5">4</text>
    <use href="#step-badge-shape" transform="translate(421 170)"/>
    <text class="step-number" x="421" y="174.5">5</text>
  </g>
</svg>
