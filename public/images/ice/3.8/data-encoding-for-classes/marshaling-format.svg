<?xml version="1.0" encoding="UTF-8"?>
<svg
  width="700"
  height="224"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 700 224"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Marshaling encoding format for classes</title>
  <desc id="description">
    The encoding 1.0 classes layout starts with an instance identity, followed by a type ID and member slice for each
    inheritance level.
  </desc>

  <style>
    :root {
      --diagram-canvas: #ffffff;
      --diagram-text: #182235;
      --diagram-secondary-text: #566174;
      --diagram-connector: #566174;
      --diagram-host-stroke: #cbd3de;
      --diagram-host: #fbfcfe;
      --diagram-divider: #a6afbc;
      --diagram-api: #f8fbff;
      --diagram-api-stroke: #4f78bb;
    }

    @media screen and (prefers-color-scheme: dark) {
      :root {
        --diagram-canvas: #1a1c21;
        --diagram-text: #e6ebf4;
        --diagram-secondary-text: #a7b3c6;
        --diagram-connector: #a7b3c6;
        --diagram-host-stroke: #667389;
        --diagram-host: #20232b;
        --diagram-divider: #667389;
        --diagram-api: #202c3e;
        --diagram-api-stroke: #7da7e6;
      }
    }

    text {
      fill: var(--diagram-text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .annotation {
      fill: var(--diagram-secondary-text);
      font-size: 14px;
      text-anchor: middle;
    }
    .code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }
    .api {
      fill: var(--diagram-api);
      stroke: var(--diagram-api-stroke);
      stroke-width: 1.5;
    }
    .boundary {
      fill: var(--diagram-host);
      stroke: var(--diagram-host-stroke);
      stroke-width: 1.5;
      stroke-dasharray: 7 5;
    }
    .connector {
      fill: none;
      stroke: var(--diagram-connector);
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .divider {
      fill: none;
      stroke: var(--diagram-divider);
      stroke-width: 1.25;
    }
  </style>

  <rect width="700" height="224" fill="var(--diagram-canvas)"/>

  <g id="boundaries" aria-hidden="true">
  </g>

  <g id="connectors" aria-hidden="true">
  </g>

  <g id="components" aria-hidden="true">
    <rect class="api" x="24" y="24" width="350" height="176" rx="0" vector-effect="non-scaling-stroke"/>
    <path class="divider" d="M 24 68 H 374" vector-effect="non-scaling-stroke"/>
    <path class="divider boundary" d="M 24 112 H 374" vector-effect="non-scaling-stroke"/>
    <path class="divider" d="M 24 156 H 374" vector-effect="non-scaling-stroke"/>
    <path class="connector" d="M 390 68 H 414 V 200 H 390 M 414 134.0 H 434" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="labels">
    <text class="annotation code" x="199" y="52">Instance identity (int)</text>
    <text class="annotation" x="199" y="96">Class type ID</text>
    <text class="annotation" x="199" y="140">Slice for members</text>
    <text class="annotation" x="199" y="184">⋮</text>
    <text class="annotation" x="555" y="94">
      <tspan x="555" dy="0">Repeating group: one</tspan>
      <tspan x="555" dy="20">pair of type ID and slice</tspan>
      <tspan x="555" dy="20">containing members for</tspan>
      <tspan x="555" dy="20">each level of the</tspan>
      <tspan x="555" dy="20">inheritance hierarchy</tspan>
    </text>
  </g>
</svg>
