<?xml version="1.0" encoding="UTF-8"?>
<svg
  width="700"
  height="499.07"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1080 770"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Compiling Slice for a Java client and a C++ server</title>
  <desc id="description">
    A shared Greeter.ice definition is compiled separately for a Java client and a C++ server. Generated Java files
    combine with Client.java and the Ice Java runtime library to build the client. Greeter.h and Greeter.cpp combine
    with Server.cpp and the Ice C++ runtime library to build the server. The executables communicate using RPC.
  </desc>

  <defs>
    <marker
      id="arrow"
      viewBox="0 0 8 8"
      refX="7.2"
      refY="4"
      markerWidth="7"
      markerHeight="7"
      orient="auto-start-reverse"
    >
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#566174"/>
    </marker>
    <symbol id="document-shape" viewBox="0 0 160 92" preserveAspectRatio="none">
      <path d="M 1 1 H 159 V 76 C 134 65 118 91 89 79 C 60 67 37 91 1 76 Z" vector-effect="non-scaling-stroke"/>
    </symbol>
  </defs>

