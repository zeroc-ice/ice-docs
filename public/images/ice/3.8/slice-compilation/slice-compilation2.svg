<?xml version="1.0" encoding="UTF-8"?>
<svg
  width="700"
  height="539"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 800 616"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Compiling Slice for a Java client and a C++ server</title>
  <desc id="description">
    A Slice developer writes Greeter.ice, which is compiled separately for a Java client and a C++ server. The
    Slice-to-Java compiler generates Java files, and the Slice-to-C++ compiler generates Greeter.h and Greeter.cpp.
    The generated Java files combine with Client.java and the Ice Java runtime library to build the client executable.
    Greeter.h and Greeter.cpp combine with Server.cpp and the Ice C++ runtime library to build the server executable.
    The client executable invokes the server executable using RPC.
  </desc>

  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7.2" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="var(--diagram-connector)"/>
    </marker>
    <symbol id="document-shape" viewBox="0 0 160 92" preserveAspectRatio="none">
      <path d="M 1 1 H 159 V 76 C 134 65 118 91 89 79 C 60 67 37 91 1 76 Z" vector-effect="non-scaling-stroke"/>
    </symbol>
  </defs>

  <style>
    :root {
      --diagram-canvas: #ffffff;
      --diagram-component: #ffffff;
      --diagram-text: #182235;
      --diagram-secondary-text: #566174;
      --diagram-connector: #566174;
      --diagram-component-stroke: #8d99aa;
      --diagram-runtime-stroke: #1259d6;
      --diagram-runtime: #eef5ff;
      --diagram-host-stroke: #cbd3de;
      --diagram-host: #fbfcfe;
      --diagram-divider: #a6afbc;
      --diagram-api: #f8fbff;
      --diagram-api-stroke: #4f78bb;
      --diagram-generated: #f3f0f7;
      --diagram-generated-stroke: #75658f;
      --diagram-api-label: #365f9e;
      --diagram-generated-label: #68587e;
    }

    @media screen and (prefers-color-scheme: dark) {
      :root {
        --diagram-canvas: #1a1c21;
        --diagram-component: #232429;
        --diagram-text: #e6ebf4;
        --diagram-secondary-text: #a7b3c6;
        --diagram-connector: #a7b3c6;
        --diagram-component-stroke: #8391a6;
        --diagram-runtime-stroke: #6aa6ff;
        --diagram-runtime: #21324c;
        --diagram-host-stroke: #667389;
        --diagram-host: #20232b;
        --diagram-divider: #667389;
        --diagram-api: #202c3e;
        --diagram-api-stroke: #7da7e6;
        --diagram-generated: #312b3e;
        --diagram-generated-stroke: #b6a0d2;
        --diagram-api-label: #9cc4ff;
        --diagram-generated-label: #d1bdea;
      }
    }

    text {
      fill: var(--diagram-text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .generated-files-boundary {
      fill: var(--diagram-host);
      stroke: var(--diagram-host-stroke);
      stroke-dasharray: 7 5;
      stroke-width: 1.5;
    }

    .actor,
    .executable {
      fill: var(--diagram-component);
      stroke: var(--diagram-component-stroke);
      stroke-width: 1.5;
    }

    .compiler,
    .runtime-library {
      fill: var(--diagram-runtime);
      stroke: var(--diagram-runtime-stroke);
      stroke-width: 1.75;
    }

    .slice-document {
      fill: var(--diagram-api);
      stroke: var(--diagram-api-stroke);
      stroke-width: 1.5;
    }

    .generated-document {
      fill: var(--diagram-generated);
      stroke: var(--diagram-generated-stroke);
      stroke-width: 1.75;
    }

    .source-document {
      fill: var(--diagram-component);
      stroke: var(--diagram-component-stroke);
      stroke-width: 1.5;
    }

    .slice-divider,
    .generated-divider,
    .source-divider {
      stroke-width: 1.25;
    }

    .slice-divider {
      stroke: var(--diagram-api-stroke);
    }

    .generated-divider {
      stroke: var(--diagram-generated-stroke);
    }

    .source-divider {
      stroke: var(--diagram-divider);
    }

    .connector {
      fill: none;
      stroke: var(--diagram-connector);
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.75;
    }

    .one-way {
      marker-end: url(#arrow);
    }

    .connector-label-background {
      fill: var(--diagram-canvas);
    }

    .group-label,
    .category-badge {
      font-size: 14px;
      font-weight: 750;
      letter-spacing: 0.05em;
      text-anchor: middle;
    }

    .group-label,
    .generated-badge {
      fill: var(--diagram-generated-label);
    }

    .source-badge {
      fill: var(--diagram-secondary-text);
    }

    .slice-badge {
      fill: var(--diagram-api-label);
    }

    .actor-label,
    .component-label,
    .executable-label {
      font-size: 16px;
      font-weight: 600;
      text-anchor: middle;
    }

    .file-label {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 15px;
      font-weight: 600;
      text-anchor: middle;
    }

    .connector-label {
      fill: var(--diagram-secondary-text);
      font-size: 14px;
      font-weight: 600;
      text-anchor: middle;
    }
  </style>

  <rect width="800" height="616" fill="var(--diagram-canvas)"/>

  <g id="boundaries" aria-hidden="true">
    <rect class="generated-files-boundary" x="190" y="244" width="200" height="140" rx="14" vector-effect="non-scaling-stroke"/>
    <rect class="generated-files-boundary" x="414" y="244" width="296" height="140" rx="14" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="connectors" aria-hidden="true">
    <!-- Slice definition, compiled once for each language. -->
    <path class="connector one-way" d="M 307 61 H 335" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 400 91 V 124 H 290 V 144" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 400 124 H 562 V 144" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 290 214 V 244" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 562 214 V 244" vector-effect="non-scaling-stroke"/>

    <!-- Developer-written sources. -->
    <path class="connector one-way" d="M 176 455 H 200" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 624 455 H 600" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 260 485 V 530" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 540 485 V 530" vector-effect="non-scaling-stroke"/>

    <!-- Each generated-files group is a dependency of its executable. -->
    <path class="connector one-way" d="M 345 384 V 530" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 455 384 V 530" vector-effect="non-scaling-stroke"/>

    <!-- Each executable links with the Ice runtime library for its language. -->
    <path class="connector one-way" d="M 188 565 H 212" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 612 565 H 588" vector-effect="non-scaling-stroke"/>

    <path class="connector one-way" d="M 362 565 H 438" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="components" aria-hidden="true">
    <rect class="actor" x="203" y="31" width="104" height="60" rx="30" vector-effect="non-scaling-stroke"/>
    <rect class="actor" x="72" y="425" width="104" height="60" rx="30" vector-effect="non-scaling-stroke"/>
    <rect class="actor" x="624" y="425" width="104" height="60" rx="30" vector-effect="non-scaling-stroke"/>

    <use href="#document-shape" class="slice-document" x="335" y="16" width="130" height="90"/>
    <path class="slice-divider" d="M 336 47 H 464" vector-effect="non-scaling-stroke"/>

    <rect class="compiler" x="220" y="144" width="140" height="70" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="compiler" x="492" y="144" width="140" height="70" rx="7" vector-effect="non-scaling-stroke"/>

    <use href="#document-shape" class="generated-document" x="230" y="280" width="120" height="90"/>
    <path class="generated-divider" d="M 231 311 H 349" vector-effect="non-scaling-stroke"/>
    <use href="#document-shape" class="generated-document" x="432" y="280" width="120" height="90"/>
    <path class="generated-divider" d="M 433 311 H 551" vector-effect="non-scaling-stroke"/>
    <use href="#document-shape" class="generated-document" x="572" y="280" width="120" height="90"/>
    <path class="generated-divider" d="M 573 311 H 691" vector-effect="non-scaling-stroke"/>

    <use href="#document-shape" class="source-document" x="200" y="410" width="120" height="90"/>
    <path class="source-divider" d="M 201 441 H 319" vector-effect="non-scaling-stroke"/>
    <use href="#document-shape" class="source-document" x="480" y="410" width="120" height="90"/>
    <path class="source-divider" d="M 481 441 H 599" vector-effect="non-scaling-stroke"/>

    <rect class="runtime-library" x="38" y="530" width="150" height="70" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="executable" x="212" y="530" width="150" height="70" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="executable" x="438" y="530" width="150" height="70" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="runtime-library" x="612" y="530" width="150" height="70" rx="7" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="labels">
    <text class="group-label" x="290" y="267">GENERATED FILES</text>
    <text class="group-label" x="562" y="267">GENERATED FILES</text>

    <text class="actor-label" x="255" y="56">
      <tspan x="255">Slice</tspan>
      <tspan x="255" dy="19">developer</tspan>
    </text>
    <text class="actor-label" x="124" y="450">
      <tspan x="124">Client</tspan>
      <tspan x="124" dy="19">developer</tspan>
    </text>
    <text class="actor-label" x="676" y="450">
      <tspan x="676">Server</tspan>
      <tspan x="676" dy="19">developer</tspan>
    </text>

    <text class="category-badge slice-badge" x="400" y="37">SLICE</text>
    <text class="file-label" x="400" y="76">Greeter.ice</text>

    <text class="component-label" x="290" y="174">
      <tspan x="290">Slice-to-Java</tspan>
      <tspan x="290" dy="20">compiler</tspan>
    </text>
    <text class="component-label" x="562" y="174">
      <tspan x="562">Slice-to-C++</tspan>
      <tspan x="562" dy="20">compiler</tspan>
    </text>

    <text class="category-badge generated-badge" x="290" y="301">GENERATED</text>
    <text class="file-label" x="290" y="340">*.java</text>
    <text class="category-badge generated-badge" x="492" y="301">GENERATED</text>
    <text class="file-label" x="492" y="340">Greeter.h</text>
    <text class="category-badge generated-badge" x="632" y="301">GENERATED</text>
    <text class="file-label" x="632" y="340">Greeter.cpp</text>

    <text class="category-badge source-badge" x="260" y="431">SOURCE</text>
    <text class="file-label" x="260" y="470">Client.java</text>
    <text class="category-badge source-badge" x="540" y="431">SOURCE</text>
    <text class="file-label" x="540" y="470">Server.cpp</text>

    <text class="component-label" x="113" y="560">
      <tspan x="113">Ice Java</tspan>
      <tspan x="113" dy="20">runtime library</tspan>
    </text>
    <text class="executable-label" x="287" y="560">
      <tspan x="287">Client</tspan>
      <tspan x="287" dy="20">executable</tspan>
    </text>
    <text class="executable-label" x="513" y="560">
      <tspan x="513">Server</tspan>
      <tspan x="513" dy="20">executable</tspan>
    </text>
    <text class="component-label" x="687" y="560">
      <tspan x="687">Ice C++</tspan>
      <tspan x="687" dy="20">runtime library</tspan>
    </text>

    <rect class="connector-label-background" x="378" y="552" width="44" height="26" rx="13"/>
    <text class="connector-label" x="400" y="570">RPC</text>
  </g>
</svg>
