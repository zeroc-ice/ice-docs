<?xml version="1.0" encoding="UTF-8"?>
<svg
  width="700"
  height="460.25"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 800 526"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Compiling Slice in a shared C++ development environment</title>
  <desc id="description">
    A Slice developer writes Greeter.ice and compiles it into the shared generated files Greeter.h
    and Greeter.cpp. The generated-files group connects to both executables. Client.cpp connects to the
    client executable, Server.cpp connects to the server executable, and the Ice C++ runtime library
    connects to both. The client executable invokes the server executable using RPC.
  </desc>

  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7.2" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="var(--diagram-connector)"/>
    </marker>
    <symbol id="document-shape" viewBox="0 0 160 92" preserveAspectRatio="none">
      <path d="M 1 1 H 159 V 76 C 134 65 118 91 89 79 C 60 67 37 91 1 76 Z" vector-effect="non-scaling-stroke"/>
    </symbol>
  </defs>

  <style>
    :root {
      --diagram-canvas: #ffffff;
      --diagram-component: #ffffff;
      --diagram-text: #182235;
      --diagram-secondary-text: #566174;
      --diagram-connector: #566174;
      --diagram-component-stroke: #8d99aa;
      --diagram-runtime-stroke: #1259d6;
      --diagram-runtime: #eef5ff;
      --diagram-host-stroke: #cbd3de;
      --diagram-host: #fbfcfe;
      --diagram-divider: #a6afbc;
      --diagram-api: #f8fbff;
      --diagram-api-stroke: #4f78bb;
      --diagram-generated: #f3f0f7;
      --diagram-generated-stroke: #75658f;
      --diagram-api-label: #365f9e;
      --diagram-generated-label: #68587e;
    }

    @media screen and (prefers-color-scheme: dark) {
      :root {
        --diagram-canvas: #1a1c21;
        --diagram-component: #232429;
        --diagram-text: #e6ebf4;
        --diagram-secondary-text: #a7b3c6;
        --diagram-connector: #a7b3c6;
        --diagram-component-stroke: #8391a6;
        --diagram-runtime-stroke: #6aa6ff;
        --diagram-runtime: #21324c;
        --diagram-host-stroke: #667389;
        --diagram-host: #20232b;
        --diagram-divider: #667389;
        --diagram-api: #202c3e;
        --diagram-api-stroke: #7da7e6;
        --diagram-generated: #312b3e;
        --diagram-generated-stroke: #b6a0d2;
        --diagram-api-label: #9cc4ff;
        --diagram-generated-label: #d1bdea;
      }
    }

    text {
      fill: var(--diagram-text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .generated-files-boundary {
      fill: var(--diagram-host);
      stroke: var(--diagram-host-stroke);
      stroke-dasharray: 7 5;
      stroke-width: 1.5;
    }

    .actor,
    .executable {
      fill: var(--diagram-component);
      stroke: var(--diagram-component-stroke);
      stroke-width: 1.5;
    }

    .compiler,
    .runtime-library {
      fill: var(--diagram-runtime);
      stroke: var(--diagram-runtime-stroke);
      stroke-width: 1.75;
    }

    .slice-document {
      fill: var(--diagram-api);
      stroke: var(--diagram-api-stroke);
      stroke-width: 1.5;
    }

    .generated-document {
      fill: var(--diagram-generated);
      stroke: var(--diagram-generated-stroke);
      stroke-width: 1.75;
    }

    .source-document {
      fill: var(--diagram-component);
      stroke: var(--diagram-component-stroke);
      stroke-width: 1.5;
    }

    .slice-divider,
    .generated-divider,
    .source-divider {
      stroke-width: 1.25;
    }

    .slice-divider {
      stroke: var(--diagram-api-stroke);
    }

    .generated-divider {
      stroke: var(--diagram-generated-stroke);
    }

    .source-divider {
      stroke: var(--diagram-divider);
    }

    .connector {
      fill: none;
      stroke: var(--diagram-connector);
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.75;
    }

    .one-way {
      marker-end: url(#arrow);
    }

    .connector-label-background {
      fill: var(--diagram-canvas);
    }

    .group-label,
    .category-badge {
      font-size: 14px;
      font-weight: 750;
      letter-spacing: 0.05em;
      text-anchor: middle;
    }

    .group-label,
    .generated-badge {
      fill: var(--diagram-generated-label);
    }

    .source-badge {
      fill: var(--diagram-secondary-text);
    }

    .slice-badge {
      fill: var(--diagram-api-label);
    }

    .actor-label,
    .component-label,
    .executable-label {
      font-size: 16px;
      font-weight: 600;
      text-anchor: middle;
    }

    .file-label {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 15px;
      font-weight: 600;
      text-anchor: middle;
    }

    .connector-label {
      fill: var(--diagram-secondary-text);
      font-size: 14px;
      font-weight: 600;
      text-anchor: middle;
    }
  </style>

  <rect width="800" height="526" fill="var(--diagram-canvas)"/>

  <g id="boundaries" aria-hidden="true">
    <rect class="generated-files-boundary" x="252" y="140" width="296" height="140" rx="14" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="connectors" aria-hidden="true">
    <!-- Slice definition and compilation. -->
    <path class="connector one-way" d="M 148 61 H 172" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 302 61 H 330" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 400 106 V 140" vector-effect="non-scaling-stroke"/>

    <!-- Developer-written sources. -->
    <path class="connector one-way" d="M 141 355 H 165" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 659 355 H 635" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 225 385 V 440" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 575 385 V 440" vector-effect="non-scaling-stroke"/>

    <!-- The generated-files group is an explicit dependency of both executables. -->
    <path class="connector one-way" d="M 305 280 V 440" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 495 280 V 440" vector-effect="non-scaling-stroke"/>

    <!-- Both executables link with the same Ice runtime library. -->
    <path class="connector one-way" d="M 345 400 V 440" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 455 400 V 440" vector-effect="non-scaling-stroke"/>

    <path class="connector one-way" d="M 360 475 H 440" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="components" aria-hidden="true">
    <rect class="actor" x="44" y="31" width="104" height="60" rx="30" vector-effect="non-scaling-stroke"/>
    <rect class="actor" x="37" y="325" width="104" height="60" rx="30" vector-effect="non-scaling-stroke"/>
    <rect class="actor" x="659" y="325" width="104" height="60" rx="30" vector-effect="non-scaling-stroke"/>

    <use href="#document-shape" class="slice-document" x="172" y="16" width="130" height="90"/>
    <path class="slice-divider" d="M 173 47 H 301" vector-effect="non-scaling-stroke"/>
    <rect class="compiler" x="330" y="16" width="140" height="90" rx="7" vector-effect="non-scaling-stroke"/>

    <use href="#document-shape" class="generated-document" x="270" y="176" width="120" height="90"/>
    <path class="generated-divider" d="M 271 207 H 389" vector-effect="non-scaling-stroke"/>
    <use href="#document-shape" class="generated-document" x="410" y="176" width="120" height="90"/>
    <path class="generated-divider" d="M 411 207 H 529" vector-effect="non-scaling-stroke"/>

    <use href="#document-shape" class="source-document" x="165" y="310" width="120" height="90"/>
    <path class="source-divider" d="M 166 341 H 284" vector-effect="non-scaling-stroke"/>
    <use href="#document-shape" class="source-document" x="515" y="310" width="120" height="90"/>
    <path class="source-divider" d="M 516 341 H 634" vector-effect="non-scaling-stroke"/>

    <rect class="runtime-library" x="325" y="310" width="150" height="90" rx="7" vector-effect="non-scaling-stroke"/>

    <rect class="executable" x="180" y="440" width="180" height="70" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="executable" x="440" y="440" width="180" height="70" rx="7" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="labels">
    <text class="group-label" x="400" y="163">GENERATED FILES</text>

    <text class="actor-label" x="96" y="56">
      <tspan x="96">Slice</tspan>
      <tspan x="96" dy="19">developer</tspan>
    </text>
    <text class="actor-label" x="89" y="350">
      <tspan x="89">Client</tspan>
      <tspan x="89" dy="19">developer</tspan>
    </text>
    <text class="actor-label" x="711" y="350">
      <tspan x="711">Server</tspan>
      <tspan x="711" dy="19">developer</tspan>
    </text>

    <text class="category-badge slice-badge" x="237" y="37">SLICE</text>
    <text class="file-label" x="237" y="76">Greeter.ice</text>

    <text class="component-label" x="400" y="56">
      <tspan x="400">Slice-to-C++</tspan>
      <tspan x="400" dy="20">compiler</tspan>
    </text>

    <text class="category-badge generated-badge" x="330" y="197">GENERATED</text>
    <text class="file-label" x="330" y="236">Greeter.h</text>
    <text class="category-badge generated-badge" x="470" y="197">GENERATED</text>
    <text class="file-label" x="470" y="236">Greeter.cpp</text>

    <text class="category-badge source-badge" x="225" y="331">SOURCE</text>
    <text class="file-label" x="225" y="370">Client.cpp</text>
    <text class="category-badge source-badge" x="575" y="331">SOURCE</text>
    <text class="file-label" x="575" y="370">Server.cpp</text>

    <text class="component-label" x="400" y="350">
      <tspan x="400">Ice C++</tspan>
      <tspan x="400" dy="20">runtime library</tspan>
    </text>

    <text class="executable-label" x="270" y="481">Client executable</text>
    <text class="executable-label" x="530" y="481">Server executable</text>

    <rect class="connector-label-background" x="378" y="462" width="44" height="26" rx="13"/>
    <text class="connector-label" x="400" y="480">RPC</text>
  </g>
</svg>
