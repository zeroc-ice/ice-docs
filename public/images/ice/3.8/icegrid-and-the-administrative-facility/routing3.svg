<?xml version="1.0" encoding="UTF-8"?>
<svg
  width="700"
  height="322.37"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 760 350"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Administrative callbacks through Glacier2</title>
  <desc id="description">
    The server sends a callback to Glacier2, which forwards it to the administrative client.
  </desc>

  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7.2" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#566174"/>
    </marker>
    <g id="step-badge-shape">
      <circle class="step-badge" cx="0" cy="0" r="12" vector-effect="non-scaling-stroke"/>
    </g>
  </defs>

  <style>
    text {
      fill: #182235;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .process-boundary {
      fill: #fbfcfe;
      stroke: #cbd3de;
      stroke-dasharray: 7 5;
      stroke-width: 1.5;
    }

    .component {
      fill: #ffffff;
      stroke: #8d99aa;
      stroke-width: 1.5;
    }

    .service {
      fill: #eef5ff;
      stroke: #1259d6;
      stroke-width: 1.75;
    }

    .connector {
      fill: none;
      stroke: #566174;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.75;
    }

    .one-way,
    .callback {
      marker-end: url(#arrow);
    }

    .callback {
      stroke-dasharray: 6 4;
    }

    .label-knockout {
      fill: #ffffff;
    }

    .process-title,
    .component-label {
      font-size: 16px;
      font-weight: 600;
      text-anchor: middle;
    }

    .connector-label {
      fill: #182235;
      font-size: 14px;
      font-weight: 500;
    }

    .code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }

    .step-badge {
      fill: #ffffff;
      stroke: #1259d6;
      stroke-width: 1.5;
    }

    .step-number {
      fill: #1259d6;
      font-size: 14px;
      font-weight: 700;
      text-anchor: middle;
    }
  </style>

  <rect width="760" height="350" fill="#ffffff"/>

  <g id="boundaries" aria-hidden="true">
    <rect class="process-boundary" x="24" y="116" width="176" height="126" rx="14" vector-effect="non-scaling-stroke"/>
    <rect class="process-boundary" x="344" y="24" width="392" height="310" rx="14" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="connectors" aria-hidden="true">
    <path class="connector callback" d="M 644 248 V 191 H 512" vector-effect="non-scaling-stroke"/>
    <path class="connector callback" d="M 368 191 H 184" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="components" aria-hidden="true">
    <rect class="component" x="40" y="160" width="144" height="62" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="service" x="576" y="68" width="136" height="62" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="service" x="368" y="160" width="144" height="62" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="component" x="576" y="248" width="136" height="62" rx="7" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="labels">
    <text class="process-title" x="112" y="140">Client PC</text>
    <text class="component-label" x="112" y="196">Admin client</text>
    <text class="process-title" x="540" y="48">Server PC</text>
    <text class="component-label" x="644" y="104">Registry</text>
    <text class="component-label" x="440" y="196">Glacier2</text>
    <text class="component-label" x="644" y="284">Server</text>
    <use href="#step-badge-shape" transform="translate(222 171)"/>
    <text class="step-number" x="222" y="176">2</text>
    <text class="connector-label" x="242" y="176">callback</text>
    <use href="#step-badge-shape" transform="translate(548 171)"/>
    <text class="step-number" x="548" y="176">1</text>
    <text class="connector-label" x="568" y="176">callback</text>
  </g>
</svg>
