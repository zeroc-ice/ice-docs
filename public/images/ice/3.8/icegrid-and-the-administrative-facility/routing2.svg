<?xml version="1.0" encoding="UTF-8"?>
<svg
  width="700"
  height="322.37"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 760 350"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Administrative callbacks through the registry</title>
  <desc id="description">
    The server sends a callback to the registry, which forwards it to the administrative client over the existing
    client connection. The node runs on the server host but is not on the callback path.
  </desc>

  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7.2" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="var(--diagram-connector)"/>
    </marker>
    <g id="step-badge-shape">
      <circle class="step-badge" cx="0" cy="0" r="12" vector-effect="non-scaling-stroke"/>
    </g>
  </defs>

  <style>
    :root {
      --diagram-canvas: #ffffff;
      --diagram-component: #ffffff;
      --diagram-text: #182235;
      --diagram-connector: #566174;
      --diagram-component-stroke: #8d99aa;
      --diagram-runtime-stroke: #1259d6;
      --diagram-runtime: #eef5ff;
      --diagram-host-stroke: #cbd3de;
      --diagram-host: #fbfcfe;
    }

    @media screen and (prefers-color-scheme: dark) {
      :root {
        --diagram-canvas: #1a1c21;
        --diagram-component: #232429;
        --diagram-text: #e6ebf4;
        --diagram-connector: #a7b3c6;
        --diagram-component-stroke: #8391a6;
        --diagram-runtime-stroke: #6aa6ff;
        --diagram-runtime: #21324c;
        --diagram-host-stroke: #667389;
        --diagram-host: #20232b;
      }
    }

    text {
      fill: var(--diagram-text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .process-boundary {
      fill: var(--diagram-host);
      stroke: var(--diagram-host-stroke);
      stroke-dasharray: 7 5;
      stroke-width: 1.5;
    }

    .component {
      fill: var(--diagram-component);
      stroke: var(--diagram-component-stroke);
      stroke-width: 1.5;
    }

    .service {
      fill: var(--diagram-runtime);
      stroke: var(--diagram-runtime-stroke);
      stroke-width: 1.75;
    }

    .connector {
      fill: none;
      stroke: var(--diagram-connector);
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.75;
    }

    .one-way,
    .callback {
      marker-end: url(#arrow);
    }

    .callback {
      stroke-dasharray: 6 4;
    }

    .label-knockout {
      fill: var(--diagram-canvas);
    }

    .process-title,
    .component-label {
      font-size: 16px;
      font-weight: 600;
      text-anchor: middle;
    }

    .connector-label {
      fill: var(--diagram-text);
      font-size: 14px;
      font-weight: 500;
    }

    .code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }

    .step-badge {
      fill: var(--diagram-canvas);
      stroke: var(--diagram-runtime-stroke);
      stroke-width: 1.5;
    }

    .step-number {
      fill: var(--diagram-runtime-stroke);
      font-size: 14px;
      font-weight: 700;
      text-anchor: middle;
    }
  </style>

  <rect width="760" height="350" fill="var(--diagram-canvas)"/>

  <g id="boundaries" aria-hidden="true">
    <rect class="process-boundary" x="24" y="24" width="176" height="126" rx="14" vector-effect="non-scaling-stroke"/>
    <rect class="process-boundary" x="344" y="24" width="392" height="310" rx="14" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="connectors" aria-hidden="true">
    <path class="connector callback" d="M 512 191 H 644 V 130" vector-effect="non-scaling-stroke"/>
    <path class="connector callback" d="M 576 99 H 184" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="components" aria-hidden="true">
    <rect class="component" x="40" y="68" width="144" height="62" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="service" x="576" y="68" width="136" height="62" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="component" x="368" y="160" width="144" height="62" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="service" x="576" y="248" width="136" height="62" rx="7" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="labels">
    <text class="process-title" x="112" y="48">Client PC</text>
    <text class="component-label" x="112" y="104">Admin client</text>
    <text class="process-title" x="540" y="48">Server PC</text>
    <text class="component-label" x="644" y="104">Registry</text>
    <text class="component-label" x="440" y="196">Server</text>
    <text class="component-label" x="644" y="284">Node</text>
    <use href="#step-badge-shape" transform="translate(222 79)"/>
    <text class="step-number" x="222" y="84">2</text>
    <text class="connector-label" x="242" y="84">callback</text>
    <use href="#step-badge-shape" transform="translate(548 213)"/>
    <text class="step-number" x="548" y="218">1</text>
    <text class="connector-label" x="568" y="218">callback</text>
  </g>
</svg>
