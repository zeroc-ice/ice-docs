<?xml version="1.0" encoding="UTF-8"?>
<svg
  width="420"
  height="228"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 420 228"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Facets of the Ice object printer1</title>
  <desc id="description">
    The Ice object printer1 has two facets: the default facet, whose name is empty and which implements Printer, and
    the facet admin, which implements PrinterAdmin.
  </desc>

  <style>
    text {
      fill: var(--text-primary, #182235);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .boundary-title {
      font-size: 16px;
      font-weight: 600;
      text-anchor: middle;
    }
    .facet-name {
      font-size: 14px;
      font-weight: 600;
      text-anchor: middle;
    }
    .annotation {
      fill: var(--text-secondary, #566174);
      font-size: 14px;
      font-weight: 500;
      text-anchor: middle;
    }
    .code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }
    .api-boundary {
      fill: var(--diagram-api, #f8fbff);
      stroke: var(--diagram-api-stroke, #4f78bb);
      stroke-width: 1.5;
    }
    .facet {
      fill: var(--diagram-component, #ffffff);
      stroke: var(--diagram-api-stroke, #4f78bb);
      stroke-width: 1.5;
    }
  </style>

  <rect width="420" height="228" fill="var(--surface, #ffffff)"/>

  <g id="boundaries" aria-hidden="true">
    <rect class="api-boundary" x="16" y="16" width="388" height="196" rx="8" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="connectors" aria-hidden="true"/>

  <g id="components" aria-hidden="true">
    <circle class="facet" cx="120" cy="106" r="28" vector-effect="non-scaling-stroke"/>
    <circle class="facet" cx="300" cy="106" r="28" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="labels">
    <text class="boundary-title" x="210" y="46">Ice object <tspan class="code">printer1</tspan></text>
    <text class="facet-name" x="120" y="158">“” (default facet)</text>
    <text class="facet-name" x="300" y="158">“admin”</text>
    <text class="annotation code" x="120" y="182">Printer</text>
    <text class="annotation code" x="300" y="182">PrinterAdmin</text>
  </g>
</svg>
