<?xml version="1.0" encoding="UTF-8"?>
<svg
  width="560"
  height="300"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 560 300"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Facets of an Ice object</title>
  <desc id="description">
    One Ice object exposes five facets: the unnamed default facet, Facet 1, Facet 2, This Facet, and That Facet.
  </desc>

  <style>
    text {
      fill: #182235;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .boundary-title {
      font-size: 16px;
      font-weight: 600;
      text-anchor: middle;
    }
    .facet-name {
      font-size: 14px;
      font-weight: 600;
      text-anchor: middle;
    }
    .api-boundary {
      fill: #f8fbff;
      stroke: #4f78bb;
      stroke-width: 1.5;
    }
    .facet {
      fill: #ffffff;
      stroke: #4f78bb;
      stroke-width: 1.5;
    }
  </style>

  <rect width="560" height="300" fill="#ffffff"/>

  <g id="boundaries" aria-hidden="true">
    <rect class="api-boundary" x="16" y="16" width="528" height="268" rx="8" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="connectors" aria-hidden="true"/>

  <g id="components" aria-hidden="true">
    <circle class="facet" cx="120" cy="100" r="28" vector-effect="non-scaling-stroke"/>
    <circle class="facet" cx="280" cy="100" r="28" vector-effect="non-scaling-stroke"/>
    <circle class="facet" cx="440" cy="100" r="28" vector-effect="non-scaling-stroke"/>
    <circle class="facet" cx="200" cy="200" r="28" vector-effect="non-scaling-stroke"/>
    <circle class="facet" cx="360" cy="200" r="28" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="labels">
    <text class="boundary-title" x="280" y="44">Ice object</text>
    <text class="facet-name" x="120" y="150">“” (default facet)</text>
    <text class="facet-name" x="280" y="150">“Facet 1”</text>
    <text class="facet-name" x="440" y="150">“Facet 2”</text>
    <text class="facet-name" x="200" y="250">“This Facet”</text>
    <text class="facet-name" x="360" y="250">“That Facet”</text>
  </g>
</svg>
