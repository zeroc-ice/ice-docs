<?xml version="1.0" encoding="UTF-8"?>
<svg
  width="700"
  height="272.63"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 760 296"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Callback request flow through Glacier2</title>
  <desc id="description">
    Four numbered steps show a client request crossing Glacier2 to a server and a callback returning
    through Glacier2 to the client. Steps one and four share the client's bidirectional connection,
    while steps two and three use separate server-side connections. Glacier2 has client-endpoint and
    server-endpoint compartments with public and private IP addresses. A legend distinguishes requests
    from callbacks.
  </desc>

  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7.2" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#566174"/>
    </marker>
    <g id="step-badge-shape">
      <circle class="step-badge" cx="0" cy="0" r="12" vector-effect="non-scaling-stroke"/>
    </g>
  </defs>

  <style>
    text {
      fill: #182235;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .network-boundary {
      fill: none;
      stroke: #7a8699;
      stroke-dasharray: 7 5;
      stroke-width: 1.5;
    }

    .component {
      fill: #ffffff;
      stroke: #8d99aa;
      stroke-width: 1.5;
    }

    .service {
      fill: #eef5ff;
      stroke: #1259d6;
      stroke-width: 1.75;
    }

    .divider {
      fill: none;
      stroke: #a6afbc;
      stroke-width: 1.25;
    }

    .connector {
      fill: none;
      stroke: #566174;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.75;
    }

    .two-way {
      marker-end: url(#arrow);
      marker-start: url(#arrow);
    }

    .one-way,
    .callback {
      marker-end: url(#arrow);
    }

    .callback {
      stroke-dasharray: 6 4;
    }

    .process-title,
    .component-label {
      font-size: 16px;
      font-weight: 600;
      text-anchor: middle;
    }

    .annotation {
      fill: #566174;
      font-size: 14px;
      font-weight: 500;
      text-anchor: middle;
    }

    .zone-label {
      fill: #566174;
      font-size: 14px;
      font-weight: 650;
    }

    .legend-label {
      fill: #566174;
      font-size: 14px;
      font-weight: 500;
    }

    .step-badge {
      fill: #ffffff;
      stroke: #1259d6;
      stroke-width: 1.5;
    }

    .step-number {
      fill: #1259d6;
      font-size: 14px;
      font-weight: 700;
      text-anchor: middle;
    }
  </style>

  <rect width="760" height="296" fill="#ffffff"/>

  <g id="boundaries" aria-hidden="true">
    <path class="network-boundary" d="M 380 16 V 248" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="connectors" aria-hidden="true">
    <!-- Steps 1 and 4 share the client's existing bidirectional connection. -->
    <path class="connector two-way" d="M 164 152 H 260" vector-effect="non-scaling-stroke"/>
    <!-- Steps 2 and 3 use separate server-side connections. -->
    <path class="connector one-way" d="M 500 84 H 556 V 128 H 616" vector-effect="non-scaling-stroke"/>
    <path class="connector callback" d="M 616 168 H 500" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 24 268 H 60" vector-effect="non-scaling-stroke"/>
    <path class="connector callback" d="M 177 268 H 213" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="components" aria-hidden="true">
    <rect class="component" x="24" y="117" width="140" height="70" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="service" x="260" y="64" width="240" height="136" rx="8" vector-effect="non-scaling-stroke"/>
    <path class="divider" d="M 260 104 H 500 M 380 104 V 200" vector-effect="non-scaling-stroke"/>
    <rect class="component" x="616" y="112" width="120" height="70" rx="7" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="labels">
    <text class="zone-label" x="368" y="30" text-anchor="end">Public network</text>
    <text class="zone-label" x="392" y="30">Private network</text>
    <text class="component-label" x="94" y="147">
      <tspan x="94">Callback</tspan>
      <tspan x="94" dy="20">client</tspan>
    </text>
    <text class="annotation" x="94" y="224">IP: 1.2.3.4</text>
    <text class="component-label" x="380" y="90">Glacier2</text>
    <text class="component-label" x="320" y="146">
      <tspan x="320">Client</tspan>
      <tspan x="320" dy="20">endpoints</tspan>
    </text>
    <text class="component-label" x="440" y="146">
      <tspan x="440">Server</tspan>
      <tspan x="440" dy="20">endpoints</tspan>
    </text>
    <text class="annotation" x="320" y="224">IP: 5.6.7.8</text>
    <text class="annotation" x="440" y="224">IP: 10.0.0.1</text>
    <text class="component-label" x="676" y="152">Server</text>
    <text class="annotation" x="676" y="224">IP: 10.0.0.2</text>
    <!-- Numbered badges match the four steps in the surrounding documentation. -->
    <use href="#step-badge-shape" transform="translate(196 132)"/>
    <text class="step-number" x="196" y="137">4</text>
    <use href="#step-badge-shape" transform="translate(228 132)"/>
    <text class="step-number" x="228" y="137">1</text>
    <use href="#step-badge-shape" transform="translate(530 108)"/>
    <text class="step-number" x="530" y="113">2</text>
    <use href="#step-badge-shape" transform="translate(564 190)"/>
    <text class="step-number" x="564" y="195">3</text>
    <text class="legend-label" x="70" y="273">Request</text>
    <text class="legend-label" x="223" y="273">Callback</text>
  </g>
</svg>
