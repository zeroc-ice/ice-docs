<?xml version="1.0" encoding="UTF-8"?>
<svg
  width="700"
  height="399"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 800 456"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Ice client and server structure</title>
  <desc id="description">
    A three-layer view of an Ice client and server. The client interface contains generated proxy code
    and the Ice API; the server interface contains the Ice API, generated skeleton code, and an object
    adapter. The object adapter is part of the Ice API. The legend identifies Ice API and generated code.
    Each application communicates bidirectionally with its interface components, each interface
    component communicates bidirectionally with its Ice core, and the two cores communicate across the
    network.
  </desc>

  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7.2" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="var(--diagram-connector)"/>
    </marker>
  </defs>

  <style>
    :root {
      --diagram-canvas: #ffffff;
      --diagram-component: #ffffff;
      --diagram-text: #182235;
      --diagram-secondary-text: #566174;
      --diagram-connector: #566174;
      --diagram-component-stroke: #8d99aa;
      --diagram-runtime-stroke: #1259d6;
      --diagram-runtime: #eef5ff;
      --diagram-api: #f8fbff;
      --diagram-api-stroke: #4f78bb;
      --diagram-generated: #f3f0f7;
      --diagram-generated-stroke: #75658f;
      --diagram-api-label: #365f9e;
      --diagram-generated-label: #68587e;
    }

    @media screen and (prefers-color-scheme: dark) {
      :root {
        --diagram-canvas: #1a1c21;
        --diagram-component: #232429;
        --diagram-text: #e6ebf4;
        --diagram-secondary-text: #a7b3c6;
        --diagram-connector: #a7b3c6;
        --diagram-component-stroke: #8391a6;
        --diagram-runtime-stroke: #6aa6ff;
        --diagram-runtime: #21324c;
        --diagram-api: #202c3e;
        --diagram-api-stroke: #7da7e6;
        --diagram-generated: #312b3e;
        --diagram-generated-stroke: #b6a0d2;
        --diagram-api-label: #9cc4ff;
        --diagram-generated-label: #d1bdea;
      }
    }

    text {
      fill: var(--diagram-text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .application {
      fill: var(--diagram-component);
      stroke: var(--diagram-component-stroke);
      stroke-width: 1.5;
    }

    .api-component {
      fill: var(--diagram-api);
      stroke: var(--diagram-api-stroke);
      stroke-width: 1.5;
    }

    .generated-component {
      fill: var(--diagram-generated);
      stroke: var(--diagram-generated-stroke);
      stroke-width: 1.75;
    }

    .runtime {
      fill: var(--diagram-runtime);
      stroke: var(--diagram-runtime-stroke);
      stroke-width: 1.75;
    }

    .api-divider {
      stroke: var(--diagram-api-stroke);
      stroke-width: 1.25;
    }

    .generated-divider {
      stroke: var(--diagram-generated-stroke);
      stroke-width: 1.25;
    }

    .connector {
      fill: none;
      stroke: var(--diagram-connector);
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.75;
    }

    .two-way {
      marker-end: url(#arrow);
      marker-start: url(#arrow);
    }

    .application-label,
    .runtime-label {
      font-size: 17px;
      font-weight: 650;
      text-anchor: middle;
    }

    .component-label {
      font-size: 15px;
      font-weight: 600;
      text-anchor: middle;
    }

    .api-badge,
    .generated-badge {
      font-size: 14px;
      font-weight: 750;
      letter-spacing: 0.03em;
      text-anchor: middle;
    }

    .api-badge {
      fill: var(--diagram-api-label);
    }

    .generated-badge {
      fill: var(--diagram-generated-label);
    }

    .network-label-background {
      fill: var(--diagram-canvas);
    }

    .network-label {
      fill: var(--diagram-secondary-text);
      font-size: 14px;
      font-weight: 600;
      text-anchor: middle;
    }

    .legend-label {
      font-size: 15px;
      font-weight: 600;
    }
  </style>

  <rect width="800" height="456" fill="var(--diagram-canvas)"/>

  <!-- No process boundary: the three full-width layers establish each side's grouping. -->
  <g id="boundaries" aria-hidden="true"/>

  <g id="connectors" aria-hidden="true">
    <!-- Application to interface layer. -->
    <path class="connector two-way" d="M 91 84 V 140" vector-effect="non-scaling-stroke"/>
    <path class="connector two-way" d="M 265 84 V 140" vector-effect="non-scaling-stroke"/>
    <path class="connector two-way" d="M 510 84 V 140" vector-effect="non-scaling-stroke"/>
    <path class="connector two-way" d="M 622 84 V 140" vector-effect="non-scaling-stroke"/>
    <path class="connector two-way" d="M 734 84 V 140" vector-effect="non-scaling-stroke"/>

    <!-- Interface layer to runtime. -->
    <path class="connector two-way" d="M 91 250 V 310" vector-effect="non-scaling-stroke"/>
    <path class="connector two-way" d="M 265 250 V 310" vector-effect="non-scaling-stroke"/>
    <path class="connector two-way" d="M 510 250 V 310" vector-effect="non-scaling-stroke"/>
    <path class="connector two-way" d="M 622 250 V 310" vector-effect="non-scaling-stroke"/>
    <path class="connector two-way" d="M 734 250 V 310" vector-effect="non-scaling-stroke"/>

    <!-- Only the runtimes communicate across the network. -->
    <path class="connector two-way" d="M 340 350 H 460" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="components" aria-hidden="true">
    <!-- Application layer. -->
    <rect class="application" x="16" y="16" width="324" height="68" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="application" x="460" y="16" width="324" height="68" rx="7" vector-effect="non-scaling-stroke"/>

    <rect class="generated-component" x="16" y="140" width="150" height="110" rx="7" vector-effect="non-scaling-stroke"/>
    <path class="generated-divider" d="M 16 172 H 166" vector-effect="non-scaling-stroke"/>
    <rect class="api-component" x="190" y="140" width="150" height="110" rx="7" vector-effect="non-scaling-stroke"/>
    <path class="api-divider" d="M 190 172 H 340" vector-effect="non-scaling-stroke"/>

    <rect class="api-component" x="460" y="140" width="100" height="110" rx="7" vector-effect="non-scaling-stroke"/>
    <path class="api-divider" d="M 460 172 H 560" vector-effect="non-scaling-stroke"/>
    <rect class="generated-component" x="572" y="140" width="100" height="110" rx="7" vector-effect="non-scaling-stroke"/>
    <path class="generated-divider" d="M 572 172 H 672" vector-effect="non-scaling-stroke"/>
    <rect class="api-component" x="684" y="140" width="100" height="110" rx="7" vector-effect="non-scaling-stroke"/>
    <path class="api-divider" d="M 684 172 H 784" vector-effect="non-scaling-stroke"/>

    <!-- Runtime layer. -->
    <rect class="runtime" x="16" y="310" width="324" height="80" rx="8" vector-effect="non-scaling-stroke"/>
    <rect class="runtime" x="460" y="310" width="324" height="80" rx="8" vector-effect="non-scaling-stroke"/>

    <rect class="api-component" x="272" y="418" width="22" height="22" rx="4" vector-effect="non-scaling-stroke"/>
    <rect class="generated-component" x="416" y="418" width="22" height="22" rx="4" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="labels">
    <text class="application-label" x="178" y="56">Client application</text>
    <text class="application-label" x="622" y="56">Server application</text>

    <text class="generated-badge" x="91" y="161">GENERATED</text>
    <text class="component-label" x="91" y="206">
      <tspan x="91">Proxy</tspan>
      <tspan x="91" dy="19">code</tspan>
    </text>

    <text class="api-badge" x="265" y="161">API</text>
    <text class="component-label" x="265" y="216">Ice API</text>

    <text class="api-badge" x="510" y="161">API</text>
    <text class="component-label" x="510" y="216">Ice API</text>

    <text class="generated-badge" x="622" y="161">GENERATED</text>
    <text class="component-label" x="622" y="206">
      <tspan x="622">Skeleton</tspan>
      <tspan x="622" dy="19">code</tspan>
    </text>

    <text class="api-badge" x="734" y="161">API</text>
    <text class="component-label" x="734" y="206">
      <tspan x="734">Object</tspan>
      <tspan x="734" dy="19">adapter</tspan>
    </text>

    <text class="runtime-label" x="178" y="356">Client Ice core</text>
    <text class="runtime-label" x="622" y="356">Server Ice core</text>

    <rect class="network-label-background" x="362" y="334" width="76" height="32" rx="16"/>
    <text class="network-label" x="400" y="355">Network</text>

    <text class="legend-label" x="304" y="435">Ice API</text>
    <text class="legend-label" x="448" y="435">Generated code</text>
  </g>
</svg>
