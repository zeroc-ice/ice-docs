<?xml version="1.0" encoding="UTF-8"?>
<svg
  width="700"
  height="322.78"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 720 332"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Binding a request through the active servant map</title>
  <desc id="description">
    The client proxy contains endpoint 212.8.7.33 and identity Joe. The request reaches the server object adapter,
    whose active servant map associates Fred, Joe, and Carl with servants. The highlighted Joe entry selects the
    matching servant.
  </desc>

  <defs>
    <marker
      id="arrow"
      viewBox="0 0 8 8"
      refX="7.2"
      refY="4"
      markerWidth="7"
      markerHeight="7"
      orient="auto-start-reverse"
    >
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="var(--diagram-connector)"/>
    </marker>
  </defs>

  <style>
    :root {
      --diagram-canvas: #ffffff;
      --diagram-component: #ffffff;
      --diagram-text: #182235;
      --diagram-secondary-text: #566174;
      --diagram-connector: #566174;
      --diagram-component-stroke: #8d99aa;
      --diagram-runtime-stroke: #1259d6;
      --diagram-runtime: #eef5ff;
      --diagram-host-stroke: #cbd3de;
      --diagram-host: #fbfcfe;
      --diagram-divider: #a6afbc;
      --diagram-api: #f8fbff;
      --diagram-api-stroke: #4f78bb;
    }

    @media screen and (prefers-color-scheme: dark) {
      :root {
        --diagram-canvas: #1a1c21;
        --diagram-component: #232429;
        --diagram-text: #e6ebf4;
        --diagram-secondary-text: #a7b3c6;
        --diagram-connector: #a7b3c6;
        --diagram-component-stroke: #8391a6;
        --diagram-runtime-stroke: #6aa6ff;
        --diagram-runtime: #21324c;
        --diagram-host-stroke: #667389;
        --diagram-host: #20232b;
        --diagram-divider: #667389;
        --diagram-api: #202c3e;
        --diagram-api-stroke: #7da7e6;
      }
    }

    text {
      fill: var(--diagram-text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .process-title {
      font-size: 17px;
      font-weight: 650;
      text-anchor: middle;
    }
    .label {
      font-size: 16px;
      font-weight: 600;
      text-anchor: middle;
    }
    .annotation {
      fill: var(--diagram-secondary-text);
      font-size: 14px;
      font-weight: 500;
      text-anchor: middle;
    }
    .code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }
    .process-boundary {
      fill: var(--diagram-host);
      stroke: var(--diagram-host-stroke);
      stroke-dasharray: 7 5;
      stroke-width: 1.5;
    }
    .application {
      fill: var(--diagram-component);
      stroke: var(--diagram-component-stroke);
      stroke-width: 1.5;
    }
    .api {
      fill: var(--diagram-api);
      stroke: var(--diagram-api-stroke);
      stroke-width: 1.5;
    }
    .runtime {
      fill: var(--diagram-runtime);
      stroke: var(--diagram-runtime-stroke);
      stroke-width: 1.75;
    }
    .connector {
      fill: none;
      stroke: var(--diagram-connector);
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .one-way {
      marker-end: url(#arrow);
    }
    .divider {
      fill: none;
      stroke: var(--diagram-divider);
      stroke-width: 1.25;
    }
  </style>

  <rect width="720" height="332" fill="var(--diagram-canvas)"/>

  <g id="boundaries" aria-hidden="true">
    <rect class="process-boundary" x="16" y="16" width="220" height="176" rx="14" vector-effect="non-scaling-stroke"/>
    <rect class="process-boundary" x="380" y="16" width="324" height="300" rx="14" vector-effect="non-scaling-stroke"/>
    <rect class="api" x="396" y="56" width="292" height="244" rx="8" vector-effect="non-scaling-stroke"/>
    <rect class="application" x="412" y="96" width="180" height="188" rx="7" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="connectors" aria-hidden="true">
    <path class="connector one-way" d="M 216 136 H 412" vector-effect="non-scaling-stroke"/>
    <path class="connector" d="M 316 120 V 152" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 552 168 H 626" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 552 208 H 626" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 552 248 H 626" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="components" aria-hidden="true">
    <rect class="application" x="32" y="56" width="188" height="120" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="api" x="44" y="116" width="116" height="40" vector-effect="non-scaling-stroke"/>
    <rect class="api" x="160" y="116" width="48" height="40" vector-effect="non-scaling-stroke"/>
    <rect class="application" x="424" y="148" width="156" height="40" vector-effect="non-scaling-stroke"/>
    <rect class="runtime" x="424" y="188" width="156" height="40" vector-effect="non-scaling-stroke"/>
    <rect class="application" x="424" y="228" width="156" height="40" vector-effect="non-scaling-stroke"/>
    <path class="divider" d="M 524 148 V 268" vector-effect="non-scaling-stroke"/>
    <circle class="application" cx="644" cy="168" r="16" vector-effect="non-scaling-stroke"/>
    <circle class="runtime" cx="644" cy="208" r="16" vector-effect="non-scaling-stroke"/>
    <circle class="application" cx="644" cy="248" r="16" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="labels">
    <text class="process-title" x="126" y="40">Client</text>
    <text class="process-title" x="542" y="40">Server</text>
    <text class="label" x="126" y="84">Proxy</text>
    <text class="annotation code" x="102" y="141">212.8.7.33</text>
    <text class="annotation" x="184" y="141">Joe</text>
    <text class="annotation" x="262" y="128">Joe</text>
    <text class="annotation" x="316" y="110">Endpoint</text>
    <text class="annotation code" x="316" y="172">212.8.7.33</text>
    <text class="label" x="542" y="82">Object adapter</text>
    <text class="label" x="502" y="124">ASM</text>
    <text class="annotation" x="644" y="140">Servants</text>
    <text class="label" x="474" y="174">Fred</text>
    <text class="label" x="474" y="214">Joe</text>
    <text class="label" x="474" y="254">Carl</text>
  </g>
</svg>
