<?xml version="1.0" encoding="UTF-8"?>
<svg
  width="700"
  height="266.67"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 756 288"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Glacier2 behind an external firewall</title>
  <desc id="description">
    The public client at 1.2.3.4 connects through the firewall at 5.6.7.8 port 4064 to Glacier2 client endpoints at
    10.0.0.1 port 9998. Callbacks reuse that connection. The private server at 10.0.0.2 sends callbacks to Glacier2
    server endpoints at 10.0.0.1 port 9999.
  </desc>

  <defs>
    <marker
      id="arrow"
      viewBox="0 0 8 8"
      refX="7.2"
      refY="4"
      markerWidth="7"
      markerHeight="7"
      orient="auto-start-reverse"
    >
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="var(--diagram-connector)"/>
    </marker>
  </defs>

  <style>
    :root {
      --diagram-canvas: #ffffff;
      --diagram-component: #ffffff;
      --diagram-text: #182235;
      --diagram-secondary-text: #566174;
      --diagram-connector: #566174;
      --diagram-component-stroke: #8d99aa;
      --diagram-runtime-stroke: #1259d6;
      --diagram-runtime: #eef5ff;
      --diagram-divider: #a6afbc;
      --diagram-network: #7a8699;
      --diagram-firewall: #eef0f3;
    }

    @media screen and (prefers-color-scheme: dark) {
      :root {
        --diagram-canvas: #1a1c21;
        --diagram-component: #232429;
        --diagram-text: #e6ebf4;
        --diagram-secondary-text: #a7b3c6;
        --diagram-connector: #a7b3c6;
        --diagram-component-stroke: #8391a6;
        --diagram-runtime-stroke: #6aa6ff;
        --diagram-runtime: #21324c;
        --diagram-divider: #667389;
        --diagram-network: #8391a6;
        --diagram-firewall: #2c3039;
      }
    }

    text {
      fill: var(--diagram-text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .label {
      font-size: 16px;
      font-weight: 600;
      text-anchor: middle;
    }
    .annotation {
      fill: var(--diagram-secondary-text);
      font-size: 14px;
      text-anchor: middle;
    }
    .zone-label {
      fill: var(--diagram-secondary-text);
      font-size: 14px;
      font-weight: 650;
    }
    .legend-label {
      fill: var(--diagram-secondary-text);
      font-size: 14px;
      font-weight: 500;
    }
    .application {
      fill: var(--diagram-component);
      stroke: var(--diagram-component-stroke);
      stroke-width: 1.5;
    }
    .service {
      fill: var(--diagram-runtime);
      stroke: var(--diagram-runtime-stroke);
      stroke-width: 1.75;
    }
    .firewall {
      fill: var(--diagram-firewall);
      stroke: var(--diagram-connector);
      stroke-width: 1.75;
    }
    .network-boundary {
      fill: none;
      stroke: var(--diagram-network);
      stroke-width: 1.5;
      stroke-dasharray: 7 5;
    }
    .divider {
      fill: none;
      stroke: var(--diagram-divider);
      stroke-width: 1.25;
    }
    .connector {
      fill: none;
      stroke: var(--diagram-connector);
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .one-way {
      marker-end: url(#arrow);
    }
    .two-way {
      marker-start: url(#arrow);
      marker-end: url(#arrow);
    }
    .callback {
      stroke-dasharray: 6 4;
      marker-end: url(#arrow);
    }
    .through-firewall {
      stroke-dasharray: 2 5;
    }
    .label-knockout {
      fill: var(--diagram-canvas);
    }
  </style>

  <rect width="756" height="288" fill="var(--diagram-canvas)"/>

  <g id="boundaries" aria-hidden="true">
    <path class="network-boundary" d="M 236 16 V 248" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="connectors" aria-hidden="true">
    <path class="connector two-way" d="M 144 160 H 328" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 568 68 H 612" vector-effect="non-scaling-stroke"/>
    <path class="connector callback" d="M 612 160 H 568" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="components" aria-hidden="true">
    <rect class="application" x="24" y="104" width="120" height="80" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="firewall" x="188" y="48" width="96" height="136" rx="3" vector-effect="non-scaling-stroke"/>
    <path class="connector through-firewall" d="M 188 160 H 284" vector-effect="non-scaling-stroke"/>
    <rect class="service" x="328" y="48" width="240" height="136" rx="8" vector-effect="non-scaling-stroke"/>
    <path class="divider" d="M 328 88 H 568 M 448 88 V 184" vector-effect="non-scaling-stroke"/>
    <rect class="application" x="612" y="48" width="120" height="136" rx="7" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="labels">
    <text class="zone-label" x="224" y="30" text-anchor="end">Public network</text>
    <text class="zone-label" x="248" y="30">Private network</text>
    <text class="label" x="84" y="149.5">Client</text>
    <text class="label" x="236" y="74">Firewall</text>
    <text class="label" x="448" y="74">Glacier2</text>
    <text class="label" x="388" y="130">
      <tspan x="388" dy="0">Client</tspan>
      <tspan x="388" dy="20">endpoints</tspan>
    </text>
    <text class="label" x="508" y="130">
      <tspan x="508" dy="0">Server</tspan>
      <tspan x="508" dy="20">endpoints</tspan>
    </text>
    <text class="label" x="672" y="121.5">Server</text>
    <rect class="label-knockout" x="192" y="192" width="88" height="44" rx="4"/>
    <text class="annotation" x="84" y="208">IP: 1.2.3.4</text>
    <text class="annotation" x="236" y="208">IP: 5.6.7.8</text>
    <text class="annotation" x="236" y="228">Port: 4064</text>
    <text class="annotation" x="388" y="208">IP: 10.0.0.1</text>
    <text class="annotation" x="388" y="228">Port: 9998</text>
    <text class="annotation" x="508" y="208">IP: 10.0.0.1</text>
    <text class="annotation" x="508" y="228">Port: 9999</text>
    <text class="annotation" x="672" y="208">IP: 10.0.0.2</text>
    <path class="connector two-way" d="M 24 272 H 60" vector-effect="non-scaling-stroke"/>
    <text class="legend-label" x="70" y="277">Bidirectional connection</text>
    <path class="connector one-way" d="M 270 272 H 306" vector-effect="non-scaling-stroke"/>
    <text class="legend-label" x="316" y="277">Request</text>
    <path class="connector callback" d="M 400 272 H 436" vector-effect="non-scaling-stroke"/>
    <text class="legend-label" x="446" y="277">Callback</text>
  </g>
</svg>
