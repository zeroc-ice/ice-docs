<?xml version="1.0" encoding="UTF-8"?>
<svg
  width="700"
  height="208"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 700 208"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">A client firewall blocks a callback connection</title>
  <desc id="description">
    The client can open a connection to the server through its firewall, but the firewall blocks a separate incoming
    callback connection from the server.
  </desc>

  <defs>
    <marker
      id="arrow"
      viewBox="0 0 8 8"
      refX="7.2"
      refY="4"
      markerWidth="7"
      markerHeight="7"
      orient="auto-start-reverse"
    >
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#566174"/>
    </marker>
  </defs>

  <style>
    text {
      fill: #182235;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .label {
      font-size: 16px;
      font-weight: 600;
      text-anchor: middle;
    }
    .annotation {
      fill: #566174;
      font-size: 14px;
      text-anchor: middle;
    }
    .zone-label {
      fill: #566174;
      font-size: 14px;
      font-weight: 650;
    }
    .application {
      fill: #ffffff;
      stroke: #8d99aa;
      stroke-width: 1.5;
    }
    .firewall {
      fill: #eef0f3;
      stroke: #566174;
      stroke-width: 1.75;
    }
    .network-boundary {
      fill: none;
      stroke: #7a8699;
      stroke-width: 1.5;
      stroke-dasharray: 7 5;
    }
    .connector {
      fill: none;
      stroke: #566174;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .one-way {
      marker-end: url(#arrow);
    }
    .through-firewall {
      stroke-dasharray: 2 5;
    }
    .blocked {
      stroke: #b42318;
      stroke-dasharray: 6 4;
    }
    .blocked-cross {
      stroke: #b42318;
    }
  </style>

  <rect width="700" height="208" fill="#ffffff"/>

  <g id="boundaries" aria-hidden="true">
    <path class="network-boundary" d="M 438 16 V 192" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="connectors" aria-hidden="true">
    <path class="connector one-way" d="M 144 96 H 556" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="components" aria-hidden="true">
    <rect class="application" x="24" y="64" width="120" height="80" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="firewall" x="224" y="48" width="96" height="112" rx="3" vector-effect="non-scaling-stroke"/>
    <path class="connector through-firewall" d="M 224 96 H 320" vector-effect="non-scaling-stroke"/>
    <path class="connector blocked" d="M 556 128 H 311" vector-effect="non-scaling-stroke"/>
    <path class="connector blocked-cross" d="M 289 117 L 311 139 M 289 139 L 311 117" vector-effect="non-scaling-stroke"/>
    <rect class="application" x="556" y="64" width="120" height="80" rx="7" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="labels">
    <text class="zone-label" x="426" y="30" text-anchor="end">Client network</text>
    <text class="zone-label" x="450" y="30">Server network</text>
    <text class="label" x="84" y="109.5">Client</text>
    <text class="label" x="272" y="74">Firewall</text>
    <text class="label" x="616" y="109.5">Server</text>
    <text class="annotation" x="272" y="188">Incoming callback connection blocked</text>
  </g>
</svg>
