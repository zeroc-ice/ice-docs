<?xml version="1.0" encoding="UTF-8"?>
<svg
  width="700"
  height="464"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 700 464"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Radio clock interface inheritance</title>
  <desc id="description">
    RadioClock inherits from both Radio and AlarmClock. AlarmClock in turn inherits from Clock.
    Hollow triangular arrowheads point from each derived interface toward its base interface.
  </desc>

  <defs>
    <marker id="inheritance-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="#ffffff" stroke="#465266" stroke-linejoin="round" stroke-width="1.8"/>
    </marker>
  </defs>

  <style>
    text {
      fill: #182235;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .interface {
      fill: #ffffff;
      stroke: #8d99aa;
      stroke-width: 1.5;
    }

    .interface-divider {
      stroke: #a6afbc;
      stroke-width: 1.25;
    }

    .inheritance {
      fill: none;
      marker-end: url(#inheritance-arrow);
      stroke: #465266;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 2;
    }

    .category-badge {
      fill: #566174;
      font-size: 13px;
      font-weight: 750;
      letter-spacing: 0.05em;
      text-anchor: middle;
    }

    .interface-name {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 16px;
      font-weight: 600;
      text-anchor: middle;
    }
  </style>

  <rect width="700" height="464" fill="#ffffff"/>

  <g id="boundaries" aria-hidden="true"/>

  <g id="connectors" aria-hidden="true">
    <path class="inheritance" d="M 545 192 V 92" vector-effect="non-scaling-stroke"/>
    <path class="inheritance" d="M 290 366 L 190 266" vector-effect="non-scaling-stroke"/>
    <path class="inheritance" d="M 410 366 L 510 266" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="components" aria-hidden="true">
    <rect class="interface" x="445" y="18" width="200" height="74" rx="7" vector-effect="non-scaling-stroke"/>
    <path class="interface-divider" d="M 445 48 H 645" vector-effect="non-scaling-stroke"/>

    <rect class="interface" x="55" y="192" width="200" height="74" rx="7" vector-effect="non-scaling-stroke"/>
    <path class="interface-divider" d="M 55 222 H 255" vector-effect="non-scaling-stroke"/>

    <rect class="interface" x="445" y="192" width="200" height="74" rx="7" vector-effect="non-scaling-stroke"/>
    <path class="interface-divider" d="M 445 222 H 645" vector-effect="non-scaling-stroke"/>

    <rect class="interface" x="250" y="366" width="200" height="74" rx="7" vector-effect="non-scaling-stroke"/>
    <path class="interface-divider" d="M 250 396 H 450" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="labels">
    <text class="category-badge" x="545" y="39">INTERFACE</text>
    <text class="interface-name" x="545" y="76">Clock</text>

    <text class="category-badge" x="155" y="213">INTERFACE</text>
    <text class="interface-name" x="155" y="250">Radio</text>

    <text class="category-badge" x="545" y="213">INTERFACE</text>
    <text class="interface-name" x="545" y="250">AlarmClock</text>

    <text class="category-badge" x="350" y="387">INTERFACE</text>
    <text class="interface-name" x="350" y="424">RadioClock</text>
  </g>
</svg>
