<?xml version="1.0" encoding="UTF-8"?>
<svg
  width="700"
  height="464"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 700 464"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Diamond interface inheritance</title>
  <desc id="description">
    D inherits from I1 and I2, which both inherit from B. Hollow arrowheads point toward each base interface.
  </desc>

  <defs>
    <marker
      id="inheritance-arrow"
      viewBox="0 0 12 12"
      refX="11"
      refY="6"
      markerWidth="10"
      markerHeight="10"
      orient="auto"
    >
      <path
        d="M 1 1 L 11 6 L 1 11 Z"
        fill="var(--diagram-canvas)"
        stroke="var(--diagram-inheritance)"
        stroke-linejoin="round"
        stroke-width="1.8"
      />
    </marker>
  </defs>

  <style>
    :root {
      --diagram-canvas: #ffffff;
      --diagram-component: #ffffff;
      --diagram-text: #182235;
      --diagram-secondary-text: #566174;
      --diagram-connector: #566174;
      --diagram-component-stroke: #8d99aa;
      --diagram-divider: #a6afbc;
      --diagram-inheritance: #465266;
    }

    @media screen and (prefers-color-scheme: dark) {
      :root {
        --diagram-canvas: #1a1c21;
        --diagram-component: #232429;
        --diagram-text: #e6ebf4;
        --diagram-secondary-text: #a7b3c6;
        --diagram-connector: #a7b3c6;
        --diagram-component-stroke: #8391a6;
        --diagram-divider: #667389;
        --diagram-inheritance: #a7b3c6;
      }
    }

    text {
      fill: var(--diagram-text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .label {
      font-size: 16px;
      font-weight: 600;
      text-anchor: middle;
    }
    .code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }
    .badge {
      fill: var(--diagram-secondary-text);
      font-size: 13px;
      font-weight: 750;
      letter-spacing: 0.05em;
      text-anchor: middle;
    }
    .application {
      fill: var(--diagram-component);
      stroke: var(--diagram-component-stroke);
      stroke-width: 1.5;
    }
    .connector {
      fill: none;
      stroke: var(--diagram-connector);
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .inheritance {
      stroke: var(--diagram-inheritance);
      stroke-width: 2;
      marker-end: url(#inheritance-arrow);
    }
    .divider {
      fill: none;
      stroke: var(--diagram-divider);
      stroke-width: 1.25;
    }
  </style>

  <rect width="700" height="464" fill="var(--diagram-canvas)"/>

  <g id="boundaries" aria-hidden="true">
  </g>

  <g id="connectors" aria-hidden="true">
    <path class="connector inheritance" d="M 200 192 L 300 92" vector-effect="non-scaling-stroke"/>
    <path class="connector inheritance" d="M 500 192 L 400 92" vector-effect="non-scaling-stroke"/>
    <path class="connector inheritance" d="M 290 366 L 190 266" vector-effect="non-scaling-stroke"/>
    <path class="connector inheritance" d="M 410 366 L 510 266" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="components" aria-hidden="true">
    <rect class="application" x="250" y="18" width="200" height="74" rx="7" vector-effect="non-scaling-stroke"/>
    <path class="divider" d="M 250 48 H 450" vector-effect="non-scaling-stroke"/>
    <rect class="application" x="55" y="192" width="200" height="74" rx="7" vector-effect="non-scaling-stroke"/>
    <path class="divider" d="M 55 222 H 255" vector-effect="non-scaling-stroke"/>
    <rect class="application" x="445" y="192" width="200" height="74" rx="7" vector-effect="non-scaling-stroke"/>
    <path class="divider" d="M 445 222 H 645" vector-effect="non-scaling-stroke"/>
    <rect class="application" x="250" y="366" width="200" height="74" rx="7" vector-effect="non-scaling-stroke"/>
    <path class="divider" d="M 250 396 H 450" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="labels">
    <text class="badge" x="350.0" y="39">INTERFACE</text>
    <text class="label code" x="350.0" y="75">B</text>
    <text class="badge" x="155.0" y="213">INTERFACE</text>
    <text class="label code" x="155.0" y="249">I1</text>
    <text class="badge" x="545.0" y="213">INTERFACE</text>
    <text class="label code" x="545.0" y="249">I2</text>
    <text class="badge" x="350.0" y="387">INTERFACE</text>
    <text class="label code" x="350.0" y="423">D</text>
  </g>
</svg>
