<?xml version="1.0" encoding="UTF-8"?>
<svg
  width="700"
  height="363.24"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 740 384"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Locating an object</title>
  <desc id="description">
    The client calls initialOp on an indirect proxy. The Ice runtime queries the locator, then the client sends
    initialOp to the located target object.
  </desc>

  <defs>
    <marker
      id="arrow"
      viewBox="0 0 8 8"
      refX="7.2"
      refY="4"
      markerWidth="7"
      markerHeight="7"
      orient="auto-start-reverse"
    >
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="var(--diagram-connector)"/>
    </marker>
    <circle
      id="step-badge-shape"
      cx="0"
      cy="0"
      r="12"
      fill="var(--diagram-canvas)"
      stroke="var(--diagram-runtime-stroke)"
      stroke-width="1.5"
      vector-effect="non-scaling-stroke"
    />
  </defs>

  <style>
    :root {
      --diagram-canvas: #ffffff;
      --diagram-component: #ffffff;
      --diagram-text: #182235;
      --diagram-secondary-text: #566174;
      --diagram-connector: #566174;
      --diagram-component-stroke: #8d99aa;
      --diagram-runtime-stroke: #1259d6;
      --diagram-runtime: #eef5ff;
      --diagram-host-stroke: #cbd3de;
      --diagram-host: #fbfcfe;
    }

    @media screen and (prefers-color-scheme: dark) {
      :root {
        --diagram-canvas: #1a1c21;
        --diagram-component: #232429;
        --diagram-text: #e6ebf4;
        --diagram-secondary-text: #a7b3c6;
        --diagram-connector: #a7b3c6;
        --diagram-component-stroke: #8391a6;
        --diagram-runtime-stroke: #6aa6ff;
        --diagram-runtime: #21324c;
        --diagram-host-stroke: #667389;
        --diagram-host: #20232b;
      }
    }

    text {
      fill: var(--diagram-text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .label {
      font-size: 16px;
      font-weight: 600;
      text-anchor: middle;
    }
    .annotation {
      fill: var(--diagram-secondary-text);
      font-size: 14px;
    }
    .code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }
    .step-number {
      fill: var(--diagram-runtime-stroke);
      font-size: 13px;
      font-weight: 700;
      text-anchor: middle;
    }
    .application {
      fill: var(--diagram-component);
      stroke: var(--diagram-component-stroke);
      stroke-width: 1.5;
    }
    .runtime {
      fill: var(--diagram-runtime);
      stroke: var(--diagram-runtime-stroke);
      stroke-width: 1.75;
    }
    .boundary {
      fill: var(--diagram-host);
      stroke: var(--diagram-host-stroke);
      stroke-width: 1.5;
      stroke-dasharray: 7 5;
    }
    .connector {
      fill: none;
      stroke: var(--diagram-connector);
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .one-way {
      marker-end: url(#arrow);
    }
  </style>

  <rect width="740" height="384" fill="var(--diagram-canvas)"/>

  <g id="boundaries" aria-hidden="true">
    <rect class="boundary" x="16" y="16" width="236" height="352" rx="14" vector-effect="non-scaling-stroke"/>
    <rect class="boundary" x="476" y="16" width="248" height="164" rx="14" vector-effect="non-scaling-stroke"/>
    <rect class="boundary" x="476" y="204" width="248" height="164" rx="14" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="connectors" aria-hidden="true">
    <path class="connector one-way" d="M 80 76 V 268" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 220 316 H 525" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 220 284 H 300 V 114 H 525" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="components" aria-hidden="true">
    <rect class="runtime" x="48" y="268" width="172" height="64" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="application" x="525" y="82" width="150" height="64" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="runtime" x="525" y="284" width="150" height="64" rx="7" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="labels">
    <text class="label" x="134" y="42">Client application</text>
    <text class="label" x="134" y="306">Ice runtime</text>
    <text class="label" x="600" y="42">Server</text>
    <text class="label" x="600" y="120">Target object</text>
    <text class="label" x="600" y="230">Location service</text>
    <text class="label" x="600" y="322">Locator</text>
    <use href="#step-badge-shape" x="102" y="168"/>
    <text class="step-number" x="102" y="172.5">1</text>
    <text class="annotation code" x="122" y="173">initialOp</text>
    <use href="#step-badge-shape" x="324" y="302"/>
    <text class="step-number" x="324" y="306.5">2</text>
    <text class="annotation" x="344" y="307">query</text>
    <use href="#step-badge-shape" x="324" y="100"/>
    <text class="step-number" x="324" y="104.5">3</text>
    <text class="annotation code" x="344" y="105">initialOp</text>
  </g>
</svg>
