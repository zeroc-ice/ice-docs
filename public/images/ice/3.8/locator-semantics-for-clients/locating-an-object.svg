<?xml version="1.0" encoding="UTF-8"?>
<svg
  width="700"
  height="350"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 900 450"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Locating an object</title>
  <desc id="description">
    The client calls initialOp on an indirect proxy. The Ice runtime queries the locator, then the client sends
    initialOp to the located target object.
  </desc>

  <defs>
    <marker
      id="arrow"
      viewBox="0 0 8 8"
      refX="7.2"
      refY="4"
      markerWidth="7"
      markerHeight="7"
      orient="auto-start-reverse"
    >
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#566174"/>
    </marker>
    <circle
      id="step-badge-shape"
      cx="0"
      cy="0"
      r="12"
      fill="#ffffff"
      stroke="#1259d6"
      stroke-width="1.5"
      vector-effect="non-scaling-stroke"
    />
  </defs>

  <style>
    text {
      fill: #182235;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .label {
      font-size: 16px;
      font-weight: 600;
      text-anchor: middle;
    }
    .annotation {
      fill: #566174;
      font-size: 14px;
      text-anchor: middle;
    }
    .application {
      fill: #ffffff;
      stroke: #8d99aa;
      stroke-width: 1.5;
    }
    .runtime {
      fill: #eef5ff;
      stroke: #1259d6;
      stroke-width: 1.75;
    }
    .boundary {
      fill: #fbfcfe;
      stroke: #cbd3de;
      stroke-width: 1.5;
      stroke-dasharray: 7 5;
    }
    .connector {
      fill: none;
      stroke: #566174;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .one-way {
      marker-end: url(#arrow);
    }
  </style>

  <rect width="900" height="450" fill="#ffffff"/>

  <g id="boundaries" aria-hidden="true">
    <rect class="boundary" x="24" y="128" width="250" height="230" rx="14" vector-effect="non-scaling-stroke"/>
    <rect class="boundary" x="650" y="24" width="226" height="168" rx="14" vector-effect="non-scaling-stroke"/>
    <rect class="boundary" x="650" y="260" width="226" height="166" rx="14" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="connectors" aria-hidden="true">
    <path class="connector one-way" d="M 158 213 C 45 205 45 263 89 286" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 249 294 L 688 367" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 274 190 L 688 130" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="components" aria-hidden="true">
    <rect class="runtime" x="89" y="260" width="160" height="65" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="application" x="688" y="98" width="150" height="65" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="runtime" x="688" y="334" width="150" height="65" rx="7" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="labels">
    <text class="label" x="149.0" y="153">Client application</text>
    <text class="label" x="169.0" y="297.5">Ice runtime</text>
    <text class="label" x="763.0" y="49">Server</text>
    <text class="label" x="763.0" y="125.5">
      <tspan x="763.0" dy="0">Target</tspan>
      <tspan x="763.0" dy="20">object</tspan>
    </text>
    <text class="label" x="763.0" y="285">Location service</text>
    <text class="label" x="763.0" y="371.5">Locator</text>
    <use href="#step-badge-shape" x="137" y="212"/>
    <text class="annotation" x="137" y="217">1</text>
    <rect x="159.0" y="201" width="88" height="24" rx="4" fill="#ffffff"/>
    <text class="annotation" x="203" y="217">initialOp</text>
    <use href="#step-badge-shape" x="405" y="323"/>
    <text class="annotation" x="405" y="328">2</text>
    <rect x="427.0" y="312" width="56" height="24" rx="4" fill="#ffffff"/>
    <text class="annotation" x="455" y="328">query</text>
    <use href="#step-badge-shape" x="430" y="146"/>
    <text class="annotation" x="430" y="151">3</text>
    <rect x="452.0" y="135" width="88" height="24" rx="4" fill="#ffffff"/>
    <text class="annotation" x="496" y="151">initialOp</text>
  </g>
</svg>
