<?xml version="1.0" encoding="UTF-8"?>
<svg
  width="700"
  height="281.89"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 740 298"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Locating an encoder server</title>
  <desc id="description">
    The client first locates EncoderAdapter through the registry on ComputeServer. The client then invokes encode on
    EncoderServer.
  </desc>

  <defs>
    <marker
      id="arrow"
      viewBox="0 0 8 8"
      refX="7.2"
      refY="4"
      markerWidth="7"
      markerHeight="7"
      orient="auto-start-reverse"
    >
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#566174"/>
    </marker>
    <circle
      id="step-badge-shape"
      cx="0"
      cy="0"
      r="12"
      fill="#ffffff"
      stroke="#1259d6"
      stroke-width="1.5"
      vector-effect="non-scaling-stroke"
    />
  </defs>

  <style>
    text {
      fill: #182235;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .label {
      font-size: 16px;
      font-weight: 600;
      text-anchor: middle;
    }
    .annotation {
      fill: #566174;
      font-size: 14px;
    }
    .code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }
    .step-number {
      fill: #1259d6;
      font-size: 13px;
      font-weight: 700;
      text-anchor: middle;
    }
    .application {
      fill: #ffffff;
      stroke: #8d99aa;
      stroke-width: 1.5;
    }
    .runtime {
      fill: #eef5ff;
      stroke: #1259d6;
      stroke-width: 1.75;
    }
    .boundary {
      fill: #fbfcfe;
      stroke: #cbd3de;
      stroke-width: 1.5;
      stroke-dasharray: 7 5;
    }
    .connector {
      fill: none;
      stroke: #566174;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .one-way {
      marker-end: url(#arrow);
    }
  </style>

  <rect width="740" height="298" fill="#ffffff"/>

  <g id="boundaries" aria-hidden="true">
    <rect class="boundary" x="16" y="16" width="180" height="266" rx="14" vector-effect="non-scaling-stroke"/>
    <rect class="boundary" x="492" y="16" width="232" height="266" rx="14" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="connectors" aria-hidden="true">
    <path class="connector one-way" d="M 176 156 H 228 V 110 H 527" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 176 184 H 228 V 230 H 527" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="components" aria-hidden="true">
    <rect class="application" x="36" y="142" width="140" height="56" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="runtime" x="527" y="82" width="170" height="56" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="application" x="527" y="202" width="170" height="56" rx="7" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="labels">
    <text class="label" x="106" y="42">Client PC</text>
    <text class="label" x="106" y="176">Client</text>
    <text class="label" x="608" y="42">Host: ComputeServer</text>
    <text class="label" x="612" y="116">Registry</text>
    <text class="label" x="612" y="236">EncoderServer</text>
    <use href="#step-badge-shape" x="252" y="92"/>
    <text class="step-number" x="252" y="96.5">1</text>
    <text class="annotation code" x="272" y="97">locate(EncoderAdapter)</text>
    <use href="#step-badge-shape" x="252" y="212"/>
    <text class="step-number" x="252" y="216.5">2</text>
    <text class="annotation code" x="272" y="217">encode</text>
  </g>
</svg>
