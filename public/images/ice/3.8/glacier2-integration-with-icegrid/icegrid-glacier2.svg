<?xml version="1.0" encoding="UTF-8"?>
<svg
  width="700"
  height="261.58"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 760 284"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Glacier2 integration with IceGrid</title>
  <desc id="description">
    A public client at 1.2.3.4 connects to Glacier2 on the Firewall PC through client endpoints at 5.6.7.8. Glacier2
    uses server endpoints at 10.0.0.1 and contacts the IceGrid registry on the private Server PC at 10.0.0.2.
  </desc>

  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7.2" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#566174"/>
    </marker>
  </defs>

  <style>
    text {
      fill: #182235;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .process-boundary {
      fill: #fbfcfe;
      stroke: #cbd3de;
      stroke-dasharray: 7 5;
      stroke-width: 1.5;
    }

    .network-boundary {
      fill: none;
      stroke: #7a8699;
      stroke-dasharray: 7 5;
      stroke-width: 1.5;
    }

    .component {
      fill: #ffffff;
      stroke: #8d99aa;
      stroke-width: 1.5;
    }

    .service {
      fill: #eef5ff;
      stroke: #1259d6;
      stroke-width: 1.75;
    }

    .divider {
      fill: none;
      stroke: #a6afbc;
      stroke-width: 1.25;
    }

    .connector {
      fill: none;
      stroke: #566174;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.75;
    }

    .one-way,
    .callback {
      marker-end: url(#arrow);
    }

    .process-title,
    .component-label {
      font-size: 16px;
      font-weight: 600;
      text-anchor: middle;
    }

    .annotation {
      fill: #566174;
      font-size: 14px;
      font-weight: 500;
      text-anchor: middle;
    }

    .zone-label {
      fill: #566174;
      font-size: 14px;
      font-weight: 650;
    }
  </style>

  <rect width="760" height="284" fill="#ffffff"/>

  <g id="boundaries" aria-hidden="true">
    <rect class="process-boundary" x="24" y="48" width="160" height="220" rx="14" vector-effect="non-scaling-stroke"/>
    <rect class="process-boundary" x="220" y="48" width="320" height="220" rx="14" vector-effect="non-scaling-stroke"/>
    <rect class="process-boundary" x="576" y="48" width="160" height="220" rx="14" vector-effect="non-scaling-stroke"/>
    <!-- The zone line crosses the Firewall PC, leaving a gap for its title. -->
    <path class="network-boundary" d="M 380 16 V 54 M 380 80 V 268" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="connectors" aria-hidden="true">
    <path class="connector one-way" d="M 168 176 H 260" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 500 108 H 592" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="components" aria-hidden="true">
    <rect class="component" x="40" y="141" width="128" height="70" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="service" x="260" y="88" width="240" height="136" rx="8" vector-effect="non-scaling-stroke"/>
    <path class="divider" d="M 260 128 H 500 M 380 128 V 224" vector-effect="non-scaling-stroke"/>
    <rect class="service" x="592" y="88" width="128" height="70" rx="7" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="labels">
    <text class="zone-label" x="368" y="30" text-anchor="end">Public network</text>
    <text class="zone-label" x="392" y="30">Private network</text>
    <text class="process-title" x="104" y="74">Client PC</text>
    <text class="process-title" x="380" y="74">Firewall PC</text>
    <text class="process-title" x="656" y="74">Server PC</text>
    <text class="component-label" x="104" y="181">Client app</text>
    <text class="annotation" x="104" y="248">IP: 1.2.3.4</text>
    <text class="component-label" x="380" y="114">Glacier2</text>
    <text class="component-label" x="320" y="170">
      <tspan x="320">Client</tspan>
      <tspan x="320" dy="20">endpoints</tspan>
    </text>
    <text class="component-label" x="440" y="170">
      <tspan x="440">Server</tspan>
      <tspan x="440" dy="20">endpoints</tspan>
    </text>
    <text class="annotation" x="320" y="248">IP: 5.6.7.8</text>
    <text class="annotation" x="440" y="248">IP: 10.0.0.1</text>
    <text class="component-label" x="656" y="118">
      <tspan x="656">IceGrid</tspan>
      <tspan x="656" dy="20">registry</tspan>
    </text>
    <text class="annotation" x="656" y="248">IP: 10.0.0.2</text>
  </g>
</svg>
