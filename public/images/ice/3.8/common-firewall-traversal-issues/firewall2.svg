<?xml version="1.0" encoding="UTF-8"?>
<svg
  width="700"
  height="228"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 700 228"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Firewall traversal: 2</title>
  <desc id="description">
    Client requests and server callbacks travel in opposite directions through both firewalls over separate
    connections.
  </desc>

  <defs>
    <marker
      id="arrow"
      viewBox="0 0 8 8"
      refX="7.2"
      refY="4"
      markerWidth="7"
      markerHeight="7"
      orient="auto-start-reverse"
    >
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#566174"/>
    </marker>
  </defs>

  <style>
    text {
      fill: #182235;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .label {
      font-size: 16px;
      font-weight: 600;
      text-anchor: middle;
    }
    .zone-label {
      fill: #566174;
      font-size: 14px;
      font-weight: 650;
    }
    .legend-label {
      fill: #566174;
      font-size: 14px;
      font-weight: 500;
    }
    .application {
      fill: #ffffff;
      stroke: #8d99aa;
      stroke-width: 1.5;
    }
    .firewall {
      fill: #eef0f3;
      stroke: #566174;
      stroke-width: 1.75;
    }
    .network-boundary {
      fill: none;
      stroke: #7a8699;
      stroke-width: 1.5;
      stroke-dasharray: 7 5;
    }
    .connector {
      fill: none;
      stroke: #566174;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .one-way {
      marker-end: url(#arrow);
    }
    .callback {
      stroke-dasharray: 6 4;
      marker-end: url(#arrow);
    }
    .through-firewall {
      stroke-dasharray: 2 5;
    }
  </style>

  <rect width="700" height="228" fill="#ffffff"/>

  <g id="boundaries" aria-hidden="true">
    <path class="network-boundary" d="M 350 16 V 172" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="connectors" aria-hidden="true">
    <path class="connector one-way" d="M 144 92 H 556" vector-effect="non-scaling-stroke"/>
    <path class="connector callback" d="M 556 124 H 144" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="components" aria-hidden="true">
    <rect class="application" x="24" y="60" width="120" height="88" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="firewall" x="214" y="44" width="96" height="120" rx="3" vector-effect="non-scaling-stroke"/>
    <path class="connector through-firewall" d="M 214 92 H 310" vector-effect="non-scaling-stroke"/>
    <path class="connector through-firewall" d="M 214 124 H 310" vector-effect="non-scaling-stroke"/>
    <rect class="firewall" x="390" y="44" width="96" height="120" rx="3" vector-effect="non-scaling-stroke"/>
    <path class="connector through-firewall" d="M 390 92 H 486" vector-effect="non-scaling-stroke"/>
    <path class="connector through-firewall" d="M 390 124 H 486" vector-effect="non-scaling-stroke"/>
    <rect class="application" x="556" y="60" width="120" height="88" rx="7" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="labels">
    <text class="zone-label" x="338" y="30" text-anchor="end">Client network</text>
    <text class="zone-label" x="362" y="30">Server network</text>
    <text class="label" x="84" y="109.5">Client</text>
    <text class="label" x="262" y="70">Firewall</text>
    <text class="label" x="438" y="70">Firewall</text>
    <text class="label" x="616" y="109.5">Server</text>
    <path class="connector one-way" d="M 24 204 H 60" vector-effect="non-scaling-stroke"/>
    <text class="legend-label" x="70" y="209">Request</text>
    <path class="connector callback" d="M 154 204 H 190" vector-effect="non-scaling-stroke"/>
    <text class="legend-label" x="200" y="209">Callback</text>
  </g>
</svg>
