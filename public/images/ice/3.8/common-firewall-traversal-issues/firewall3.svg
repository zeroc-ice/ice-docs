<?xml version="1.0" encoding="UTF-8"?>
<svg
  width="700"
  height="344"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 700 344"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Firewall traversal: 3</title>
  <desc id="description">
    Two clients and two servers exchange requests and callbacks through the same pair of firewalls. Separate arrows
    show requests and callbacks.
  </desc>

  <defs>
    <marker
      id="arrow"
      viewBox="0 0 8 8"
      refX="7.2"
      refY="4"
      markerWidth="7"
      markerHeight="7"
      orient="auto-start-reverse"
    >
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#566174"/>
    </marker>
  </defs>

  <style>
    text {
      fill: #182235;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .label {
      font-size: 16px;
      font-weight: 600;
      text-anchor: middle;
    }
    .zone-label {
      fill: #566174;
      font-size: 14px;
      font-weight: 650;
    }
    .legend-label {
      fill: #566174;
      font-size: 14px;
      font-weight: 500;
    }
    .application {
      fill: #ffffff;
      stroke: #8d99aa;
      stroke-width: 1.5;
    }
    .firewall {
      fill: #eef0f3;
      stroke: #566174;
      stroke-width: 1.75;
    }
    .network-boundary {
      fill: none;
      stroke: #7a8699;
      stroke-width: 1.5;
      stroke-dasharray: 7 5;
    }
    .connector {
      fill: none;
      stroke: #566174;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .one-way {
      marker-end: url(#arrow);
    }
    .callback {
      stroke-dasharray: 6 4;
      marker-end: url(#arrow);
    }
  </style>

  <rect width="700" height="344" fill="#ffffff"/>

  <g id="boundaries" aria-hidden="true">
    <path class="network-boundary" d="M 350 16 V 296" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="connectors" aria-hidden="true">
    <path class="connector callback" d="M 214 88 H 144" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 144 120 H 214" vector-effect="non-scaling-stroke"/>
    <path class="connector callback" d="M 556 88 H 486" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 486 120 H 556" vector-effect="non-scaling-stroke"/>
    <path class="connector callback" d="M 214 208 H 144" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 144 240 H 214" vector-effect="non-scaling-stroke"/>
    <path class="connector callback" d="M 556 208 H 486" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 486 240 H 556" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 310 148 H 390" vector-effect="non-scaling-stroke"/>
    <path class="connector callback" d="M 390 180 H 310" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="components" aria-hidden="true">
    <rect class="application" x="24" y="64" width="120" height="80" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="application" x="24" y="184" width="120" height="80" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="firewall" x="214" y="48" width="96" height="232" rx="3" vector-effect="non-scaling-stroke"/>
    <rect class="firewall" x="390" y="48" width="96" height="232" rx="3" vector-effect="non-scaling-stroke"/>
    <rect class="application" x="556" y="64" width="120" height="80" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="application" x="556" y="184" width="120" height="80" rx="7" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="labels">
    <text class="zone-label" x="338" y="30" text-anchor="end">Client network</text>
    <text class="zone-label" x="362" y="30">Server network</text>
    <text class="label" x="84" y="109.5">Client A</text>
    <text class="label" x="84" y="229.5">Client B</text>
    <text class="label" x="262" y="74">Firewall</text>
    <text class="label" x="438" y="74">Firewall</text>
    <text class="label" x="616" y="109.5">Server A</text>
    <text class="label" x="616" y="229.5">Server B</text>
    <path class="connector one-way" d="M 24 320 H 60" vector-effect="non-scaling-stroke"/>
    <text class="legend-label" x="70" y="325">Request</text>
    <path class="connector callback" d="M 154 320 H 190" vector-effect="non-scaling-stroke"/>
    <text class="legend-label" x="200" y="325">Callback</text>
  </g>
</svg>
