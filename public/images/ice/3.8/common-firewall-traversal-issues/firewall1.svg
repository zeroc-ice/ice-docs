<?xml version="1.0" encoding="UTF-8"?>
<svg
  width="700"
  height="168"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 700 168"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Firewall traversal: 1</title>
  <desc id="description">
    A client request passes through a client-side firewall and a server-side firewall before reaching the server.
  </desc>

  <defs>
    <marker
      id="arrow"
      viewBox="0 0 8 8"
      refX="7.2"
      refY="4"
      markerWidth="7"
      markerHeight="7"
      orient="auto-start-reverse"
    >
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="var(--diagram-connector)"/>
    </marker>
  </defs>

  <style>
    :root {
      --diagram-canvas: #ffffff;
      --diagram-component: #ffffff;
      --diagram-text: #182235;
      --diagram-secondary-text: #566174;
      --diagram-connector: #566174;
      --diagram-component-stroke: #8d99aa;
      --diagram-network: #7a8699;
      --diagram-firewall: #eef0f3;
    }

    @media screen and (prefers-color-scheme: dark) {
      :root {
        --diagram-canvas: #1a1c21;
        --diagram-component: #232429;
        --diagram-text: #e6ebf4;
        --diagram-secondary-text: #a7b3c6;
        --diagram-connector: #a7b3c6;
        --diagram-component-stroke: #8391a6;
        --diagram-network: #8391a6;
        --diagram-firewall: #2c3039;
      }
    }

    text {
      fill: var(--diagram-text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .label {
      font-size: 16px;
      font-weight: 600;
      text-anchor: middle;
    }
    .zone-label {
      fill: var(--diagram-secondary-text);
      font-size: 14px;
      font-weight: 650;
    }
    .application {
      fill: var(--diagram-component);
      stroke: var(--diagram-component-stroke);
      stroke-width: 1.5;
    }
    .firewall {
      fill: var(--diagram-firewall);
      stroke: var(--diagram-connector);
      stroke-width: 1.75;
    }
    .network-boundary {
      fill: none;
      stroke: var(--diagram-network);
      stroke-width: 1.5;
      stroke-dasharray: 7 5;
    }
    .connector {
      fill: none;
      stroke: var(--diagram-connector);
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .one-way {
      marker-end: url(#arrow);
    }
    .through-firewall {
      stroke-dasharray: 2 5;
    }
  </style>

  <rect width="700" height="168" fill="var(--diagram-canvas)"/>

  <g id="boundaries" aria-hidden="true">
    <path class="network-boundary" d="M 350 16 V 152" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="connectors" aria-hidden="true">
    <path class="connector one-way" d="M 144 96 H 556" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="components" aria-hidden="true">
    <rect class="application" x="24" y="64" width="120" height="64" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="firewall" x="214" y="48" width="96" height="96" rx="3" vector-effect="non-scaling-stroke"/>
    <path class="connector through-firewall" d="M 214 96 H 310" vector-effect="non-scaling-stroke"/>
    <rect class="firewall" x="390" y="48" width="96" height="96" rx="3" vector-effect="non-scaling-stroke"/>
    <path class="connector through-firewall" d="M 390 96 H 486" vector-effect="non-scaling-stroke"/>
    <rect class="application" x="556" y="64" width="120" height="64" rx="7" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="labels">
    <text class="zone-label" x="338" y="30" text-anchor="end">Client network</text>
    <text class="zone-label" x="362" y="30">Server network</text>
    <text class="label" x="84" y="101.5">Client</text>
    <text class="label" x="262" y="74">Firewall</text>
    <text class="label" x="438" y="74">Firewall</text>
    <text class="label" x="616" y="101.5">Server</text>
  </g>
</svg>
