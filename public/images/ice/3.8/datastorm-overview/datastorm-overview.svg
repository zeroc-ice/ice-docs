<?xml version="1.0" encoding="UTF-8"?>
<svg
  width="700"
  height="402"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 700 402"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">DataStorm sample flow</title>
  <desc id="description">
    A temperature writer publishes through its topic and Node A. Samples travel to Node B, then through its temperature
    topic to a reader.
  </desc>

  <defs>
    <marker
      id="arrow"
      viewBox="0 0 8 8"
      refX="7.2"
      refY="4"
      markerWidth="7"
      markerHeight="7"
      orient="auto-start-reverse"
    >
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="var(--diagram-connector)"/>
    </marker>
  </defs>

  <style>
    :root {
      --diagram-canvas: #ffffff;
      --diagram-component: #ffffff;
      --diagram-text: #182235;
      --diagram-secondary-text: #566174;
      --diagram-connector: #566174;
      --diagram-component-stroke: #8d99aa;
      --diagram-runtime-stroke: #1259d6;
      --diagram-runtime: #eef5ff;
      --diagram-host-stroke: #cbd3de;
      --diagram-host: #fbfcfe;
      --diagram-api: #f8fbff;
      --diagram-api-stroke: #4f78bb;
      --diagram-data: #f6f7f9;
    }

    @media screen and (prefers-color-scheme: dark) {
      :root {
        --diagram-canvas: #1a1c21;
        --diagram-component: #232429;
        --diagram-text: #e6ebf4;
        --diagram-secondary-text: #a7b3c6;
        --diagram-connector: #a7b3c6;
        --diagram-component-stroke: #8391a6;
        --diagram-runtime-stroke: #6aa6ff;
        --diagram-runtime: #21324c;
        --diagram-host-stroke: #667389;
        --diagram-host: #20232b;
        --diagram-api: #202c3e;
        --diagram-api-stroke: #7da7e6;
        --diagram-data: #292e38;
      }
    }

    text {
      fill: var(--diagram-text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .label {
      font-size: 16px;
      font-weight: 600;
      text-anchor: middle;
    }
    .annotation {
      fill: var(--diagram-secondary-text);
      font-size: 14px;
      text-anchor: middle;
    }
    .application {
      fill: var(--diagram-component);
      stroke: var(--diagram-component-stroke);
      stroke-width: 1.5;
    }
    .api {
      fill: var(--diagram-api);
      stroke: var(--diagram-api-stroke);
      stroke-width: 1.5;
    }
    .runtime {
      fill: var(--diagram-runtime);
      stroke: var(--diagram-runtime-stroke);
      stroke-width: 1.75;
    }
    .data {
      fill: var(--diagram-data);
      stroke: var(--diagram-component-stroke);
      stroke-width: 1.25;
    }
    .boundary {
      fill: var(--diagram-host);
      stroke: var(--diagram-host-stroke);
      stroke-width: 1.5;
      stroke-dasharray: 7 5;
    }
    .connector {
      fill: none;
      stroke: var(--diagram-connector);
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .one-way {
      marker-end: url(#arrow);
    }
  </style>

  <rect width="700" height="402" fill="var(--diagram-canvas)"/>

  <g id="boundaries" aria-hidden="true">
    <rect class="boundary" x="16" y="16" width="240" height="370" rx="14" vector-effect="non-scaling-stroke"/>
    <rect class="boundary" x="444" y="16" width="240" height="370" rx="14" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="connectors" aria-hidden="true">
    <path class="connector one-way" d="M 136 316 V 272" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 136 216 V 160" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 564 160 V 216" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 564 272 V 316" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 239 100 H 461" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="components" aria-hidden="true">
    <rect class="runtime" x="33" y="40" width="206" height="120" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="api" x="33" y="216" width="206" height="56" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="application" x="33" y="316" width="206" height="46" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="runtime" x="461" y="40" width="206" height="120" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="api" x="461" y="216" width="206" height="56" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="application" x="461" y="316" width="206" height="46" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="data" x="279" y="91" width="18" height="18" rx="4" vector-effect="non-scaling-stroke"/>
    <rect class="data" x="310" y="91" width="18" height="18" rx="4" vector-effect="non-scaling-stroke"/>
    <rect class="data" x="341" y="91" width="18" height="18" rx="4" vector-effect="non-scaling-stroke"/>
    <rect class="data" x="372" y="91" width="18" height="18" rx="4" vector-effect="non-scaling-stroke"/>
    <rect class="data" x="403" y="91" width="18" height="18" rx="4" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="labels">
    <text class="label" x="136" y="105">Node A</text>
    <text class="label" x="136" y="249">Topic (temperature)</text>
    <text class="label" x="136" y="344">Writer (temperature)</text>
    <text class="label" x="564" y="105">Node B</text>
    <text class="label" x="564" y="249">Topic (temperature)</text>
    <text class="label" x="564" y="344">Reader (temperature)</text>
    <text class="annotation" x="350" y="76">Samples</text>
  </g>
</svg>
