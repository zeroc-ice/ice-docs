<?xml version="1.0" encoding="UTF-8"?>
<svg
  width="700"
  height="248.89"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 900 320"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Glacier2 router configuration for IceGrid</title>
  <desc id="description">
    The client at 10.0.0.1 uses a bidirectional connection to Glacier2 client endpoints at 1.2.3.4. Glacier2 server
    endpoints use 10.0.0.1. Glacier2 and the IceGrid registry at 10.0.0.2 port 4061 use separate request and
    callback connections.
  </desc>

  <defs>
    <marker
      id="arrow"
      viewBox="0 0 8 8"
      refX="7.2"
      refY="4"
      markerWidth="7"
      markerHeight="7"
      orient="auto-start-reverse"
    >
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#566174"/>
    </marker>
  </defs>

  <style>
    text {
      fill: #182235;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .label {
      font-size: 16px;
      font-weight: 600;
      text-anchor: middle;
    }
    .annotation {
      fill: #566174;
      font-size: 14px;
      text-anchor: middle;
    }
    .application {
      fill: #ffffff;
      stroke: #8d99aa;
      stroke-width: 1.5;
    }
    .runtime {
      fill: #eef5ff;
      stroke: #1259d6;
      stroke-width: 1.75;
    }
    .network-boundary {
      fill: none;
      stroke: #7a8699;
      stroke-width: 1.5;
      stroke-dasharray: 7 5;
    }
    .connector {
      fill: none;
      stroke: #566174;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .one-way {
      marker-end: url(#arrow);
    }
    .two-way {
      marker-start: url(#arrow);
      marker-end: url(#arrow);
    }
    .callback {
      stroke-dasharray: 6 4;
      marker-end: url(#arrow);
    }
    .divider {
      fill: none;
      stroke: #a6afbc;
      stroke-width: 1.25;
    }
  </style>

  <rect width="900" height="320" fill="#ffffff"/>

  <g id="boundaries" aria-hidden="true">
    <path class="network-boundary" d="M 450 18 V 300" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="connectors" aria-hidden="true">
    <path class="connector two-way" d="M 184 184 L 320 184" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 580 134 L 716 134" vector-effect="non-scaling-stroke"/>
    <path class="connector callback" d="M 716 184 L 580 184" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="components" aria-hidden="true">
    <rect class="application" x="24" y="112" width="160" height="100" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="runtime" x="320" y="52" width="260" height="160" rx="7" vector-effect="non-scaling-stroke"/>
    <path class="divider" d="M 320 132 H 580 M 450.0 132 V 212" vector-effect="non-scaling-stroke"/>
    <rect class="runtime" x="716" y="112" width="160" height="100" rx="7" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="labels">
    <text class="label" x="104.0" y="167.0">Client</text>
    <text class="label" x="450.0" y="96">Glacier2</text>
    <text class="label" x="385.0" y="163">
      <tspan x="385.0" dy="0">Client</tspan>
      <tspan x="385.0" dy="20">endpoints</tspan>
    </text>
    <text class="label" x="515.0" y="163">
      <tspan x="515.0" dy="0">Server</tspan>
      <tspan x="515.0" dy="20">endpoints</tspan>
    </text>
    <text class="label" x="796.0" y="157.0">
      <tspan x="796.0" dy="0">IceGrid</tspan>
      <tspan x="796.0" dy="20">registry</tspan>
    </text>
    <text class="annotation" x="104" y="245">IP: 10.0.0.1</text>
    <text class="annotation" x="385" y="245">IP: 1.2.3.4</text>
    <text class="annotation" x="515" y="245">IP: 10.0.0.1</text>
    <text class="annotation" x="796" y="245">IP: 10.0.0.2</text>
    <text class="annotation" x="796" y="267">Port: 4061</text>
  </g>
</svg>
