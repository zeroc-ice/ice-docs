<?xml version="1.0" encoding="UTF-8"?>
<svg
  width="700"
  height="291.05"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 760 316"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Glacier2 router configuration for IceGrid</title>
  <desc id="description">
    The client at 10.0.0.1 uses a bidirectional connection to Glacier2 client endpoints at 1.2.3.4 on the public
    network. Glacier2 server endpoints use 10.0.0.1 on the private network. Glacier2 and the IceGrid registry at
    10.0.0.2 port 4061 use separate request and callback connections. A legend distinguishes requests from
    callbacks.
  </desc>

  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7.2" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#566174"/>
    </marker>
  </defs>

  <style>
    text {
      fill: #182235;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .network-boundary {
      fill: none;
      stroke: #7a8699;
      stroke-dasharray: 7 5;
      stroke-width: 1.5;
    }

    .component {
      fill: #ffffff;
      stroke: #8d99aa;
      stroke-width: 1.5;
    }

    .service {
      fill: #eef5ff;
      stroke: #1259d6;
      stroke-width: 1.75;
    }

    .divider {
      fill: none;
      stroke: #a6afbc;
      stroke-width: 1.25;
    }

    .connector {
      fill: none;
      stroke: #566174;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.75;
    }

    .two-way {
      marker-end: url(#arrow);
      marker-start: url(#arrow);
    }

    .one-way,
    .callback {
      marker-end: url(#arrow);
    }

    .callback {
      stroke-dasharray: 6 4;
    }

    .process-title,
    .component-label {
      font-size: 16px;
      font-weight: 600;
      text-anchor: middle;
    }

    .annotation {
      fill: #566174;
      font-size: 14px;
      font-weight: 500;
      text-anchor: middle;
    }

    .zone-label {
      fill: #566174;
      font-size: 14px;
      font-weight: 650;
    }

    .legend-label {
      fill: #566174;
      font-size: 14px;
      font-weight: 500;
    }
  </style>

  <rect width="760" height="316" fill="#ffffff"/>

  <g id="boundaries" aria-hidden="true">
    <path class="network-boundary" d="M 380 16 V 268" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="connectors" aria-hidden="true">
    <path class="connector two-way" d="M 164 152 H 260" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 500 84 H 556 V 128 H 616" vector-effect="non-scaling-stroke"/>
    <path class="connector callback" d="M 616 168 H 500" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 24 288 H 60" vector-effect="non-scaling-stroke"/>
    <path class="connector callback" d="M 177 288 H 213" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="components" aria-hidden="true">
    <rect class="component" x="24" y="117" width="140" height="70" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="service" x="260" y="64" width="240" height="136" rx="8" vector-effect="non-scaling-stroke"/>
    <path class="divider" d="M 260 104 H 500 M 380 104 V 200" vector-effect="non-scaling-stroke"/>
    <rect class="service" x="616" y="112" width="120" height="70" rx="7" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="labels">
    <text class="zone-label" x="368" y="30" text-anchor="end">Public network</text>
    <text class="zone-label" x="392" y="30">Private network</text>
    <text class="component-label" x="94" y="157">Client</text>
    <text class="annotation" x="94" y="224">IP: 10.0.0.1</text>
    <text class="component-label" x="380" y="90">Glacier2</text>
    <text class="component-label" x="320" y="146">
      <tspan x="320">Client</tspan>
      <tspan x="320" dy="20">endpoints</tspan>
    </text>
    <text class="component-label" x="440" y="146">
      <tspan x="440">Server</tspan>
      <tspan x="440" dy="20">endpoints</tspan>
    </text>
    <text class="annotation" x="320" y="224">IP: 1.2.3.4</text>
    <text class="annotation" x="440" y="224">IP: 10.0.0.1</text>
    <text class="component-label" x="676" y="142">
      <tspan x="676">IceGrid</tspan>
      <tspan x="676" dy="20">registry</tspan>
    </text>
    <text class="annotation" x="676" y="224">IP: 10.0.0.2</text>
    <text class="annotation" x="676" y="244">Port: 4061</text>
    <text class="legend-label" x="70" y="293">Request</text>
    <text class="legend-label" x="223" y="293">Callback</text>
  </g>
</svg>
