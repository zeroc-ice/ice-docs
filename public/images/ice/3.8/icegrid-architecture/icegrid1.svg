<?xml version="1.0" encoding="UTF-8"?>
<svg
  width="700"
  height="440"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 700 440"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">IceGrid architecture on three hosts</title>
  <desc id="description">
    Host PC1 runs the registry. Host PC2 runs Node A and Server X. Host PC3 runs Node B and Server Y.
  </desc>

  <style>
    :root {
      --diagram-canvas: #ffffff;
      --diagram-component: #ffffff;
      --diagram-text: #182235;
      --diagram-component-stroke: #8d99aa;
      --diagram-runtime-stroke: #1259d6;
      --diagram-runtime: #eef5ff;
      --diagram-host-stroke: #cbd3de;
      --diagram-host: #fbfcfe;
    }

    @media screen and (prefers-color-scheme: dark) {
      :root {
        --diagram-canvas: #1a1c21;
        --diagram-component: #232429;
        --diagram-text: #e6ebf4;
        --diagram-component-stroke: #8391a6;
        --diagram-runtime-stroke: #6aa6ff;
        --diagram-runtime: #21324c;
        --diagram-host-stroke: #667389;
        --diagram-host: #20232b;
      }
    }

    text {
      fill: var(--diagram-text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .label {
      font-size: 16px;
      font-weight: 600;
      text-anchor: middle;
    }
    .application {
      fill: var(--diagram-component);
      stroke: var(--diagram-component-stroke);
      stroke-width: 1.5;
    }
    .runtime {
      fill: var(--diagram-runtime);
      stroke: var(--diagram-runtime-stroke);
      stroke-width: 1.75;
    }
    .boundary {
      fill: var(--diagram-host);
      stroke: var(--diagram-host-stroke);
      stroke-width: 1.5;
      stroke-dasharray: 7 5;
    }
  </style>

  <rect width="700" height="440" fill="var(--diagram-canvas)"/>

  <g id="boundaries" aria-hidden="true">
    <rect class="boundary" x="24" y="140" width="220" height="160" rx="14" vector-effect="non-scaling-stroke"/>
    <rect class="boundary" x="420" y="24" width="250" height="175" rx="14" vector-effect="non-scaling-stroke"/>
    <rect class="boundary" x="420" y="242" width="250" height="175" rx="14" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="connectors" aria-hidden="true">
  </g>

  <g id="components" aria-hidden="true">
    <rect class="runtime" x="59" y="200" width="150" height="65" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="runtime" x="460" y="70" width="170" height="48" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="application" x="460" y="132" width="170" height="48" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="runtime" x="460" y="288" width="170" height="48" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="application" x="460" y="350" width="170" height="48" rx="7" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="labels">
    <text class="label" x="134.0" y="165">Host: PC1</text>
    <text class="label" x="134.0" y="237.5">Registry</text>
    <text class="label" x="545.0" y="49">Host: PC2</text>
    <text class="label" x="545.0" y="99.0">Node A</text>
    <text class="label" x="545.0" y="161.0">Server X</text>
    <text class="label" x="545.0" y="267">Host: PC3</text>
    <text class="label" x="545.0" y="317.0">Node B</text>
    <text class="label" x="545.0" y="379.0">Server Y</text>
  </g>
</svg>
