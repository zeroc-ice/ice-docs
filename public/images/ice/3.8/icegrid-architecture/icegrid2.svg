<?xml version="1.0" encoding="UTF-8"?>
<svg
  width="700"
  height="228"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 700 228"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">IceGrid architecture on blade hosts</title>
  <desc id="description">
    Blade 1 runs the registry, Node 1, and Server 1. Blade 2 runs Node 2 and Server 2. Further blades follow the
    same pattern through Blade N.
  </desc>

  <style>
    :root {
      --diagram-canvas: #ffffff;
      --diagram-component: #ffffff;
      --diagram-text: #182235;
      --diagram-component-stroke: #8d99aa;
      --diagram-runtime-stroke: #1259d6;
      --diagram-runtime: #eef5ff;
      --diagram-host-stroke: #cbd3de;
      --diagram-host: #fbfcfe;
    }

    @media screen and (prefers-color-scheme: dark) {
      :root {
        --diagram-canvas: #1a1c21;
        --diagram-component: #232429;
        --diagram-text: #e6ebf4;
        --diagram-component-stroke: #8391a6;
        --diagram-runtime-stroke: #6aa6ff;
        --diagram-runtime: #21324c;
        --diagram-host-stroke: #667389;
        --diagram-host: #20232b;
      }
    }

    text {
      fill: var(--diagram-text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .label {
      font-size: 16px;
      font-weight: 600;
      text-anchor: middle;
    }
    .application {
      fill: var(--diagram-component);
      stroke: var(--diagram-component-stroke);
      stroke-width: 1.5;
    }
    .runtime {
      fill: var(--diagram-runtime);
      stroke: var(--diagram-runtime-stroke);
      stroke-width: 1.75;
    }
    .boundary {
      fill: var(--diagram-host);
      stroke: var(--diagram-host-stroke);
      stroke-width: 1.5;
      stroke-dasharray: 7 5;
    }
  </style>

  <rect width="700" height="228" fill="var(--diagram-canvas)"/>

  <g id="boundaries" aria-hidden="true">
    <rect class="boundary" x="16" y="16" width="190" height="196" rx="14" vector-effect="non-scaling-stroke"/>
    <rect class="boundary" x="230" y="16" width="190" height="196" rx="14" vector-effect="non-scaling-stroke"/>
    <rect class="boundary" x="494" y="16" width="190" height="196" rx="14" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="connectors" aria-hidden="true">
  </g>

  <g id="components" aria-hidden="true">
    <rect class="runtime" x="36" y="58" width="150" height="38" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="runtime" x="36" y="108" width="150" height="38" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="application" x="36" y="158" width="150" height="38" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="runtime" x="250" y="76" width="150" height="48" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="application" x="250" y="142" width="150" height="48" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="runtime" x="514" y="76" width="150" height="48" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="application" x="514" y="142" width="150" height="48" rx="7" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="labels">
    <text class="label" x="111" y="41">Host: Blade 1</text>
    <text class="label" x="111" y="82.5">Registry</text>
    <text class="label" x="111" y="132.5">Node 1</text>
    <text class="label" x="111" y="182.5">Server 1</text>
    <text class="label" x="325" y="41">Host: Blade 2</text>
    <text class="label" x="325" y="105.5">Node 2</text>
    <text class="label" x="325" y="171.5">Server 2</text>
    <text class="label" x="589" y="41">Host: Blade N</text>
    <text class="label" x="589" y="105.5">Node N</text>
    <text class="label" x="589" y="171.5">Server N</text>
    <text class="label" x="457" y="125">⋯</text>
  </g>
</svg>
