<?xml version="1.0" encoding="UTF-8"?>
<svg
  width="700"
  height="536.54"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 728 558"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Readers and writers using one broker</title>
  <desc id="description">
    Two writers and two readers connect to a broker node listening on TCP port 10000. All arrows point toward the broker
    because the readers and writers initiate the connections.
  </desc>

  <defs>
    <marker
      id="arrow"
      viewBox="0 0 8 8"
      refX="7.2"
      refY="4"
      markerWidth="7"
      markerHeight="7"
      orient="auto-start-reverse"
    >
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="var(--diagram-connector)"/>
    </marker>
  </defs>

  <style>
    :root {
      --diagram-canvas: #ffffff;
      --diagram-component: #ffffff;
      --diagram-text: #182235;
      --diagram-secondary-text: #566174;
      --diagram-connector: #566174;
      --diagram-component-stroke: #8d99aa;
      --diagram-runtime-stroke: #1259d6;
      --diagram-runtime: #eef5ff;
    }

    @media screen and (prefers-color-scheme: dark) {
      :root {
        --diagram-canvas: #1a1c21;
        --diagram-component: #232429;
        --diagram-text: #e6ebf4;
        --diagram-secondary-text: #a7b3c6;
        --diagram-connector: #a7b3c6;
        --diagram-component-stroke: #8391a6;
        --diagram-runtime-stroke: #6aa6ff;
        --diagram-runtime: #21324c;
      }
    }

    text {
      fill: var(--diagram-text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .label {
      font-size: 16px;
      font-weight: 600;
      text-anchor: middle;
    }
    .annotation {
      fill: var(--diagram-secondary-text);
      font-size: 14px;
      text-anchor: middle;
    }
    .code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }
    .application {
      fill: var(--diagram-component);
      stroke: var(--diagram-component-stroke);
      stroke-width: 1.5;
    }
    .runtime {
      fill: var(--diagram-runtime);
      stroke: var(--diagram-runtime-stroke);
      stroke-width: 1.75;
    }
    .connector {
      fill: none;
      stroke: var(--diagram-connector);
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .one-way {
      marker-end: url(#arrow);
    }
  </style>

  <rect width="728" height="558" fill="var(--diagram-canvas)"/>

  <g id="boundaries" aria-hidden="true">
  </g>

  <g id="connectors" aria-hidden="true">
    <path class="connector one-way" d="M 264 144 V 214" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 464 144 V 214" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 264 404 V 334" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 464 404 V 334" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="components" aria-hidden="true">
    <rect class="application" x="24" y="24" width="300" height="120" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="application" x="404" y="24" width="300" height="120" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="runtime" x="204" y="214" width="320" height="120" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="application" x="24" y="404" width="300" height="120" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="application" x="404" y="404" width="300" height="120" rx="7" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="labels">
    <text class="label" x="174.0" y="56">Writer</text>
    <text class="annotation code" x="174.0" y="86">DataStorm.Node.ConnectTo=</text>
    <text class="annotation code" x="174.0" y="106">tcp -p 10000 -h &lt;host&gt;</text>
    <text class="label" x="554.0" y="56">Writer</text>
    <text class="annotation code" x="554.0" y="86">DataStorm.Node.ConnectTo=</text>
    <text class="annotation code" x="554.0" y="106">tcp -p 10000 -h &lt;host&gt;</text>
    <text class="label" x="364.0" y="246">Broker node</text>
    <text class="annotation code" x="364.0" y="276">DataStorm.Node.Server.Endpoints=</text>
    <text class="annotation code" x="364.0" y="296">tcp -p 10000</text>
    <text class="label" x="174.0" y="436">Reader</text>
    <text class="annotation code" x="174.0" y="466">DataStorm.Node.ConnectTo=</text>
    <text class="annotation code" x="174.0" y="486">tcp -p 10000 -h &lt;host&gt;</text>
    <text class="label" x="554.0" y="436">Reader</text>
    <text class="annotation code" x="554.0" y="466">DataStorm.Node.ConnectTo=</text>
    <text class="annotation code" x="554.0" y="486">tcp -p 10000 -h &lt;host&gt;</text>
  </g>
</svg>
