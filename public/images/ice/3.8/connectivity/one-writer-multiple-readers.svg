<?xml version="1.0" encoding="UTF-8"?>
<svg
  width="700"
  height="298.96"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 768 328"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">One writer and multiple readers</title>
  <desc id="description">
    Two readers connect to a writer listening on TCP port 10000. The arrows show who initiates each connection.
  </desc>

  <defs>
    <marker
      id="arrow"
      viewBox="0 0 8 8"
      refX="7.2"
      refY="4"
      markerWidth="7"
      markerHeight="7"
      orient="auto-start-reverse"
    >
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="var(--diagram-connector)"/>
    </marker>
  </defs>

  <style>
    :root {
      --diagram-canvas: #ffffff;
      --diagram-component: #ffffff;
      --diagram-text: #182235;
      --diagram-secondary-text: #566174;
      --diagram-connector: #566174;
      --diagram-component-stroke: #8d99aa;
    }

    @media screen and (prefers-color-scheme: dark) {
      :root {
        --diagram-canvas: #1a1c21;
        --diagram-component: #232429;
        --diagram-text: #e6ebf4;
        --diagram-secondary-text: #a7b3c6;
        --diagram-connector: #a7b3c6;
        --diagram-component-stroke: #8391a6;
      }
    }

    text {
      fill: var(--diagram-text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .label {
      font-size: 16px;
      font-weight: 600;
      text-anchor: middle;
    }
    .annotation {
      fill: var(--diagram-secondary-text);
      font-size: 14px;
      text-anchor: middle;
    }
    .code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }
    .application {
      fill: var(--diagram-component);
      stroke: var(--diagram-component-stroke);
      stroke-width: 1.5;
    }
    .connector {
      fill: none;
      stroke: var(--diagram-connector);
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .one-way {
      marker-end: url(#arrow);
    }
  </style>

  <rect width="768" height="328" fill="var(--diagram-canvas)"/>

  <g id="boundaries" aria-hidden="true">
  </g>

  <g id="connectors" aria-hidden="true">
    <path class="connector one-way" d="M 444 124 H 344" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 444 204 H 344" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="components" aria-hidden="true">
    <rect class="application" x="24" y="104" width="320" height="120" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="application" x="444" y="24" width="300" height="120" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="application" x="444" y="184" width="300" height="120" rx="7" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="labels">
    <text class="label" x="184.0" y="136">Writer</text>
    <text class="annotation code" x="184.0" y="166">DataStorm.Node.Server.Endpoints=</text>
    <text class="annotation code" x="184.0" y="186">tcp -p 10000</text>
    <text class="label" x="594.0" y="56">Reader</text>
    <text class="annotation code" x="594.0" y="86">DataStorm.Node.ConnectTo=</text>
    <text class="annotation code" x="594.0" y="106">tcp -p 10000 -h &lt;host&gt;</text>
    <text class="label" x="594.0" y="216">Reader</text>
    <text class="annotation code" x="594.0" y="246">DataStorm.Node.ConnectTo=</text>
    <text class="annotation code" x="594.0" y="266">tcp -p 10000 -h &lt;host&gt;</text>
  </g>
</svg>
