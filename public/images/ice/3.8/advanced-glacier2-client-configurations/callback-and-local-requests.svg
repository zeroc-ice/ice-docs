<?xml version="1.0" encoding="UTF-8"?>
<svg
  width="700"
  height="292.59"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 756 316"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Local requests and Glacier2 callbacks</title>
  <desc id="description">
    A local client at 10.0.0.2 calls the callback client at 10.0.0.1. The callback client reuses a bidirectional
    connection through its firewall at 1.2.3.4 to Glacier2. Both Glacier2 endpoint sets use 10.0.0.1. The server at
    10.0.0.2 uses a separate callback connection.
  </desc>

  <defs>
    <marker
      id="arrow"
      viewBox="0 0 8 8"
      refX="7.2"
      refY="4"
      markerWidth="7"
      markerHeight="7"
      orient="auto-start-reverse"
    >
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#566174"/>
    </marker>
  </defs>

  <style>
    text {
      fill: #182235;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .label {
      font-size: 16px;
      font-weight: 600;
      text-anchor: middle;
    }
    .annotation {
      fill: #566174;
      font-size: 14px;
      text-anchor: middle;
    }
    .zone-label {
      fill: #566174;
      font-size: 14px;
      font-weight: 650;
    }
    .legend-label {
      fill: #566174;
      font-size: 14px;
      font-weight: 500;
    }
    .application {
      fill: #ffffff;
      stroke: #8d99aa;
      stroke-width: 1.5;
    }
    .service {
      fill: #eef5ff;
      stroke: #1259d6;
      stroke-width: 1.75;
    }
    .firewall {
      fill: #eef0f3;
      stroke: #566174;
      stroke-width: 1.75;
    }
    .network-boundary {
      fill: none;
      stroke: #7a8699;
      stroke-width: 1.5;
      stroke-dasharray: 7 5;
    }
    .divider {
      fill: none;
      stroke: #a6afbc;
      stroke-width: 1.25;
    }
    .connector {
      fill: none;
      stroke: #566174;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .one-way {
      marker-end: url(#arrow);
    }
    .two-way {
      marker-start: url(#arrow);
      marker-end: url(#arrow);
    }
    .callback {
      stroke-dasharray: 6 4;
      marker-end: url(#arrow);
    }
    .through-firewall {
      stroke-dasharray: 2 5;
    }
  </style>

  <rect width="756" height="316" fill="#ffffff"/>

  <g id="boundaries" aria-hidden="true">
    <path class="network-boundary" d="M 448 16 V 276" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="connectors" aria-hidden="true">
    <path class="connector one-way" d="M 144 80 H 164 V 172 H 144" vector-effect="non-scaling-stroke"/>
    <path class="connector two-way" d="M 144 208 H 328" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 568 116 H 612" vector-effect="non-scaling-stroke"/>
    <path class="connector callback" d="M 612 208 H 568" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="components" aria-hidden="true">
    <rect class="application" x="24" y="48" width="120" height="64" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="application" x="24" y="152" width="120" height="80" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="firewall" x="188" y="96" width="96" height="136" rx="3" vector-effect="non-scaling-stroke"/>
    <path class="connector through-firewall" d="M 188 208 H 284" vector-effect="non-scaling-stroke"/>
    <rect class="service" x="328" y="96" width="240" height="136" rx="8" vector-effect="non-scaling-stroke"/>
    <path class="divider" d="M 328 136 H 568 M 448 136 V 232" vector-effect="non-scaling-stroke"/>
    <rect class="application" x="612" y="96" width="120" height="136" rx="7" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="labels">
    <text class="zone-label" x="436" y="30" text-anchor="end">Client network</text>
    <text class="zone-label" x="460" y="30">Server network</text>
    <text class="label" x="84" y="85.5">Local client</text>
    <text class="label" x="84" y="187.5">
      <tspan x="84" dy="0">Callback</tspan>
      <tspan x="84" dy="20">client</tspan>
    </text>
    <text class="label" x="236" y="122">Firewall</text>
    <text class="label" x="448" y="122">Glacier2</text>
    <text class="label" x="388" y="178">
      <tspan x="388" dy="0">Client</tspan>
      <tspan x="388" dy="20">endpoints</tspan>
    </text>
    <text class="label" x="508" y="178">
      <tspan x="508" dy="0">Server</tspan>
      <tspan x="508" dy="20">endpoints</tspan>
    </text>
    <text class="label" x="672" y="169.5">Server</text>
    <text class="annotation" x="84" y="136">IP: 10.0.0.2</text>
    <text class="annotation" x="84" y="256">IP: 10.0.0.1</text>
    <text class="annotation" x="236" y="256">IP: 1.2.3.4</text>
    <text class="annotation" x="388" y="256">IP: 10.0.0.1</text>
    <text class="annotation" x="508" y="256">IP: 10.0.0.1</text>
    <text class="annotation" x="672" y="256">IP: 10.0.0.2</text>
    <path class="connector two-way" d="M 24 300 H 60" vector-effect="non-scaling-stroke"/>
    <text class="legend-label" x="70" y="305">Bidirectional connection</text>
    <path class="connector one-way" d="M 270 300 H 306" vector-effect="non-scaling-stroke"/>
    <text class="legend-label" x="316" y="305">Request</text>
    <path class="connector callback" d="M 400 300 H 436" vector-effect="non-scaling-stroke"/>
    <text class="legend-label" x="446" y="305">Callback</text>
  </g>
</svg>
