<?xml version="1.0" encoding="UTF-8"?>
<svg
  width="700"
  height="266.67"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 756 288"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Multiple clients and servers with Glacier2</title>
  <desc id="description">
    Clients A and B use bidirectional connections through their firewall to Glacier2. Glacier2 forwards requests to
    servers A and B, which send callbacks to Glacier2 over separate connections.
  </desc>

  <defs>
    <marker
      id="arrow"
      viewBox="0 0 8 8"
      refX="7.2"
      refY="4"
      markerWidth="7"
      markerHeight="7"
      orient="auto-start-reverse"
    >
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#566174"/>
    </marker>
  </defs>

  <style>
    text {
      fill: #182235;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .label {
      font-size: 16px;
      font-weight: 600;
      text-anchor: middle;
    }
    .zone-label {
      fill: #566174;
      font-size: 14px;
      font-weight: 650;
    }
    .legend-label {
      fill: #566174;
      font-size: 14px;
      font-weight: 500;
    }
    .application {
      fill: #ffffff;
      stroke: #8d99aa;
      stroke-width: 1.5;
    }
    .service {
      fill: #eef5ff;
      stroke: #1259d6;
      stroke-width: 1.75;
    }
    .firewall {
      fill: #eef0f3;
      stroke: #566174;
      stroke-width: 1.75;
    }
    .network-boundary {
      fill: none;
      stroke: #7a8699;
      stroke-width: 1.5;
      stroke-dasharray: 7 5;
    }
    .divider {
      fill: none;
      stroke: #a6afbc;
      stroke-width: 1.25;
    }
    .connector {
      fill: none;
      stroke: #566174;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .one-way {
      marker-end: url(#arrow);
    }
    .two-way {
      marker-start: url(#arrow);
      marker-end: url(#arrow);
    }
    .callback {
      stroke-dasharray: 6 4;
      marker-end: url(#arrow);
    }
  </style>

  <rect width="756" height="288" fill="#ffffff"/>

  <g id="boundaries" aria-hidden="true">
    <path class="network-boundary" d="M 300 16 V 244" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="connectors" aria-hidden="true">
    <path class="connector two-way" d="M 144 84 H 184" vector-effect="non-scaling-stroke"/>
    <path class="connector two-way" d="M 144 192 H 184" vector-effect="non-scaling-stroke"/>
    <path class="connector two-way" d="M 280 158 H 320" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 560 88 H 612" vector-effect="non-scaling-stroke"/>
    <path class="connector callback" d="M 612 120 H 560" vector-effect="non-scaling-stroke"/>
    <path class="connector one-way" d="M 560 164 H 612" vector-effect="non-scaling-stroke"/>
    <path class="connector callback" d="M 612 196 H 560" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="components" aria-hidden="true">
    <rect class="application" x="24" y="48" width="120" height="72" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="application" x="24" y="156" width="120" height="72" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="firewall" x="184" y="48" width="96" height="180" rx="3" vector-effect="non-scaling-stroke"/>
    <rect class="service" x="320" y="70" width="240" height="136" rx="8" vector-effect="non-scaling-stroke"/>
    <path class="divider" d="M 320 110 H 560 M 440 110 V 206" vector-effect="non-scaling-stroke"/>
    <rect class="application" x="612" y="48" width="120" height="88" rx="7" vector-effect="non-scaling-stroke"/>
    <rect class="application" x="612" y="148" width="120" height="80" rx="7" vector-effect="non-scaling-stroke"/>
  </g>

  <g id="labels">
    <text class="zone-label" x="288" y="30" text-anchor="end">Client network</text>
    <text class="zone-label" x="312" y="30">Server network</text>
    <text class="label" x="84" y="89.5">Client A</text>
    <text class="label" x="84" y="197.5">Client B</text>
    <text class="label" x="232" y="74">Firewall</text>
    <text class="label" x="440" y="96">Glacier2</text>
    <text class="label" x="380" y="152">
      <tspan x="380" dy="0">Client</tspan>
      <tspan x="380" dy="20">endpoints</tspan>
    </text>
    <text class="label" x="500" y="152">
      <tspan x="500" dy="0">Server</tspan>
      <tspan x="500" dy="20">endpoints</tspan>
    </text>
    <text class="label" x="672" y="97.5">Server A</text>
    <text class="label" x="672" y="193.5">Server B</text>
    <path class="connector two-way" d="M 24 272 H 60" vector-effect="non-scaling-stroke"/>
    <text class="legend-label" x="70" y="277">Bidirectional connection</text>
    <path class="connector one-way" d="M 270 272 H 306" vector-effect="non-scaling-stroke"/>
    <text class="legend-label" x="316" y="277">Request</text>
    <path class="connector callback" d="M 400 272 H 436" vector-effect="non-scaling-stroke"/>
    <text class="legend-label" x="446" y="277">Callback</text>
  </g>
</svg>
